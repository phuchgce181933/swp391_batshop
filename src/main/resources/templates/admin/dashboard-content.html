<link rel="stylesheet" th:href="@{/css/admin/dashboard.css}">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="main-content">

    <h1>Dashboard Overview</h1>

    <div class="cards">
        <div class="card">
            <h3>Total Products</h3>
            <p th:text="${totalProducts}">0</p>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <p th:text="${totalOrders}">0</p>
        </div>

        <div class="card">
            <h3>Total Users</h3>
            <p th:text="${totalUsers}">0</p>
        </div>

        <div class="card revenue">
            <h3>Total Revenue</h3>
            <p th:text="${#numbers.formatDecimal(totalRevenue,0,'COMMA',0,'POINT')} + ' VND'">
                0
            </p>
        </div>
    </div>

    <div class="tables-wrapper">

        <!-- Bảng 1 -->
        <div class="table-box">
            <h2>Product Sales By Month</h2>
            <table>
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Month</th>
                    <th>Quantity</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${productSales}">
                    <td th:text="${row[0]}"></td>
                    <td th:text="'Month ' + ${row[1]}"></td>
                    <td th:text="${row[2]}"></td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Bảng 2 -->
        <div class="table-box">
            <h2>Product Sales Detail</h2>
            <table>
                <thead>
                <tr>
                    <th>Product</th>
                    <th>Date Time</th>
                    <th>Quantity Sold</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="row : ${productSalesByDate}">
                    <td th:text="${row[0]}"></td>
                    <td th:text="${#temporals.format(row[1], 'dd/MM/yyyy HH:mm')}"></td>
                    <td th:text="${row[2]}"></td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>

    <div class="chart-container">
        <canvas id="revenueChart"></canvas>
    </div>

</div>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {

        const months = /*[[${months}]]*/ [];
        const revenues = /*[[${revenues}]]*/ [];

        console.log(months);
        console.log(revenues);

        const ctx = document.getElementById("revenueChart");

        if (ctx && months.length > 0) {
            new Chart(ctx, {
                type: "line",
                data: {
                    labels: months,
                    datasets: [{
                        label: "Revenue",
                        data: revenues,
                        borderColor: "#4e73df",
                        backgroundColor: "rgba(78,115,223,0.1)",
                        tension: 0.4,
                        fill: true
                    }]
                }
            });
        }

    });
</script>
