<link rel="stylesheet" th:href="@{/css/admin/dashboard.css}" />
<div th:fragment="content" class="main-content">

    <h1>Dashboard Overview</h1>

    <div class="cards">
        <div class="card">
            <h3>Total Products</h3>
            <p th:text="${totalProducts}">0</p>
        </div>

        <div class="card">
            <h3>Total Orders</h3>
            <p th:text="${totalOrders}">0</p>
        </div>

        <div class="card">
            <h3>Total Users</h3>
            <p th:text="${totalUsers}">0</p>
        </div>

        <div class="card revenue">
            <h3>Total Revenue</h3>
            <p th:text="${#numbers.formatDecimal(totalRevenue ?: 0,0,'COMMA',0,'POINT')} + ' VND'"></p>
        </div>

        <div class="card">
            <h3>Revenue (3 days)</h3>
            <p th:text="${#numbers.formatDecimal(revenue3Days ?: 0,0,'COMMA',0,'POINT')} + ' VND'"></p>
        </div>

        <div class="card">
            <h3>Revenue (7 days)</h3>
            <p th:text="${#numbers.formatDecimal(revenue7Days ?: 0,0,'COMMA',0,'POINT')} + ' VND'"></p>
        </div>
    </div>

    <div class="chart-header">
        <h3>Revenue Chart</h3>

        <select id="filterRange" onchange="changeFilter()">
            <option value="3">3 days</option>
            <option value="7">7 days</option>
            <option value="30">1 month</option>
        </select>
    </div>

    <div class="chart-container">
        <canvas id="revenueChart"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script th:inline="javascript">
        let chart;

        function renderChart(labels, data) {
            const ctx = document.getElementById("revenueChart");

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: "line",
                data: {
                    labels: labels,
                    datasets: [{
                        label: "Revenue",
                        data: data,
                        borderColor: "#4e73df",
                        backgroundColor: "rgba(78,115,223,0.1)",
                        tension: 0.4,
                        fill: true
                    }]
                }
            });
        }

        function changeFilter() {
            const days = document.getElementById("filterRange").value;

            fetch(`/admin/dashboard/chart?days=${days}`)
                .then(res => res.json())
                .then(data => {
                    renderChart(data.labels, data.values);
                });
        }

        document.addEventListener("DOMContentLoaded", function () {
            changeFilter();
        });
    </script>
</div>
