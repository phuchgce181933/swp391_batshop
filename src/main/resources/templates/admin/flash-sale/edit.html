<div th:fragment="content">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/flash-sale.css}">

    <div class="container-fluid">
        <div class="fs-admin-header mt-3 d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
            <h2 class="fs-admin-title m-0">Cập Nhật Flash Sale #<span th:text="${flashSale.id}"></span></h2>
            <a th:href="@{/admin/flash-sales}" class="fs-btn fs-btn-secondary text-decoration-none">
                <i class="fas fa-arrow-left"></i>&larr; Quay lại danh sách
            </a>
        </div>

        <div class="row align-items-start">
            <div class="col-12">
                <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3" role="alert" style="border-radius: 6px;">
                    <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${errorMessage}"></span>
                </div>
                <div th:if="${successMessage}" class="alert alert-success d-flex align-items-center mb-3" role="alert" style="border-radius: 6px;">
                    <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
                </div>
            </div>

            <div class="col-12 col-lg-4 mb-4">
                <div class="fs-admin-card p-4 h-100 border-0 shadow-sm" style="border-radius: 10px;">
                    <div class="border-bottom mb-4 pb-2">
                        <h4 class="m-0" style="color: #0d6efd; border-left: 4px solid #f15a22; padding-left: 10px; font-weight: 600; font-size: 1.2rem;">
                            Cài đặt thông số
                        </h4>
                    </div>

                    <form id="flashSaleForm" th:action="@{/admin/flash-sales/edit}" th:object="${flashSale}" method="POST">
                        <input type="hidden" th:field="*{id}">

                        <div class="fs-form-group mb-3">
                            <label class="fs-form-label fw-bold" style="font-size: 0.95rem;">Giảm Giá (%)</label>
                            <input type="number" class="fs-form-control" th:field="*{discountPercent}" min="1" max="100" required>
                        </div>

                        <div class="fs-form-group mb-3">
                            <label class="fs-form-label fw-bold" style="font-size: 0.95rem;">Ngày Sale</label>
                            <input type="date" class="fs-form-control" name="saleDate" id="saleDate" required
                                   th:value="${#temporals.format(flashSale.startDate, 'yyyy-MM-dd')}">
                        </div>

                        <div class="row">
                            <div class="col-6 fs-form-group mb-3">
                                <label class="fs-form-label fw-bold" style="font-size: 0.95rem;">Giờ bắt đầu</label>
                                <input type="time" class="fs-form-control" name="startTime" id="startTime" required
                                       th:value="${#temporals.format(flashSale.startDate, 'HH:mm')}">
                            </div>

                            <div class="col-6 fs-form-group mb-4">
                                <label class="fs-form-label fw-bold" style="font-size: 0.95rem;">Giờ kết thúc</label>
                                <input type="time" class="fs-form-control" name="endTime" id="endTime" required
                                       th:value="${#temporals.format(flashSale.endDate, 'HH:mm')}">
                            </div>
                        </div>

                        <div id="jsErrorMessage" class="alert alert-danger" style="display: none; padding: 10px; border-radius: 6px; font-weight: 500; margin-bottom: 15px;">
                            <i class="fas fa-exclamation-circle"></i> <span id="jsErrorText"></span>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2" style="background-color: #0d6efd; border: none; border-radius: 6px;">
                            <i class="fas fa-save me-1"></i> Cập nhật thông số
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-12 col-lg-8">
                <div class="fs-admin-card p-4 border-0 shadow-sm" style="border-radius: 10px;">
                    <div class="border-bottom mb-4 pb-2 d-flex justify-content-between align-items-center">
                        <h4 class="m-0" style="color: #198754; border-left: 4px solid #f15a22; padding-left: 10px; font-weight: 600; font-size: 1.2rem;">
                            Sản phẩm trong đợt Flash Sale
                        </h4>
                        <button type="button" class="btn btn-success fw-bold px-3 py-1" data-bs-toggle="modal" data-bs-target="#addProductModal" style="border-radius: 6px;">
                            <i class="fas fa-plus-circle me-1"></i>+ Thêm Sản Phẩm
                        </button>
                    </div>

                    <div class="fs-table-wrapper">
                        <table class="fs-table">
                            <thead>
                            <tr>
                                <th class="text-start" style="padding-left: 20px;">Tên sản phẩm</th>
                                <th>Giá gốc</th>
                                <th>Giá Flash Sale</th>
                                <th>Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="fsp : ${flashSale.products}">
                                <td class="text-start" style="padding-left: 20px;">
                                    <div class="fw-bold" style="color: #2c3e50; font-size: 0.95rem;" th:text="${fsp.product.name}"></div>
                                    <div class="mt-1">
                                        <span class="badge bg-info text-dark" style="font-size: 0.7rem;" th:text="${fsp.product.category != null ? fsp.product.category.name : 'Khác'}"></span>
                                        <span class="badge text-white" style="background-color: #6c757d; font-size: 0.7rem;" th:text="${fsp.product.brand != null ? fsp.product.brand.name : 'Khác'}"></span>
                                    </div>
                                </td>
                                <td class="fs-price-original" th:text="${#numbers.formatDecimal(fsp.product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                <td class="fs-price-sale" th:text="${#numbers.formatDecimal(fsp.salePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                                <td>
                                    <a th:href="@{/admin/flash-sales/{fsId}/remove-product/{fspId}(fsId=${flashSale.id}, fspId=${fsp.id})}"
                                       class="fs-btn fs-btn-sm" style="background-color: #fff; color: #e74c3c; border: 1px solid #e74c3c;"
                                       onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này khỏi Flash Sale?');"
                                       onmouseover="this.style.backgroundColor='#e74c3c'; this.style.color='#fff';"
                                       onmouseout="this.style.backgroundColor='#fff'; this.style.color='#e74c3c';">
                                        <i class="fas fa-trash me-1"></i> Xóa
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${flashSale.products.isEmpty()}">
                                <td colspan="4" class="fs-empty-state">
                                    <i class="fas fa-box-open fa-3x"></i>
                                    <h5>Chưa có sản phẩm</h5>
                                    <p>Bấm nút "Thêm Sản Phẩm" ở góc phải để cấu hình ưu đãi.</p>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content" style="border-radius: 12px; border: none;">

                <div class="modal-header bg-light" style="border-radius: 12px 12px 0 0;">
                    <h5 class="modal-title fw-bold text-success" id="addProductModalLabel">
                        <i class="fas fa-check-square me-1"></i> Thêm sản phẩm vào Flash Sale
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body bg-light pt-2">

                    <div class="row g-2 mb-3">
                        <div class="col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" id="filterName" class="form-control border-start-0 ps-0" placeholder="Tìm tên sản phẩm...">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select id="filterCategory" class="form-select text-muted">
                                <option value="">-- Tất cả Danh mục --</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select id="filterBrand" class="form-select text-muted">
                                <option value="">-- Tất cả Hãng --</option>
                            </select>
                        </div>
                    </div>

                    <form th:action="@{/admin/flash-sales/{id}/add-product(id=${flashSale.id})}" method="POST" id="addProductsForm">
                        <div class="product-checklist bg-white shadow-sm" style="border: 1px solid #dee2e6; border-radius: 6px;">
                            <div class="list-group list-group-flush" id="productListContainer">

                                <label th:each="p : ${products}"
                                       class="list-group-item d-flex justify-content-between align-items-center py-2 px-3 list-group-item-action product-item-row"
                                       style="cursor: pointer; border-bottom: 1px solid #f0f2f5;"
                                       th:data-category="${p.category != null ? p.category.name : 'Khác'}"
                                       th:data-brand="${p.brand != null ? p.brand.name : 'Khác'}">

                                    <div class="d-flex align-items-center">
                                        <input class="form-check-input me-3 mt-0" type="checkbox" name="productIds"
                                               th:value="${p.id}"
                                               th:disabled="${#lists.contains(addedProductIds, p.id)}"
                                               th:checked="${#lists.contains(addedProductIds, p.id)}"
                                               style="transform: scale(1.2);">

                                        <div>
                                            <span class="product-name fw-bold text-dark" style="font-size: 0.95rem;" th:text="${p.name}"></span>
                                            <div class="mt-1">
                                                <span class="badge bg-info text-dark" style="font-size: 0.7rem;" th:text="${p.category != null ? p.category.name : 'Khác'}"></span>
                                                <span class="badge text-white" style="background-color: #6c757d; font-size: 0.7rem;" th:text="${p.brand != null ? p.brand.name : 'Khác'}"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="text-end">
                                        <span class="text-muted d-block fw-bold" style="font-size: 0.85rem;"
                                              th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                        </span>
                                        <span th:if="${#lists.contains(addedProductIds, p.id)}"
                                              class="badge rounded-pill mt-1"
                                              style="background-color: #198754; color: #fff; font-size: 0.75rem; padding: 5px 10px; box-shadow: 0 2px 4px rgba(25, 135, 84, 0.2);">
      <i class="fas fa-check me-1"></i> Đã thêm
</span>
                                    </div>
                                </label>

                            </div>
                        </div>
                    </form>

                    <nav class="mt-3">
                        <ul class="pagination justify-content-center mb-0" id="paginationControls">
                        </ul>
                    </nav>

                </div>

                <div class="modal-footer bg-white" style="border-radius: 0 0 12px 12px;">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" form="addProductsForm" class="btn btn-success fw-bold px-4">
                        <i class="fas fa-save me-1"></i> Thêm Sản Phẩm
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            // ==========================================
            // 1. TỰ ĐỘNG LẤY DANH MỤC & THƯƠNG HIỆU
            // ==========================================
            const catSet = new Set();
            const brandSet = new Set();
            const productRows = Array.from(document.querySelectorAll('.product-item-row')); // Đổi NodeList thành Array

            productRows.forEach(row => {
                const cat = row.getAttribute('data-category');
                const brand = row.getAttribute('data-brand');
                if (cat) catSet.add(cat);
                if (brand) brandSet.add(brand);
            });

            const filterCategory = document.getElementById('filterCategory');
            catSet.forEach(cat => filterCategory.add(new Option(cat, cat)));

            const filterBrand = document.getElementById('filterBrand');
            brandSet.forEach(brand => filterBrand.add(new Option(brand, brand)));

            // ==========================================
            // 2. LOGIC LỌC SẢN PHẨM & PHÂN TRANG
            // ==========================================
            const filterName = document.getElementById("filterName");
            const paginationControls = document.getElementById("paginationControls");

            const ITEMS_PER_PAGE = 10; // Cài đặt số sản phẩm trên 1 trang
            let currentPage = 1;
            let filteredRows = [];

            // Hàm áp dụng bộ lọc
            function applyFiltersAndPaginate() {
                const nameVal = filterName.value.toLowerCase();
                const catVal = filterCategory.value;
                const brandVal = filterBrand.value;

                filteredRows = productRows.filter(row => {
                    const name = row.querySelector(".product-name").innerText.toLowerCase();
                    const cat = row.getAttribute("data-category");
                    const brand = row.getAttribute("data-brand");

                    const matchName = name.includes(nameVal);
                    const matchCat = (catVal === "" || cat === catVal);
                    const matchBrand = (brandVal === "" || brand === brandVal);

                    return matchName && matchCat && matchBrand;
                });

                currentPage = 1; // Lọc xong thì đưa về trang 1
                renderPage();
            }

            // Hàm hiển thị sản phẩm của trang hiện tại
            function renderPage() {
                // Ẩn tất cả đi
                productRows.forEach(row => row.style.setProperty("display", "none", "important"));

                // Lấy ra các sản phẩm thuộc trang hiện tại
                const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
                const endIndex = startIndex + ITEMS_PER_PAGE;
                const rowsToShow = filteredRows.slice(startIndex, endIndex);

                // Hiển thị chúng lên
                rowsToShow.forEach(row => row.style.setProperty("display", "flex", "important"));

                renderPaginationControls();
            }

            // Hàm tạo nút phân trang
            function renderPaginationControls() {
                paginationControls.innerHTML = '';
                const totalPages = Math.ceil(filteredRows.length / ITEMS_PER_PAGE);

                if (totalPages <= 1) return; // Nếu chỉ có 1 trang thì ẩn thanh phân trang

                // Nút "Trước"
                paginationControls.innerHTML += `
                    <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-page="${currentPage - 1}">&laquo;</a>
                    </li>
                `;

                // Các nút số
                for (let i = 1; i <= totalPages; i++) {
                    paginationControls.innerHTML += `
                        <li class="page-item ${currentPage === i ? 'active' : ''}">
                            <a class="page-link" href="#" data-page="${i}">${i}</a>
                        </li>
                    `;
                }

                // Nút "Sau"
                paginationControls.innerHTML += `
                    <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                        <a class="page-link" href="#" data-page="${currentPage + 1}">&raquo;</a>
                    </li>
                `;
            }

            // Bắt sự kiện click vào nút phân trang
            paginationControls.addEventListener("click", function (e) {
                e.preventDefault();
                if (e.target.tagName === 'A') {
                    const targetPage = parseInt(e.target.getAttribute("data-page"));
                    if (!isNaN(targetPage)) {
                        currentPage = targetPage;
                        renderPage();
                    }
                }
            });

            // Lắng nghe sự kiện lọc
            filterName.addEventListener("keyup", applyFiltersAndPaginate);
            filterCategory.addEventListener("change", applyFiltersAndPaginate);
            filterBrand.addEventListener("change", applyFiltersAndPaginate);

            // Chạy lần đầu tiên khi load web
            applyFiltersAndPaginate();

            // ==========================================
            // 3. BẮT LỖI FORM CÀI ĐẶT THÔNG SỐ (GIỮ NGUYÊN)
            // ==========================================
            const formInfo = document.getElementById("flashSaleForm");
            const errorDivInfo = document.getElementById("jsErrorMessage");
            const errorTextInfo = document.getElementById("jsErrorText");

            formInfo.addEventListener("submit", function (event) {
                errorDivInfo.style.display = "none";
                const startTime = document.getElementById("startTime").value;
                const endTime = document.getElementById("endTime").value;

                if (startTime && endTime && startTime >= endTime) {
                    event.preventDefault();
                    errorTextInfo.innerText = "Giờ kết thúc phải diễn ra sau giờ bắt đầu!";
                    errorTextInfo.style.color = "#dc3545";
                    errorDivInfo.style.backgroundColor = "#f8d7da";
                    errorDivInfo.style.borderColor = "#f5c6cb";
                    errorDivInfo.style.color = "#721c24";
                    errorDivInfo.style.display = "block";
                }
            });
        });
    </script>
</div>
