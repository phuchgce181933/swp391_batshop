<div th:fragment="content">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/flash-sale.css}">

    <div class="container-fluid">
        <div class="fs-admin-header mt-3 d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
            <div class="d-flex align-items-center gap-3">
                <h2 class="fs-admin-title m-0">Cập Nhật Flash Sale #<span th:text="${flashSale.id}"></span></h2>

                <span th:if="${flashSale.status == 'Đang diễn ra'}" class="badge fs-badge-status fs-badge-active">
                    <i class="fas fa-play-circle me-1"></i> Đang diễn ra
                </span>
                <span th:if="${flashSale.status == 'Sắp diễn ra'}" class="badge fs-badge-status fs-badge-upcoming">
                    <i class="fas fa-clock me-1"></i> Sắp diễn ra
                </span>
                <span th:if="${flashSale.status == 'Đã kết thúc'}" class="badge fs-badge-status fs-badge-ended">
                    <i class="fas fa-stop-circle me-1"></i> Đã kết thúc
                </span>
            </div>

            <a th:href="@{/admin/flash-sales}" class="fs-btn fs-btn-secondary text-decoration-none">
                <i class="fas fa-arrow-left"></i> Quay lại danh sách
            </a>
        </div>

        <div class="row align-items-start">
            <div class="col-12">
                <div th:if="${errorMessage}" class="alert alert-danger fs-alert-custom" role="alert">
                    <i class="fas fa-exclamation-triangle me-2"></i> <span th:text="${errorMessage}"></span>
                </div>
                <div th:if="${successMessage}" class="alert alert-success fs-alert-custom" role="alert">
                    <i class="fas fa-check-circle me-2"></i> <span th:text="${successMessage}"></span>
                </div>
            </div>

            <div class="col-12 col-lg-4 mb-4">
                <div class="fs-admin-card p-4 h-100 border-0 shadow-sm">
                    <div class="border-bottom mb-4 pb-2">
                        <h4 class="fs-card-title-blue">Cài đặt thông số</h4>
                    </div>

                    <form id="flashSaleForm" th:action="@{/admin/flash-sales/edit}" th:object="${flashSale}" method="POST">
                        <input type="hidden" th:field="*{id}" id="flashSaleId">

                        <div class="fs-form-group mb-3">
                            <label class="fs-form-label">Ngày Sale</label>
                            <input type="date" class="fs-form-control" name="saleDate" id="saleDate" required
                                   th:value="${#temporals.format(flashSale.startDate, 'yyyy-MM-dd')}">
                        </div>

                        <div class="fs-form-group mb-4">
                            <label class="fs-form-label">Khung Giờ</label>
                            <select class="fs-form-control" name="timeSlot" id="timeSlot" required>
                                <option value="0" th:selected="${flashSale.startDate.hour == 0}">00:00 - 02:00</option>
                                <option value="2" th:selected="${flashSale.startDate.hour == 2}">02:00 - 04:00</option>
                                <option value="4" th:selected="${flashSale.startDate.hour == 4}">04:00 - 06:00</option>
                                <option value="6" th:selected="${flashSale.startDate.hour == 6}">06:00 - 08:00</option>
                                <option value="8" th:selected="${flashSale.startDate.hour == 8}">08:00 - 10:00</option>
                                <option value="10" th:selected="${flashSale.startDate.hour == 10}">10:00 - 12:00</option>
                                <option value="12" th:selected="${flashSale.startDate.hour == 12}">12:00 - 14:00</option>
                                <option value="14" th:selected="${flashSale.startDate.hour == 14}">14:00 - 16:00</option>
                                <option value="16" th:selected="${flashSale.startDate.hour == 16}">16:00 - 18:00</option>
                                <option value="18" th:selected="${flashSale.startDate.hour == 18}">18:00 - 20:00</option>
                                <option value="20" th:selected="${flashSale.startDate.hour == 20}">20:00 - 22:00</option>
                                <option value="22" th:selected="${flashSale.startDate.hour == 22}">22:00 - 24:00</option>
                            </select>
                        </div>

                        <button type="submit" class="fs-btn-submit-blue mt-2 border-0">
                            <i class="fas fa-save me-1"></i> Cập nhật thông số
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-12 col-lg-8">
                <div class="fs-admin-card p-4 border-0 shadow-sm">
                    <div class="border-bottom mb-4 pb-2 d-flex justify-content-between align-items-center">
                        <h4 class="fs-card-title-green">Sản phẩm trong đợt Flash Sale</h4>
                        <button type="button" class="btn btn-success fw-bold px-3 py-1 rounded"
                                data-bs-toggle="modal" data-bs-target="#addProductModal"
                                th:disabled="${flashSale.status == 'Đã kết thúc'}"
                                th:title="${flashSale.status == 'Đã kết thúc' ? 'Đợt Sale đã kết thúc, không thể thêm mới' : 'Thêm sản phẩm'}">
                            <i class="fas fa-plus-circle me-1"></i>+ Thêm Sản Phẩm
                        </button>
                    </div>

                    <div class="fs-table-wrapper">
                        <div th:if="${!flashSale.products.isEmpty()}" class="row g-2 mb-3">
                            <div class="col-md-5">
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                                    <input type="text" id="tableFilterName" class="form-control border-start-0 ps-0" placeholder="Tìm sản phẩm trong đợt sale...">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <select id="tableFilterCategory" class="form-select text-muted">
                                    <option value="">-- Tất cả Danh mục --</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <select id="tableFilterBrand" class="form-select text-muted">
                                    <option value="">-- Tất cả Hãng --</option>
                                </select>
                            </div>
                        </div>

                        <table class="fs-table">
                            <thead>
                            <tr>
                                <th class="text-start fs-pl-20">Tên sản phẩm</th>
                                <th>Giá gốc</th>
                                <th>% Giảm</th>
                                <th>Giá Flash Sale</th>
                                <th>Hành động</th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="fsp : ${flashSale.products}"
                                class="flash-sale-product-row"
                                th:data-category="${fsp.product.category != null ? fsp.product.category.name : 'Khác'}"
                                th:data-brand="${fsp.product.brand != null ? fsp.product.brand.name : 'Khác'}">

                                <td class="text-start fs-pl-20">
                                    <div class="fw-bold fs-product-name table-product-name" th:text="${fsp.product.name}"></div>
                                    <div class="mt-1">
                                        <span class="badge bg-info text-dark fs-badge-sm" th:text="${fsp.product.category != null ? fsp.product.category.name : 'Khác'}"></span>
                                        <span class="badge fs-badge-brand" th:text="${fsp.product.brand != null ? fsp.product.brand.name : 'Khác'}"></span>
                                    </div>
                                </td>

                                <td class="fs-price-original" th:text="${#numbers.formatDecimal(fsp.product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>

                                <td>
                                    <input type="hidden" class="fsp-id-hidden" th:value="${fsp.id}">

                                    <input type="number" name="discountPercent"
                                           th:form="'discount-form-' + ${fsp.id}"
                                           class="form-control form-control-sm text-center mx-auto fs-input-discount"
                                           min="1" max="100"
                                           th:value="${fsp.discountPercent != null && fsp.discountPercent > 0 ? fsp.discountPercent : 1}" required>
                                </td>

                                <td class="fs-price-sale" th:text="${#numbers.formatDecimal(fsp.salePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>

                                <td>
                                    <div class="d-flex align-items-center justify-content-center gap-2">
                                        <form th:id="'discount-form-' + ${fsp.id}"
                                              th:action="@{/admin/flash-sales/{fsId}/update-discount/{fspId}(fsId=${flashSale.id}, fspId=${fsp.id})}"
                                              method="POST" class="m-0">
                                            <button type="submit" class="fs-btn fs-btn-sm fs-btn-save" title="Lưu mức giảm">
                                                Lưu
                                            </button>
                                        </form>

                                        <a th:href="@{/admin/flash-sales/{fsId}/remove-product/{fspId}(fsId=${flashSale.id}, fspId=${fsp.id})}"
                                           class="fs-btn fs-btn-sm fs-btn-outline-danger"
                                           onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này khỏi Flash Sale?');">
                                            <i class="fas fa-trash me-1"></i> Xóa
                                        </a>
                                    </div>
                                </td>
                            </tr>

                            <tr th:if="${flashSale.products.isEmpty()}" id="tableEmptyRow">
                                <td colspan="5" class="fs-empty-state">
                                    <i class="fas fa-box-open fa-3x"></i>
                                    <h5>Chưa có sản phẩm</h5>
                                    <p>Hãy "Thêm Sản Phẩm" cho đợt Flash Sale này.</p>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <div class="d-flex justify-content-end mt-3" th:if="${!flashSale.products.isEmpty()}">
                            <button type="button" class="btn btn-primary fw-bold px-4 py-2 shadow-sm rounded-3" id="btnSaveAllDiscounts">
                                <i class="fas fa-save me-1"></i> Lưu tất cả thay đổi
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content fs-modal-content">

                <div class="modal-header bg-light fs-modal-header">
                    <h5 class="modal-title fw-bold text-success" id="addProductModalLabel">
                        <i class="fas fa-check-square me-1"></i> Thêm sản phẩm vào Flash Sale
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body bg-light pt-2">

                    <div class="row g-2 mb-3">
                        <div class="col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
                                <input type="text" id="filterName" class="form-control border-start-0 ps-0" placeholder="Tìm tên sản phẩm...">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <select id="filterCategory" class="form-select text-muted">
                                <option value="">-- Tất cả Danh mục --</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <select id="filterBrand" class="form-select text-muted">
                                <option value="">-- Tất cả Hãng --</option>
                            </select>
                        </div>
                    </div>

                    <form th:action="@{/admin/flash-sales/{id}/add-product(id=${flashSale.id})}" method="POST" id="addProductsForm">
                        <div class="product-checklist bg-white shadow-sm fs-checklist-box">
                            <div class="list-group list-group-flush" id="productListContainer">

                                <label th:each="p : ${products}"
                                       class="list-group-item d-flex justify-content-between align-items-center py-2 px-3 list-group-item-action product-item-row fs-list-item-custom"
                                       th:data-category="${p.category != null ? p.category.name : 'Khác'}"
                                       th:data-brand="${p.brand != null ? p.brand.name : 'Khác'}">

                                    <div class="d-flex align-items-center">
                                        <input class="form-check-input me-3 mt-0 fs-checkbox-scale" type="checkbox" name="productIds"
                                               th:value="${p.id}"
                                               th:disabled="${#lists.contains(addedProductIds, p.id)}"
                                               th:checked="${#lists.contains(addedProductIds, p.id)}">

                                        <div>
                                            <div class="d-flex align-items-center gap-2">
                                                <span class="fs-product-name fw-bold" th:text="${p.name}"></span>
                                                <span th:if="${#lists.contains(addedProductIds, p.id)}" class="badge fs-badge-added">
                                                    Đã thêm
                                                </span>
                                            </div>

                                            <div class="mt-1">
                                                <span class="badge bg-info text-dark fs-badge-sm" th:text="${p.category != null ? p.category.name : 'Khác'}"></span>
                                                <span class="badge fs-badge-brand" th:text="${p.brand != null ? p.brand.name : 'Khác'}"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="text-end">
                                        <span class="text-muted d-block fw-bold fs-text-sm" th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </form>

                    <nav class="mt-3">
                        <ul class="pagination justify-content-center mb-0" id="paginationControls">
                        </ul>
                    </nav>

                </div>

                <div class="modal-footer bg-white fs-modal-footer">
                    <button type="button" class="btn btn-light border" data-bs-dismiss="modal">Hủy</button>
                    <button type="submit" form="addProductsForm" class="btn btn-success fw-bold px-4">
                        <i class="fas fa-save me-1"></i> Thêm Sản Phẩm
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            // 0. FETCH KHUNG GIỜ
            const dateInputEdit = document.getElementById("saleDate");
            const timeSlotSelectEdit = document.getElementById("timeSlot");
            const flashSaleId = document.getElementById("flashSaleId").value;
            const initialSelectedHour = parseInt(timeSlotSelectEdit.value);

            function fetchBookedSlotsEdit() {
                const dateStr = dateInputEdit.value;
                if(!dateStr) return;

                fetch(`/admin/flash-sales/api/booked-slots?date=${dateStr}&excludeId=${flashSaleId}`)
                    .then(response => response.json())
                    .then(bookedHours => {
                        const now = new Date();
                        const isToday = (dateStr === now.toISOString().split('T')[0]);
                        const currentHour = now.getHours();

                        Array.from(timeSlotSelectEdit.options).forEach(opt => {
                            const hour = parseInt(opt.value);
                            const hourText = `${String(hour).padStart(2, '0')}:00 - ${String(hour+2).padStart(2, '0')}:00`;

                            if(bookedHours.includes(hour)) {
                                opt.disabled = true;
                                opt.text = `${hourText} (Đã có sự kiện)`;
                            } else if (isToday && (hour + 2) <= currentHour && hour !== initialSelectedHour) {
                                opt.disabled = true;
                                opt.text = `${hourText} (Đã qua)`;
                            } else {
                                opt.disabled = false;
                                opt.text = hourText;
                            }
                        });
                    });
            }
            fetchBookedSlotsEdit();
            dateInputEdit.addEventListener("change", fetchBookedSlotsEdit);

            // 1. TỰ ĐỘNG LẤY DANH MỤC & THƯƠNG HIỆU CHO POPUP
            const popupCatSet = new Set();
            const popupBrandSet = new Set();
            const popupProductRows = Array.from(document.querySelectorAll('.product-item-row'));

            popupProductRows.forEach(row => {
                const cat = row.getAttribute('data-category');
                const brand = row.getAttribute('data-brand');
                if (cat) popupCatSet.add(cat);
                if (brand) popupBrandSet.add(brand);
            });

            const filterCategory = document.getElementById('filterCategory');
            popupCatSet.forEach(cat => filterCategory.add(new Option(cat, cat)));

            const filterBrand = document.getElementById('filterBrand');
            popupBrandSet.forEach(brand => filterBrand.add(new Option(brand, brand)));


            // 2. LOGIC LỌC SẢN PHẨM & PHÂN TRANG CỦA POPUP
            const filterName = document.getElementById("filterName");
            const paginationControls = document.getElementById("paginationControls");
            const ITEMS_PER_PAGE = 10;
            let currentPage = 1;
            let filteredRows = [];

            function applyFiltersAndPaginate() {
                const nameVal = filterName.value.toLowerCase();
                const catVal = filterCategory.value;
                const brandVal = filterBrand.value;

                filteredRows = popupProductRows.filter(row => {
                    const name = row.querySelector(".fs-product-name").innerText.toLowerCase();
                    const cat = row.getAttribute("data-category");
                    const brand = row.getAttribute("data-brand");

                    const matchName = name.includes(nameVal);
                    const matchCat = (catVal === "" || cat === catVal);
                    const matchBrand = (brandVal === "" || brand === brandVal);

                    return matchName && matchCat && matchBrand;
                });

                currentPage = 1;
                renderPage();
            }

            function renderPage() {
                popupProductRows.forEach(row => row.style.setProperty("display", "none", "important"));
                const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
                const endIndex = startIndex + ITEMS_PER_PAGE;
                const rowsToShow = filteredRows.slice(startIndex, endIndex);
                rowsToShow.forEach(row => row.style.setProperty("display", "flex", "important"));
                renderPaginationControls();
            }

            function renderPaginationControls() {
                paginationControls.innerHTML = '';
                const totalPages = Math.ceil(filteredRows.length / ITEMS_PER_PAGE);

                if (totalPages <= 1) return;

                paginationControls.innerHTML += `<li class="page-item ${currentPage === 1 ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage - 1}">&laquo;</a></li>`;
                for (let i = 1; i <= totalPages; i++) {
                    paginationControls.innerHTML += `<li class="page-item ${currentPage === i ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
                }
                paginationControls.innerHTML += `<li class="page-item ${currentPage === totalPages ? 'disabled' : ''}"><a class="page-link" href="#" data-page="${currentPage + 1}">&raquo;</a></li>`;
            }

            paginationControls.addEventListener("click", function (e) {
                e.preventDefault();
                if (e.target.tagName === 'A') {
                    const targetPage = parseInt(e.target.getAttribute("data-page"));
                    if (!isNaN(targetPage)) {
                        currentPage = targetPage;
                        renderPage();
                    }
                }
            });

            filterName.addEventListener("keyup", applyFiltersAndPaginate);
            filterCategory.addEventListener("change", applyFiltersAndPaginate);
            filterBrand.addEventListener("change", applyFiltersAndPaginate);
            applyFiltersAndPaginate();


            // 3. LOGIC LỌC SẢN PHẨM TRONG BẢNG "SẢN PHẨM ĐÃ THÊM"
            const tableProductRows = Array.from(document.querySelectorAll('.flash-sale-product-row'));

            if (tableProductRows.length > 0) {
                const tableCatSet = new Set();
                const tableBrandSet = new Set();

                tableProductRows.forEach(row => {
                    const cat = row.getAttribute('data-category');
                    const brand = row.getAttribute('data-brand');
                    if (cat) tableCatSet.add(cat);
                    if (brand) tableBrandSet.add(brand);
                });

                const tableFilterCategory = document.getElementById('tableFilterCategory');
                const tableFilterBrand = document.getElementById('tableFilterBrand');
                const tableFilterName = document.getElementById('tableFilterName');

                if(tableFilterCategory && tableFilterBrand) {
                    tableCatSet.forEach(cat => tableFilterCategory.add(new Option(cat, cat)));
                    tableBrandSet.forEach(brand => tableFilterBrand.add(new Option(brand, brand)));

                    function applyTableFilters() {
                        const nameVal = tableFilterName.value.toLowerCase();
                        const catVal = tableFilterCategory.value;
                        const brandVal = tableFilterBrand.value;
                        let visibleCount = 0;

                        tableProductRows.forEach(row => {
                            const name = row.querySelector(".table-product-name").innerText.toLowerCase();
                            const cat = row.getAttribute("data-category");
                            const brand = row.getAttribute("data-brand");

                            const matchName = name.includes(nameVal);
                            const matchCat = (catVal === "" || cat === catVal);
                            const matchBrand = (brandVal === "" || brand === brandVal);

                            if (matchName && matchCat && matchBrand) {
                                row.style.display = "";
                                visibleCount++;
                            } else {
                                row.style.display = "none";
                            }
                        });

                        let emptyRow = document.getElementById("tableEmptyRowFilter");
                        const tbody = document.querySelector(".fs-table tbody");

                        if (visibleCount === 0) {
                            if (!emptyRow) {
                                emptyRow = document.createElement("tr");
                                emptyRow.id = "tableEmptyRowFilter";
                                emptyRow.innerHTML = `
                                    <td colspan="5" class="fs-empty-state py-4 text-center">
                                        <i class="fas fa-search fa-2x text-muted mb-2"></i>
                                        <h6>Không tìm thấy sản phẩm phù hợp</h6>
                                        <p class="text-muted small">Vui lòng thử lại với từ khóa hoặc bộ lọc khác.</p>
                                    </td>`;
                                tbody.appendChild(emptyRow);
                            } else {
                                emptyRow.style.display = "";
                            }
                        } else if (emptyRow) {
                            emptyRow.style.display = "none";
                        }
                    }

                    tableFilterName.addEventListener("keyup", applyTableFilters);
                    tableFilterCategory.addEventListener("change", applyTableFilters);
                    tableFilterBrand.addEventListener("change", applyTableFilters);
                }
            }

            // ==============================================================
            // 4. LOGIC LƯU TẤT CẢ GIẢM GIÁ CÙNG LÚC
            // ==============================================================
            const btnSaveAllDiscounts = document.getElementById("btnSaveAllDiscounts");
            if (btnSaveAllDiscounts) {
                btnSaveAllDiscounts.addEventListener("click", function() {
                    // Tạo một form ẩn động để submit
                    const form = document.createElement("form");
                    form.method = "POST";
                    form.action = `/admin/flash-sales/${flashSaleId}/update-all-discounts`; // flashSaleId đã được khai báo sẵn ở đầu script

                    const rows = document.querySelectorAll('.flash-sale-product-row');
                    let count = 0;

                    rows.forEach(row => {
                        const fspIdInput = row.querySelector('.fsp-id-hidden');
                        const discountInput = row.querySelector('input[name="discountPercent"]');

                        if (fspIdInput && discountInput) {
                            // Tạo input mảng chứa ID
                            const idField = document.createElement("input");
                            idField.type = "hidden";
                            idField.name = "fspIds";
                            idField.value = fspIdInput.value;
                            form.appendChild(idField);

                            // Tạo input mảng chứa % Giảm
                            const percentField = document.createElement("input");
                            percentField.type = "hidden";
                            percentField.name = "discountPercents";
                            percentField.value = discountInput.value;
                            form.appendChild(percentField);

                            count++;
                        }
                    });

                    if (count > 0) {
                        document.body.appendChild(form);
                        // Đổi icon nút thành trạng thái loading
                        btnSaveAllDiscounts.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Đang lưu...';
                        btnSaveAllDiscounts.disabled = true;
                        form.submit();
                    } else {
                        alert("Không tìm thấy sản phẩm nào để cập nhật.");
                    }
                });
            }

        });
    </script>
</div>
