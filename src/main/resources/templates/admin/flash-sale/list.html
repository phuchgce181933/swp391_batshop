<div th:fragment="content">
    <link rel="stylesheet" th:href="@{/css/admin/flash-sale.css}">

    <div class="container-fluid">
        <div class="fs-admin-header mt-3">
            <h2 class="fs-admin-title">Quản lý Flash Sale</h2>
            <a th:href="@{/admin/flash-sales/add}" class="fs-btn fs-btn-primary"><i class="fas fa-plus"></i>+ Thêm đợt Flash Sale mới</a>
        </div>

        <div class="fs-admin-card fs-table-wrapper">
            <table class="fs-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Giảm giá</th>
                    <th>Thời gian diễn ra</th>
                    <th>Sản phẩm</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="fs : ${flashSales}">
                    <td th:text="${fs.id}" class="fw-bold"></td>

                    <td class="text-center">
                        <span class="fs-badge-discount">
                            <i class="fas fa-bolt me-1"></i> -<span th:text="${fs.discountPercent} + '%'"></span>
                        </span>
                    </td>

                    <td>
                        <div class="fw-bold" style="color: #2c3e50;" th:text="${#temporals.format(fs.startDate, 'dd/MM/yyyy')}"></div>
                        <div class="text-muted mt-1" style="font-size: 0.85rem;">
                            <i class="far fa-clock"></i>
                            <span th:text="${#temporals.format(fs.startDate, 'HH:mm')}"></span> -
                            <span th:text="${#temporals.format(fs.endDate, 'HH:mm')}"></span>
                        </div>
                    </td>

                    <td class="text-center">
                        <span class="fs-badge-count" th:text="${fs.products != null ? fs.products.size() : 0}"></span>
                    </td>

                    <td>
                        <span th:if="${fs.status == 'Đang diễn ra'}"
                              class="badge" style="background-color: #2ecc71; color: white; padding: 6px 10px; font-size: 0.85rem;">
                              <i class="fas fa-play-circle"></i> Đang diễn ra
                        </span>

                        <span th:if="${fs.status == 'Sắp diễn ra'}"
                              class="badge" style="background-color: #f39c12; color: white; padding: 6px 10px; font-size: 0.85rem;">
                              <i class="fas fa-clock"></i> Sắp diễn ra
                        </span>

                        <span th:if="${fs.status == 'Đã kết thúc'}"
                              class="badge" style="background-color: #95a5a6; color: white; padding: 6px 10px; font-size: 0.85rem;">
                              <i class="fas fa-stop-circle"></i> Đã kết thúc
                        </span>
                    </td>

                    <td>
                        <div class="fs-action-btns">
                            <a th:href="@{/admin/flash-sales/edit/{id}(id=${fs.id})}" class="fs-btn fs-btn-sm" style="background-color: #3498db; color: white;">
                                <i class="fas fa-edit"></i> Quản lý
                            </a>

                            <a th:if="${fs.status != 'Đang diễn ra'}"
                               th:href="@{/admin/flash-sales/delete/{id}(id=${fs.id})}"
                               class="fs-btn fs-btn-sm" style="background-color: #e74c3c; color: white;"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa Flash Sale này không?');">
                                <i class="fas fa-trash"></i> Xóa
                            </a>

                            <button th:if="${fs.status == 'Đang diễn ra'}"
                                    class="fs-btn fs-btn-sm fs-btn-disabled" disabled
                                    title="Không thể xóa đợt Flash Sale đang chạy">
                                <i class="fas fa-trash"></i> Xóa
                            </button>
                        </div>
                    </td>
                </tr>

                <tr th:if="${flashSales.isEmpty()}">
                    <td colspan="6" class="fs-empty-state">
                        <i class="fas fa-tags fa-3x"></i>
                        <h5>Chưa có đợt Flash Sale nào!</h5>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
