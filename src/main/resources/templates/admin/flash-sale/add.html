<div th:fragment="content">
  <link rel="stylesheet" th:href="@{/css/admin/flash-sale.css}">

  <div class="container-fluid">
    <div class="fs-admin-header mt-3">
      <h2 class="fs-admin-title">Thêm Flash Sale Mới</h2>
      <a th:href="@{/admin/flash-sales}" class="fs-btn fs-btn-secondary"><i class="fas fa-arrow-left"></i>&larr; Quay lại danh sách</a>
    </div>

    <div class="fs-admin-card">

      <div th:if="${errorMessage}" class="alert alert-danger" style="background-color: #f8d7da; color: #721c24; padding: 12px; border-radius: 6px; border: 1px solid #f5c6cb; font-weight: 500; margin-bottom: 20px;">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
      </div>

      <form id="flashSaleForm" th:action="@{/admin/flash-sales/add}" th:object="${flashSale}" method="POST">

        <div class="fs-form-group mb-3">
          <label class="fs-form-label">Phần trăm giảm giá (%)</label>
          <input type="number" class="fs-form-control" th:field="*{discountPercent}" placeholder="Ví dụ: 10, 20, 50..." required min="1" max="100">
        </div>

        <div class="fs-form-group mb-3">
          <label class="fs-form-label">Ngày diễn ra Sale</label>
          <input type="date" class="fs-form-control" name="saleDate" id="saleDate" required th:min="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
        </div>

        <div class="row">
          <div class="col-md-6 fs-form-group mb-3">
            <label class="fs-form-label">Giờ bắt đầu</label>
            <input type="time" class="fs-form-control" name="startTime" id="startTime" required>
          </div>

          <div class="col-md-6 fs-form-group mb-4">
            <label class="fs-form-label">Giờ kết thúc</label>
            <input type="time" class="fs-form-control" name="endTime" id="endTime" required>
            <small class="text-muted mt-1 d-block" style="font-size: 0.85rem;">* Giờ kết thúc phải sau giờ bắt đầu</small>
          </div>
        </div>

        <div id="jsErrorMessage" class="alert alert-danger" style="display: none; padding: 10px; border-radius: 6px; font-weight: 500; margin-bottom: 15px;">
          <i class="fas fa-exclamation-circle"></i> <span id="jsErrorText"></span>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" id="btnSubmit" class="fs-btn fs-btn-primary">
            <i class="fas fa-save me-1"></i> Lưu Flash Sale
          </button>
          <a th:href="@{/admin/flash-sales}" class="fs-btn fs-btn-secondary">Hủy</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("flashSaleForm");
        const errorDiv = document.getElementById("jsErrorMessage");
        const errorText = document.getElementById("jsErrorText");
        const btnSubmit = document.getElementById("btnSubmit");

        form.addEventListener("submit", function (event) {
            // Reset thông báo lỗi
            errorDiv.style.display = "none";

            const saleDate = document.getElementById("saleDate").value;
            const startTime = document.getElementById("startTime").value;
            const endTime = document.getElementById("endTime").value;

            // 1. Kiểm tra giờ bắt đầu/kết thúc
            if (startTime && endTime && startTime >= endTime) {
                event.preventDefault();
                showError("Giờ kết thúc phải diễn ra sau giờ bắt đầu!");
                return;
            }

            // 2. Lấy ngày giờ hiện tại để so sánh
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0]; // Format: yyyy-mm-dd

            // Format giờ hiện tại thành HH:mm
            const currentHours = String(now.getHours()).padStart(2, '0');
            const currentMinutes = String(now.getMinutes()).padStart(2, '0');
            const currentTimeStr = `${currentHours}:${currentMinutes}`;

            // 3. Nếu chọn ngày hôm nay, không được chọn giờ bắt đầu trong quá khứ
            if (saleDate === todayStr && startTime < currentTimeStr) {
                event.preventDefault();
                showError("Ngày Sale là hôm nay, giờ bắt đầu không thể ở trong quá khứ!");
                return;
            }

            // Nếu qua hết các khâu validate -> Disable nút để tránh click đúp
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Đang lưu...';
            btnSubmit.style.opacity = '0.7';
            btnSubmit.style.cursor = 'not-allowed';
            btnSubmit.disabled = true;
        });

// Hàm hiển thị lỗi mượt mà (chữ màu đỏ)
    function showError(message) {
        errorText.innerText = message;

        // Thêm màu đỏ cho chữ
        errorText.style.color = "#dc3545";
        errorDiv.style.backgroundColor = "#f8d7da";
        errorDiv.style.borderColor = "#f5c6cb";
        errorDiv.style.color = "#721c24";
        errorDiv.style.display = "block";
    }
    });
  </script>
</div>
