<div th:fragment="content">
  <link rel="stylesheet" th:href="@{/css/admin/flash-sale.css}">

  <div class="container-fluid">
    <div class="fs-admin-header mt-3">
      <h2 class="fs-admin-title">Thêm đợt Flash Sale mới</h2>
      <a th:href="@{/admin/flash-sales}" class="fs-btn fs-btn-secondary"><i class="fas fa-arrow-left"></i> Quay lại danh sách</a>
    </div>

    <div class="fs-admin-card">

      <div th:if="${errorMessage}" class="fs-alert-custom fs-alert-danger-custom">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
      </div>

      <form id="flashSaleForm" th:action="@{/admin/flash-sales/add}" th:object="${flashSale}" method="POST">
        <div class="row">
          <div class="col-md-6 fs-form-group mb-3">
            <label class="fs-form-label">Ngày diễn ra Sale</label>
            <input type="date" class="fs-form-control" name="saleDate" id="saleDate" required th:min="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
          </div>

          <div class="col-md-6 fs-form-group mb-4">
            <label class="fs-form-label">Chọn Khung Giờ</label>
            <select class="fs-form-control" name="timeSlot" id="timeSlot" required disabled>
              <option value="" disabled selected>-- Vui lòng chọn ngày trước --</option>
              <option value="0">00:00 - 02:00</option>
              <option value="2">02:00 - 04:00</option>
              <option value="4">04:00 - 06:00</option>
              <option value="6">06:00 - 08:00</option>
              <option value="8">08:00 - 10:00</option>
              <option value="10">10:00 - 12:00</option>
              <option value="12">12:00 - 14:00</option>
              <option value="14">14:00 - 16:00</option>
              <option value="16">16:00 - 18:00</option>
              <option value="18">18:00 - 20:00</option>
              <option value="20">20:00 - 22:00</option>
              <option value="22">22:00 - 24:00</option>
            </select>
          </div>
        </div>

        <div class="d-flex gap-2 mt-2">
          <button type="submit" id="btnSubmit" class="fs-btn fs-btn-primary">
            <i class="fas fa-save me-1"></i>Thêm đợt Flash Sale
          </button>
          <a th:href="@{/admin/flash-sales}" class="fs-btn fs-btn-secondary">Hủy</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
        const dateInput = document.getElementById("saleDate");
        const timeSlotSelect = document.getElementById("timeSlot");
        const form = document.getElementById("flashSaleForm");
        const btnSubmit = document.getElementById("btnSubmit");

        dateInput.addEventListener("change", function() {
            const dateStr = dateInput.value;
            if(!dateStr) {
                timeSlotSelect.disabled = true;
                return;
            }

            fetch(`/admin/flash-sales/api/booked-slots?date=${dateStr}`)
                .then(response => response.json())
                .then(bookedHours => {
                    timeSlotSelect.disabled = false;
                    timeSlotSelect.value = "";

                    const now = new Date();
                    const isToday = (dateStr === now.toISOString().split('T')[0]);
                    const currentHour = now.getHours();

                    Array.from(timeSlotSelect.options).forEach(opt => {
                        if(opt.value === "") return;
                        const hour = parseInt(opt.value);
                        const hourText = `${String(hour).padStart(2, '0')}:00 - ${String(hour+2).padStart(2, '0')}:00`;

                        if(bookedHours.includes(hour)) {
                            opt.disabled = true;
                            opt.text = `${hourText} (Đã có sự kiện)`;
} else if (isToday && (hour + 2) <= currentHour) {
                            opt.disabled = true;
                            opt.text = `${hourText} (Đã qua)`;
                        } else {
                            opt.disabled = false;
                            opt.text = hourText;
                        }
                    });
                })
                .catch(err => console.error("Lỗi khi fetch khung giờ:", err));
        });

        form.addEventListener("submit", function () {
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Đang lưu...';
            btnSubmit.style.opacity = '0.7';
            btnSubmit.style.cursor = 'not-allowed';
            btnSubmit.disabled = true;
        });
    });
  </script>
</div>
