<div th:fragment="content">
  <link rel="stylesheet" th:href="@{/css/admin/flash-sale.css}">

  <div class="container-fluid">
    <div class="fs-admin-header mt-3">
      <h2 class="fs-admin-title">Thêm đợt Flash Sale mới</h2>
      <a th:href="@{/admin/flash-sales}" class="fs-btn fs-btn-secondary"><i class="fas fa-arrow-left"></i>&larr; Quay lại danh sách</a>
    </div>

    <div class="fs-admin-card">

      <div th:if="${errorMessage}" class="alert fs-alert fs-alert-error">
        <i class="fas fa-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
      </div>

      <form id="flashSaleForm" th:action="@{/admin/flash-sales/add}" th:object="${flashSale}" method="POST">

        <div class="fs-form-group mb-3">
          <label class="fs-form-label">Ngày diễn ra Sale</label>
          <input type="date" class="fs-form-control" name="saleDate" id="saleDate" required th:min="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}">
        </div>

        <div class="fs-form-group mb-4">
          <label class="fs-form-label">Khung giờ Sale</label>
          <select class="fs-form-control" name="timeSlot" id="timeSlot" required>
            <option value="">-- Chọn khung giờ --</option>
            <option value="00:00-02:00">00:00 - 02:00</option>
            <option value="02:00-04:00">02:00 - 04:00</option>
            <option value="04:00-06:00">04:00 - 06:00</option>
            <option value="06:00-08:00">06:00 - 08:00</option>
            <option value="08:00-10:00">08:00 - 10:00</option>
            <option value="10:00-12:00">10:00 - 12:00</option>
            <option value="12:00-14:00">12:00 - 14:00</option>
            <option value="14:00-16:00">14:00 - 16:00</option>
            <option value="16:00-18:00">16:00 - 18:00</option>
            <option value="18:00-20:00">18:00 - 20:00</option>
            <option value="20:00-22:00">20:00 - 22:00</option>
            <option value="22:00-24:00">22:00 - 24:00</option>
          </select>
          <small class="text-muted mt-1 d-block fs-text-small">* Các khung giờ đã qua trong ngày hoặc đã được đặt sẽ bị ẩn/vô hiệu hóa</small>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" id="btnSubmit" class="fs-btn fs-btn-primary">
            <i class="fas fa-save me-1"></i>Thêm đợt Flash Sale
          </button>
          <a th:href="@{/admin/flash-sales}" class="fs-btn fs-btn-secondary">Hủy</a>
        </div>
      </form>

      <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            const form = document.getElementById("flashSaleForm");
            const btnSubmit = document.getElementById("btnSubmit");

            const bookedData = /*[[${bookedSlots}]]*/ [];
            const bookedMap = {};
            bookedData.forEach(item => {
                let parts = item.split('|');
                if(!bookedMap[parts[0]]) bookedMap[parts[0]] = [];
                bookedMap[parts[0]].push(parts[1]);
            });

            const saleDateInput = document.getElementById('saleDate');
            const timeSlotSelect = document.getElementById('timeSlot');

            function updateAvailableSlots() {
                const dateVal = saleDateInput.value;
                if (!dateVal) return;

                const today = new Date();
                const todayStr = today.toISOString().split('T')[0];
                const currentHourFloat = today.getHours() + (today.getMinutes() / 60);

                Array.from(timeSlotSelect.options).forEach(opt => {
                    if(opt.value === "") return;
                    let reason = "";

                    if (dateVal === todayStr) {
                        let endH = parseInt(opt.value.split('-')[1].split(':')[0]);
                        if (opt.value.split('-')[1] === "24:00") endH = 24;
                        if (endH <= currentHourFloat) {
                            reason = " (Đã qua)";
                        }
                    }

                    if (bookedMap[dateVal] && bookedMap[dateVal].includes(opt.value)) {
                        if (reason !== "") {
                            reason = " (Đã qua & Đã đặt)";
                        } else {
                            reason = " (Đã đặt)";
                        }
                    }

                    opt.disabled = reason !== "";
                    opt.text = reason !== "" ? opt.value.replace('-', ' - ') + reason : opt.value.replace('-', ' - ');
                });

                if(timeSlotSelect.options[timeSlotSelect.selectedIndex]?.disabled) {
                    timeSlotSelect.value = "";
                }
            }

            saleDateInput.addEventListener('change', updateAvailableSlots);
            if(saleDateInput.value) updateAvailableSlots();

            form.addEventListener("submit", function (event) {
                btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Đang lưu...';
                btnSubmit.classList.add('fs-btn-loading'); // Thêm CSS Loading thay vì inline JS
            });
        });
      </script>
    </div>
  </div>
</div>
