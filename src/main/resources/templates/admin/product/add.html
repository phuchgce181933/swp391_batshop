<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/admin/addproduct.css}">
    <meta charset="UTF-8">
    <title>Add Product</title>
</head>
<body>

<div class="admin-content">
    <div class="form-card">
        <h2>Add Product</h2>

        <form th:action="@{/admin/products/add}"
              method="post"
              th:object="${product}"
              enctype="multipart/form-data">

            <!-- ===== BASIC INFO ===== -->

            Name:
            <input type="text" th:field="*{name}" required/><br>

            Description:
            <textarea th:field="*{description}"></textarea><br>

            Price:
            <input type="number" step="0.01" th:field="*{price}" required/><br>

            Category:
            <select id="categorySelect" th:field="*{category.id}" required>
                <option value="">-- Select Category --</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                </option>
            </select>
            <br>

            Brand:
            <select th:field="*{brand.id}" required>
                <option value="">-- Select Brand --</option>
                <option th:each="b : ${brands}"
                        th:value="${b.id}"
                        th:text="${b.name}">
                </option>
            </select>
            <br><br>

            <!-- ===== IMAGE ===== -->

            <label>Preview Image:</label><br>
            <img id="previewImage"
                 src="/images/no-image.png"
                 width="150"
                 style="border:1px solid #ccc; padding:5px;">
            <br><br>

            <label>Select Image:</label>
            <input type="file"
                   name="imageFile"
                   id="imageInput"
                   accept="image/*"
                   required>
            <br><br>

            <!-- ===== VARIANTS ===== -->
            <div id="variantBlock">
            <h3>Product Variants</h3>

            <div id="variantContainer">

                <!-- VARIANT 0 -->
                <div class="variant-item">
                    <hr>

                    Stock:
                    <input type="number"
                           name="variants[0].stock"
                           required><br>

                    Additional Price:
                    <input type="number"
                           step="0.01"
                           name="variants[0].additionalPrice"
                           required><br>

                    Size:
                    <select name="variants[0].size.id" required>
                        <option th:each="s : ${sizes}"
                                th:value="${s.id}"
                                th:text="${s.name}">
                        </option>
                    </select><br>

                    Color:
                    <select name="variants[0].color.id" required>
                        <option th:each="c : ${colors}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>
                    </select><br>

                    Brand:
                    <select name="variants[0].brand.id" required>
                        <option th:each="b : ${brands}"
                                th:value="${b.id}"
                                th:text="${b.name}">
                        </option>
                    </select><br>
                </div>

            </div>
            </div>
            <br>
            <div id="racketBlock" style="display:none">

                <h3>Racket Detail</h3>

                Stock:
                <input type="number"
                       name="racketStock"><br>

                Additional Price:
                <input type="number"
                       step="0.01"
                       name="racketAdditionalPrice"><br><br>

                <!-- LEVEL -->
                Level:
                <select name="racketDetail.level">
                    <option value="">-- Select Level --</option>
                    <option th:each="l : ${racketLevels}"
                            th:value="${l}"
                            th:text="${l}">
                    </option>
                </select><br>

                <!-- LENGTH -->
                Length:
                <select name="racketDetail.length">
                    <option value="">-- Select Length --</option>
                    <option th:each="len : ${racketLengths}"
                            th:value="${len}"
                            th:text="${len}">
                    </option>
                </select><br>

                <!-- HANDLE LENGTH -->
                Handle Length:
                <select name="racketDetail.racketHandleLength">
                    <option value="">-- Select Handle Length --</option>
                    <option th:each="h : ${handleLengths}"
                            th:value="${h}"
                            th:text="${h}">
                    </option>
                </select><br>

                <!-- EQUILIBRIUM -->
                Equilibrium Point:
                <select name="racketDetail.equilibriumPoint">
                    <option value="">-- Select Balance --</option>
                    <option th:each="e : ${equilibriumPoints}"
                            th:value="${e}"
                            th:text="${e}">
                    </option>
                </select><br>

                <!-- HARDNESS -->
                Chopstick Hardness:
                <select name="racketDetail.chopstickHardness">
                    <option value="">-- Select Hardness --</option>
                    <option th:each="c : ${chopstickHardnesses}"
                            th:value="${c}"
                            th:text="${c}">
                    </option>
                </select><br>

                Weight:
                <input type="text" name="racketDetail.weight"><br>

                Swing Weight:
                <input type="text" name="racketDetail.swingweight"><br>

                Style:
                <input type="text" name="racketDetail.style"><br>

                Technology:
                <input type="text" name="racketDetail.technology"><br>

                Game Content:
                <input type="text" name="racketDetail.gamecontent"><br>

            </div>
            <button type="button" onclick="addVariant()">+ Add Variant</button>
            <br><br>

            <button type="submit">Save Product</button>

        </form>
    </div>
</div>

<!-- ===== JS ===== -->

<script>
    document.addEventListener("DOMContentLoaded", function () {

        // ===== IMAGE PREVIEW =====
        document.getElementById("imageInput")
            .addEventListener("change", function (event) {

                const file = event.target.files[0];

                if (file) {
                    const reader = new FileReader();

                    reader.onload = function (e) {
                        document.getElementById("previewImage")
                            .src = e.target.result;
                    };

                    reader.readAsDataURL(file);
                }
            });

        // ===== ADD VARIANT =====
        let index = 1;

        window.addVariant = function () {

            const container = document.getElementById("variantContainer");

            const sizeOptions =
                document.querySelector("select[name='variants[0].size.id']").innerHTML;

            const colorOptions =
                document.querySelector("select[name='variants[0].color.id']").innerHTML;

            const brandOptions =
                document.querySelector("select[name='variants[0].brand.id']").innerHTML;

            const html = `
        <div class="variant-item">
            <hr>

            Stock:
            <input type="number"
                   name="variants[${index}].stock"
                   required><br>

            Additional Price:
            <input type="number"
                   step="0.01"
                   name="variants[${index}].additionalPrice"
                   required><br>

            Size:
            <select name="variants[${index}].size.id" required>
                ${sizeOptions}
            </select><br>

            Color:
            <select name="variants[${index}].color.id" required>
                ${colorOptions}
            </select><br>

            Brand:
            <select name="variants[${index}].brand.id" required>
                ${brandOptions}
            </select><br>
        </div>
        `;

            container.insertAdjacentHTML("beforeend", html);
            index++;
        };

        // ===== TOGGLE FORM =====
        const categorySelect = document.getElementById("categorySelect");
        const variantBlock = document.getElementById("variantBlock");
        const racketBlock = document.getElementById("racketBlock");

        function toggleForm() {

            const selectedId = categorySelect.value;

            const variantInputs = variantBlock.querySelectorAll("input, select");
            const racketInputs = racketBlock.querySelectorAll("input, select");

            if (selectedId === "3") {

                variantBlock.style.display = "none";
                racketBlock.style.display = "block";

                // disable variant required
                variantInputs.forEach(el => el.disabled = true);
                racketInputs.forEach(el => el.disabled = false);

            } else {

                variantBlock.style.display = "block";
                racketBlock.style.display = "none";

                variantInputs.forEach(el => el.disabled = false);
                racketInputs.forEach(el => el.disabled = true);
            }
        }

        categorySelect.addEventListener("change", toggleForm);

        toggleForm();
    });
</script>
</body>
</html>
