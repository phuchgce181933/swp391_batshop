<h2>Edit Product</h2>

<form th:action="@{/admin/products/edit}" method="post" th:object="${product}" enctype="multipart/form-data">
    <input type="hidden" th:field="*{id}" />

    Name:
    <input type="text" th:field="*{name}" /><br>

    Description:
    <textarea th:field="*{description}"></textarea><br>

    Price:
    <input type="number" step="0.01" th:field="*{price}" /><br>

    Category:
    <select th:field="*{category.id}">
        <option value="">-- Select Category --</option>
        <option th:each="c : ${categories}"
                th:value="${c.id}"
                th:text="${c.name}">
        </option>
    </select>
    <br>

    Brand:
    <select th:field="*{brand.id}">
        <option value="">-- Select Brand --</option>
        <option th:each="b : ${brands}"
                th:value="${b.id}"
                th:text="${b.name}">
        </option>
    </select>
    <br>
    <div>
        <label>Current Image:</label><br>

        <div>
            <img id="previewImage"
                 th:if="${product.images != null and !product.images.isEmpty()}"
                 th:src="@{/uploads/product/{img}(img=${product.images[0].image})}"
                 width="150"
                 style="border:1px solid #ccc; padding:5px;">
        </div>
    </div>

    <br>

    <label>Change Image:</label>
    <input type="file" name="imageFile" id="imageInput" accept="image/*">
    <br>
    <h3>Product Variants</h3>

    <div th:each="variant, stat : ${product.variants}">

        <!-- hidden id để update -->
        <input type="hidden"
               th:name="'variants[' + ${stat.index} + '].id'"
               th:value="${variant.id}" />

        Stock:
        <input type="number"
               th:name="'variants[' + ${stat.index} + '].stock'"
               th:value="${variant.stock}" />
        <br>

        Additional Price:
        <input type="number" step="0.01"
               th:name="'variants[' + ${stat.index} + '].additionalPrice'"
               th:value="${variant.additionalPrice}" />
        <br>

        Size:
        <select th:name="'variants[' + ${stat.index} + '].size.id'">
            <option th:each="s : ${sizes}"
                    th:value="${s.id}"
                    th:text="${s.name}"
                    th:selected="${variant.size != null and s.id == variant.size.id}">
            </option>
        </select>
        <br>

        Color:
        <select th:name="'variants[' + ${stat.index} + '].color.id'">
            <option th:each="c : ${colors}"
                    th:value="${c.id}"
                    th:text="${c.name}"
                    th:selected="${c.id == variant.color.id}">
            </option>
        </select>
        <br>

        Brand:
        <select th:name="'variants[' + ${stat.index} + '].brand.id'">
            <option th:each="b : ${brands}"
                    th:value="${b.id}"
                    th:text="${b.name}"
                    th:selected="${b.id == variant.brand.id}">
            </option>
        </select>

        <hr>
    </div>
    <button type="submit">Update</button>
    <script>
        document.getElementById("imageInput")
            .addEventListener("change", function (event) {

                const file = event.target.files[0];

                if (file) {
                    const reader = new FileReader();

                    reader.onload = function (e) {
                        document.getElementById("previewImage")
                            .src = e.target.result;
                    };

                    reader.readAsDataURL(file);
                }
            });
    </script>
</form>
