<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link rel="stylesheet" th:href="@{/css/admin/editproduct.css}">
</head>
<body>

<div class="admin-content">
    <div class="form-card">
        <h2>Edit Product</h2>

        <form th:action="@{/admin/products/edit}"
              method="post"
              th:object="${product}"
              enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}" />

            <!-- BASIC INFO -->

            Name:
            <input type="text" th:field="*{name}" required /><br>

            Description:
            <textarea th:field="*{description}"></textarea><br>

            Price:
            <input type="number" step="0.01" th:field="*{price}" required /><br>

            Category:
            <select id="categorySelect" th:field="*{category.id}" required>
                <option value="">-- Select Category --</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                </option>
            </select>
            <br>

            Brand:
            <select th:field="*{brand.id}" required>
                <option value="">-- Select Brand --</option>
                <option th:each="b : ${brands}"
                        th:value="${b.id}"
                        th:text="${b.name}">
                </option>
            </select>
            <br><br>

            <!-- IMAGE -->

            <label>Current Image:</label><br>
            <img id="previewImage"
                 th:if="${product.images != null and !product.images.isEmpty()}"
                 th:src="@{/uploads/product/{img}(img=${product.images[0].image})}"
                 width="150"
                 style="border:1px solid #ccc; padding:5px;">
            <br><br>

            <label>Change Image:</label>
            <input type="file"
                   name="imageFile"
                   id="imageInput"
                   accept="image/*">
            <br><br>

            <!-- VARIANTS -->

            <h3>Product Variants</h3>

            <div th:each="variant, stat : ${product.variants}"
                 class="variant-item">

                <hr>

                <!-- hidden id để update -->
                <input type="hidden"
                       th:name="'variants[' + ${stat.index} + '].id'"
                       th:value="${variant.id}" />

                Stock:
                <input type="number"
                       th:name="'variants[' + ${stat.index} + '].stock'"
                       th:value="${variant.stock}"
                       required />
                <br>

                Additional Price:
                <input type="number" step="0.01"
                       th:name="'variants[' + ${stat.index} + '].additionalPrice'"
                       th:value="${variant.additionalPrice}"
                       required />
                <br>

                <!-- NORMAL FIELDS -->
                <div class="normal-fields">

                    Size:
                    <select th:name="'variants[' + ${stat.index} + '].size.id'">
                        <option th:each="s : ${sizes}"
                                th:value="${s.id}"
                                th:text="${s.name}"
                                th:selected="${variant.size != null and s.id == variant.size.id}">
                        </option>
                    </select><br>

                    Color:
                    <select th:name="'variants[' + ${stat.index} + '].color.id'">
                        <option th:each="c : ${colors}"
                                th:value="${c.id}"
                                th:text="${c.name}"
                                th:selected="${variant.color != null and c.id == variant.color.id}">
                        </option>
                    </select><br>

                    Brand:
                    <select th:name="'variants[' + ${stat.index} + '].brand.id'">
                        <option th:each="b : ${brands}"
                                th:value="${b.id}"
                                th:text="${b.name}"
                                th:selected="${variant.brand != null and b.id == variant.brand.id}">
                        </option>
                    </select><br>

                </div>

                <!-- RACKET FIELDS -->
                <div class="racket-fields">

                    Level:
                    <select th:name="'variants[' + ${stat.index} + '].racketDetail.level'">
                        <option value="">-- Select Level --</option>
                        <option th:each="l : ${racketLevels}"
                                th:value="${l}"
                                th:text="${l}"
                                th:selected="${variant.racketDetail != null and l == variant.racketDetail.level}">
                        </option>
                    </select><br>

                    Length:
                    <select th:name="'variants[' + ${stat.index} + '].racketDetail.length'">
                        <option value="">-- Select Length --</option>
                        <option th:each="len : ${racketLengths}"
                                th:value="${len}"
                                th:text="${len}"
                                th:selected="${variant.racketDetail != null and len == variant.racketDetail.length}">
                        </option>
                    </select><br>

                    Weight:
                    <input type="text"
                           th:name="'variants[' + ${stat.index} + '].racketDetail.weight'"
                           th:value="${variant.racketDetail != null ? variant.racketDetail.weight : ''}" />
                    <br>

                    Technology:
                    <input type="text"
                           th:name="'variants[' + ${stat.index} + '].racketDetail.technology'"
                           th:value="${variant.racketDetail != null ? variant.racketDetail.technology : ''}" />
                    <br>

                </div>

            </div>

            <br>
            <button type="submit">Update Product</button>

        </form>
        <a th:href="@{/admin/products}">← Back</a>
    </div>
</div>

<!-- SCRIPT -->

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function () {

        // IMAGE PREVIEW
        document.getElementById("imageInput")
            .addEventListener("change", function (event) {

                const file = event.target.files[0];

                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        document.getElementById("previewImage").src = e.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            });

        const categorySelect = document.getElementById("categorySelect");

        const racketId = [[${racketCategoryId}]]; // 🔥 ID = 3

        function toggleFields() {

            const isRacket = categorySelect.value == racketId;

            document.querySelectorAll(".variant-item").forEach(item => {

                const normalFields = item.querySelector(".normal-fields");
                const racketFields = item.querySelector(".racket-fields");

                if (isRacket) {
                    normalFields.style.display = "none";
                    racketFields.style.display = "block";
                } else {
                    normalFields.style.display = "block";
                    racketFields.style.display = "none";
                }
            });
        }

        categorySelect.addEventListener("change", toggleFields);

        toggleFields(); // chạy khi load trang (edit case)
    });
</script>

</body>
</html>
