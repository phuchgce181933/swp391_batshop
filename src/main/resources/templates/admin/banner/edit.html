<h2>Edit Banner</h2>

<form th:action="@{/admin/banners/edit}" method="post" th:object="${banner}">
  <input type="hidden" th:field="*{id}" />

  Image URL:
  <input type="text" th:field="*{image}" /><br>
  <img th:if="${banner.image != null}"
       th:src="${banner.image}"
       width="200" /><br><br>

  Link:
  <input type="text" th:field="*{link}" /><br><br>

  <button type="submit">Update</button>
</form>
