<link rel="stylesheet" th:href="@{/css/admin/banner.css}">

<div class="form-container">
  <h2>Edit Banner</h2>

  <form th:action="@{/admin/banners/edit}" method="post" th:object="${banner}" enctype="multipart/form-data">

    <input type="hidden" th:field="*{id}"/>

    <div class="form-group">
      <label>Banner Name</label>
      <input type="text" th:field="*{name}" required>
    </div>

    <div class="form-group" th:if="${banner.image != null}">
      <label>Current Image</label>
      <div class="current-image">
        <img th:src="@{/uploads/product/{img}(img=${banner.image})}">
      </div>
    </div>

    <div class="form-group">
      <label>Change Image (optional)</label>
      <input type="file" name="file">
    </div>

    <div class="form-group">
      <label>Status</label>
      <select th:field="*{status}">
        <option th:value="true">Active</option>
        <option th:value="false">Inactive</option>
      </select>
    </div>

    <div class="button-group">
      <button type="submit" class="btn-save">Update</button>
      <a th:href="@{/admin/banners}" class="btn-back">Back</a>
    </div>

  </form>
</div>
