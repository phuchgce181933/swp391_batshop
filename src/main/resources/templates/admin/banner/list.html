<link rel="stylesheet" th:href="@{/css/admin/banner.css}">

<div class="banner-container">

  <div class="banner-header">
    <div>
      <h2>Manager Banners</h2>

      <form th:action="@{/admin/banners}" method="get" style="margin-bottom:15px;">
        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder=" Search banner..."
               class="search-input">

        <button type="submit">Search</button>
      </form>
    </div>

    <a th:href="@{/admin/banners/add}" class="btn-add">
      + Add Banner
    </a>
  </div>

  <div class="banner-table-wrapper">
    <table class="banner-table">

      <thead>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Image</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="b : ${banners}">

        <!-- ID -->
        <td th:text="${b.id}"></td>

        <!-- NAME -->
        <td th:text="${b.name}"></td>

        <!-- IMAGE -->
        <td>
          <img th:if="${b.image != null}"
               th:src="@{/uploads/product/{img}(img=${b.image})}"
               class="banner-image">

          <span th:if="${b.image == null}" class="no-image">
                        No image
                    </span>
        </td>

        <!-- STATUS -->
        <td>
                    <span th:classappend="${b.status}
                          ? 'status status-enabled'
                          : 'status status-disabled'"
                          th:text="${b.status ? 'ACTIVE' : 'INACTIVE'}">
                    </span>
        </td>

        <!-- ACTION -->
        <td>
          <div class="action-buttons">

            <a th:href="@{/admin/banners/edit/{id}(id=${b.id})}"
               class="btn-edit">
              Edit
            </a>

            <a th:href="@{/admin/banners/toggle/{id}(id=${b.id})}"
               th:classappend="${b.status}
                                ? 'btn-disable'
                                : 'btn-enable'"
               class="btn-toggle">
              <span th:text="${b.status ? 'Disable' : 'Enable'}"></span>
            </a>

            <a th:href="@{/admin/banners/delete/{id}(id=${b.id})}"
               class="btn-delete"
               onclick="return confirm('Delete this banner?')">
              Delete
            </a>

          </div>
        </td>

      </tr>
      </tbody>

    </table>
  </div>

</div>
