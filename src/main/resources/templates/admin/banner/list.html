<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Quản lý Banner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Danh sách Banner</h2>
    <a th:href="@{/admin/banners/add}" class="btn btn-primary">Thêm mới</a>
  </div>
  <table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
      <th>ID</th>
      <th>Tên</th>
      <th>Hình ảnh</th>
      <th>Link</th>
      <th>Trạng thái</th>
      <th>Hành động</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="banner : ${banners}">
      <td th:text="${banner.id}"></td>
      <td th:text="${banner.name}"></td>
      <td><img th:src="@{${banner.imageUrl}}" style="height: 50px; width: 100px; object-fit: cover;"></td>
      <td th:text="${banner.link}"></td>
      <td>
        <span th:if="${banner.status}" class="badge bg-success">Hiện</span>
        <span th:unless="${banner.status}" class="badge bg-secondary">Ẩn</span>
      </td>
      <td>
        <a th:href="@{/admin/banners/edit/{id}(id=${banner.id})}" class="btn btn-sm btn-warning">Sửa</a>
        <a th:href="@{/admin/banners/delete/{id}(id=${banner.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Xóa banner này?');">Xóa</a>
      </td>
    </tr>
    </tbody>
  </table>
  <a th:href="@{/admin/admin_Settings}" class="btn btn-secondary mt-3">Quay lại</a>
</div>
</body>
</html>
