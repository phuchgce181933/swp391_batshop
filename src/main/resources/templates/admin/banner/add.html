<link rel="stylesheet" th:href="@{/css/admin/banner.css}">

<h2>Add Banner</h2>

<form class="admin-form" th:action="@{/admin/banners/add}" method="post" enctype="multipart/form-data">

    <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" required>
    </div>

    <div class="form-group">
        <label>Image</label>
        <input type="file" name="file" required>
    </div>

    <div class="form-group">
        <label>Status</label>
        <select name="status">
            <option th:value="true">Active</option>
            <option th:value="false">Inactive</option>
        </select>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-primary">Save</button>
        <a th:href="@{/admin/banners}" class="btn-secondary">Back</a>
    </div>

</form>
