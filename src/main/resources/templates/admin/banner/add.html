<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm Banner</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4 col-md-6">
    <h3>Thêm Banner Mới</h3>
    <form th:action="@{/admin/banners/add}" th:object="${banner}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label class="form-label">Tiêu đề Banner</label>
            <input type="text" class="form-control" th:field="*{name}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Chọn ảnh</label>

            <div class="mb-2">
                <img id="previewImage" src="#" alt="Ảnh xem trước"
                     class="img-thumbnail"
                     style="max-height: 150px; display: none;">
            </div>

            <input type="file" name="file" id="fileInput"
                   class="form-control" accept="image/*" required
                   onchange="showPreview(this)">
        </div>
        <div class="mb-3">
            <label class="form-label">Link liên kết</label>
            <input type="text" class="form-control" th:field="*{link}">
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" th:field="*{status}">
            <label class="form-check-label">Hiển thị ngay</label>
        </div>
        <button type="submit" class="btn btn-success">Lưu</button>
        <a th:href="@{/admin/banners}" class="btn btn-secondary">Hủy</a>
    </form>
</div>

<script>
    function showPreview(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();

            reader.onload = function (e) {
                var img = document.getElementById('previewImage');
                img.src = e.target.result;
                img.style.display = 'block'; // Hiện ảnh lên
            }

            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
