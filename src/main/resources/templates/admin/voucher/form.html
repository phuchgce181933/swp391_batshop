<link rel="stylesheet" th:href="@{/css/admin/voucher.css}">

<div class="form-container">
    <h2 th:text="${voucher.id != null} ? 'Edit Voucher' : 'Add Voucher'"></h2>

    <form th:action="@{/admin/vouchers/save}"
          th:object="${voucher}"
          method="post">

        <input type="hidden"
               th:if="${voucher.id != null}"
               th:field="*{id}" />

        <p th:if="${error}"
           th:text="${error}"
           class="error-message"></p>

        <div class="form-group">
            <label>Code</label>
            <input type="text" th:field="*{code}" required />
        </div>

        <div class="form-group">
            <label>Discount Percent</label>
            <input type="number"
                   th:field="*{discountPercent}"
                   min="1" max="100" required />
        </div>

        <div class="form-group">
            <label>Max Discount Amount (VND)</label>
            <input type="number"
                   th:field="*{maxDiscountAmount}"
                   min="0"
                   placeholder="0 = unlimited"/>
        </div>

        <div class="form-group">
            <label>Min Order Amount (VND)</label>
            <input type="number"
                   th:field="*{minOrderAmount}"
                   min="0"
                   placeholder="0 = no minimum"/>
        </div>

        <div class="form-group">
            <label>Usage Limit</label>
            <input type="number"
                   th:field="*{totalUsageLimit}"
                   min="1"
                   placeholder="Leave empty = unlimited"/>
        </div>

        <div class="form-group">
            <label>Valid From</label>
            <input type="datetime-local"
                   th:field="*{validFrom}"
                   required />
        </div>

        <div class="form-group">
            <label>Valid To</label>
            <input type="datetime-local"
                   th:field="*{validTo}"
                   required />
        </div>

        <div class="button-group">
            <button type="submit" class="btn-save">Save</button>
            <a th:href="@{/admin/vouchers}" class="btn-back">Back</a>
        </div>

    </form>
</div>

<script>
    const form = document.querySelector("form");
    const from = document.querySelector("[name='validFrom']");
    const to = document.querySelector("[name='validTo']");

    form.addEventListener("submit", function(e) {
        if (from.value && to.value && to.value < from.value) {
            alert("Valid To must be after Valid From!");
            e.preventDefault();
        }
    });
</script>
