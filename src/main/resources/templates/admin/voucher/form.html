<h2 th:text="${voucher.id == null ? 'Add Voucher' : 'Edit Voucher'}"></h2>

<form th:action="@{/admin/vouchers/save}" method="post"
      th:object="${voucher}">

    <input type="hidden" th:field="*{id}" />

    <label>Code</label><br>
    <input type="text" th:field="*{code}" required /><br><br>

    <label>Discount Percent</label><br>
    <input type="number" th:field="*{discountPercent}" min="1" max="100" required /><br><br>

    <label>Valid From</label><br>
    <input type="datetime-local" th:field="*{validFrom}" /><br><br>

    <label>Valid To</label><br>
    <input type="datetime-local" th:field="*{validTo}" /><br><br>

    <button type="submit">Save</button>
</form>
