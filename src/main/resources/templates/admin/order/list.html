<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div >

    <div th:fragment="content">

        <link rel="stylesheet" th:href="@{/css/admin/order.css}">
        <h2>Manager Orders</h2>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>User</th>
                <th>Shipping Address</th>
                <th>Total Price</th>
                <th>Payment Method</th>
                <th>Payment Status</th>
                <th>Created At</th>
                <th>Status</th>
                <th>Order Item</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${o.id}"></td>

                <td th:text="${o.user != null ? o.user.fullName : 'Guest'}"></td>

                <td>
                    <div th:if="${o.shippingAddress != null}">
                        <strong th:text="${o.shippingAddress.fullName}"></strong><br>
                        <span th:text="${o.shippingAddress.phone}"></span><br>

                        <span th:text="${o.shippingAddress.detail}"></span><br>
                        <span th:text="${o.shippingAddress.ward + ', '
                        + o.shippingAddress.district + ', '
                        + o.shippingAddress.city}">
        </span>
                    </div>

                    <span th:if="${o.shippingAddress == null}">
        No address
    </span>
                </td>

                <td th:text="${#numbers.formatDecimal(o.totalPrice,0,'COMMA',0,'POINT')}"></td>

                <td th:text="${o.paymentMethod}"></td>

                <td th:text="${o.paymentStatus}"></td>

                <td th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></td>
                <td>
                    <a th:href="@{/orders_item/admin/{id}(id=${o.id})}">View</a>
                </td>
                <td>
                    <div th:if="${o.status.name() == 'CANCELLED'}">
                        <span style="color:red;font-weight:600;">CANCELLED</span>
                    </div>

                    <form th:if="${o.status.name() != 'CANCELLED' && o.status.name() != 'COMPLETED'}"
                          th:action="@{/admin/orders/edit/{id}(id=${o.id})}"
                          method="post">

                        <select name="status" onchange="this.form.submit()">

                            <option th:value="${o.status}"
                                    th:text="${o.status}"
                                    selected>
                            </option>

                            <option th:if="${o.status.name() == 'PENDING'}" value="CONFIRMED">CONFIRMED</option>

                            <option th:if="${o.status.name() == 'CONFIRMED'}" value="PACKED">PACKED</option>

                            <option th:if="${o.status.name() == 'PACKED'}" value="SHIPPING">SHIPPING</option>

                            <option th:if="${o.status.name() == 'SHIPPING'}" value="COMPLETED">COMPLETED</option>

                            <option th:if="${o.status.name() == 'PENDING' || o.status.name() == 'CONFIRMED'}"
                                    value="CANCELLED">
                                CANCELLED
                            </option>

                        </select>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

    </div>

</div>

</body>
</html>
