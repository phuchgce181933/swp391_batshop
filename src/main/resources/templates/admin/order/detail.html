<h2>Order Detail</h2>

<p><b>Order ID:</b> <span th:text="${order.id}"></span></p>
<p><b>User:</b> <span th:text="${order.user != null ? order.user.username : 'Guest'}"></span></p>
<p><b>Total Price:</b>
    <span th:text="${order.totalPrice != null
        ? #numbers.formatDecimal(order.totalPrice,0,'COMMA',0,'POINT')
        : '0'}"></span>
</p>
<p><b>Status:</b> <span th:text="${order.status}"></span></p>

<p><b>Shipping Address:</b>
    <span th:text="${order.shippingAddress != null
        ? order.shippingAddress.address
        : 'N/A'}"></span>
</p>

<hr>

<h3>Update Status</h3>

<form th:action="@{/admin/orders/update-status}" method="post">
    <input type="hidden" name="id" th:value="${order.id}" />

    <select name="status">
        <option th:each="s : ${statuses}"
                th:value="${s}"
                th:text="${s}"
                th:selected="${s == order.status}">
        </option>
    </select>

    <button type="submit">Update</button>
</form>
