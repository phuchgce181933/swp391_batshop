<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/admin/brand.css}">
    <style>
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 4px; text-align: center; font-weight: bold; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
<h2 class="page-title">Manager Sizes</h2>

<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

<div class="page-actions right">
    <a th:href="@{/admin/sizes/add}" class="btn btn-primary">+ Add Size</a>
</div>

<div class="table-wrapper">
    <table class="admin-table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Size Name</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="s : ${sizes}">
            <td th:text="${s.id}"></td>
            <td th:text="${s.name}"></td>
            <td><span th:text="${s.status ? 'Active' : 'Inactive'}"></span></td>
            <td>
                <a th:href="@{/admin/sizes/edit/{id}(id=${s.id})}" class="btn-edit">Edit</a> |
                <a th:href="@{/admin/sizes/delete/{id}(id=${s.id})}"
                   onclick="return confirm('Are you sure you want to delete this size?')" class="btn-delete">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
