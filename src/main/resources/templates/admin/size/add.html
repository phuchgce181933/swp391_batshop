<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" th:href="@{/css/admin/brand.css}">
</head>
<body>
<h2 class="page-title">Size Form</h2>

<div class="form-wrapper" style="max-width: 500px; margin: auto;">
    <form th:action="@{/admin/sizes/save}" th:object="${size}" method="post">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Size Name:</label>
            <input type="text" th:field="*{name}" class="search-input" placeholder="Ví dụ: XL, 42, 43..." required>
        </div>

        <div class="form-group" style="margin-top: 10px;">
            <label>Status:</label>
            <select th:field="*{status}" class="search-input">
                <option th:value="true">Active</option>
                <option th:value="false">Inactive</option>
            </select>
        </div>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn btn-primary">Save Size</button>
            <a th:href="@{/admin/sizes}" class="btn-delete">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
