<link rel="stylesheet" th:href="@{/css/admin/blog.css}">

<div class="form-container">
    <h2>Edit Blog</h2>

    <p th:if="${error}" th:text="${error}" style="color:red;"></p>

    <form th:action="@{/admin/blogs/edit}" method="post" enctype="multipart/form-data" th:object="${blog}">

        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label>Title</label>
            <input type="text" th:field="*{title}" required>
        </div>

        <div class="form-group" th:if="${blog.image != null}">
            <label>Current Image</label>
            <div class="current-image">
                <img th:src="@{/uploads/blog/{img}(img=${blog.image})}" width="200">
            </div>
        </div>

        <div class="form-group">
            <label>Change Image</label>
            <input type="file" name="file">
        </div>

        <div class="form-group">
            <label>Status</label>
            <select th:field="*{status}">
                <option th:value="true">Active</option>
                <option th:value="false">Inactive</option>
            </select>
        </div>

        <div class="form-group">
            <label>Content</label>
            <textarea th:field="*{content}" id="editor" rows="10"></textarea>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-save">Update</button>
            <a th:href="@{/admin/blogs}" class="btn-back">Back</a>
        </div>

    </form>
</div>

<!-- CKEditor -->
<script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>

<script>
    CKEDITOR.replace('editor', {
        height: 300
    });
</script>
