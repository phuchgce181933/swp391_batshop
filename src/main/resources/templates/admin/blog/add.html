<link rel="stylesheet" th:href="@{/css/admin/blog.css}">

<div class="form-container">
    <h2>Add Blog</h2>

    <p th:if="${error}" th:text="${error}" style="color:red;"></p>

    <form th:action="@{/admin/blogs/add}" method="post" enctype="multipart/form-data">

        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" required>
        </div>

        <div class="form-group">
            <label>Image</label>
            <input type="file" name="file" required>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select name="status">
                <option value="true">Active</option>
                <option value="false">Inactive</option>
            </select>
        </div>

        <div class="form-group">
            <label>Content</label>
            <textarea name="content" id="editor" rows="10"></textarea>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-save">Add Blog</button>
            <a th:href="@{/admin/blogs}" class="btn-back">Back</a>
        </div>

    </form>
</div>

<!-- CKEditor -->
<script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>

<script>
    CKEDITOR.replace('editor', {
        height: 300
    });
</script>
