<link rel="stylesheet" th:href="@{/css/admin/category.css}">

<div class="form-container">
    <h2>Edit Category</h2>

    <form th:action="@{/admin/categories/edit}" method="post" th:object="${category}" enctype="multipart/form-data">

        <input type="hidden" th:field="*{id}" />

        <div class="form-group">
            <label>Name</label>
            <input type="text" th:field="*{name}" required />
        </div>

        <div class="form-group">
            <label>Current Image</label>

            <div th:if="${category.image != null and !#strings.isEmpty(category.image)}" class="current-image">
                <img th:src="@{'/uploads/category/' + ${category.image}}">
            </div>

            <div th:if="${category.image == null or #strings.isEmpty(category.image)}"
                 class="no-image">
                No image currently
            </div>

            <label class="upload-label">
                Upload New Image (Leave blank to keep current)
            </label>
            <input type="file" name="file" accept="image/*" />
        </div>

        <div class="button-group">
            <button type="submit" class="btn-save">Update</button>
            <a th:href="@{/admin/categories}" class="btn-back">Back</a>
        </div>

    </form>
</div>
