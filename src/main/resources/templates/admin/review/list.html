<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin - Review Management</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin-review.css}">
</head>

<body>

<div class="page">

    <h2>Quản lý Review</h2>

    <!-- REVIEW LIST -->
    <div class="review-list">

        <div class="review-box" th:each="r : ${reviews}">

            <!-- HEADER -->
            <div class="review-header">

                <div class="product">
                    <span class="label">Sản phẩm:</span>
                    <b th:text="${r.product.name}"></b>
                </div>

                <div class="date"
                     th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}">
                </div>

            </div>

            <!-- USER + RATING -->
            <div class="review-meta">

                <div class="review-user">
                    <span class="label">Người dùng:</span>
                    <b th:text="${r.name}"></b>
                </div>

                <div class="rating">
                    <span th:if="${r.rating != null}"
                          th:each="i : ${#numbers.sequence(1,r.rating)}">⭐</span>
                </div>

            </div>

            <!-- MESSAGE -->
            <div class="review-message"
                 th:text="${r.message}">
            </div>

            <!-- ADMIN REPLY -->
            <div class="reply-list">

                <div class="admin-reply"
                     th:each="rep : ${r.replies}">

                    <div class="reply-header">

                        <b>Admin</b>

                        <span class="reply-date"
                              th:text="${#temporals.format(rep.createdAt,'dd/MM/yyyy HH:mm')}">
                        </span>

                    </div>

                    <p th:text="${rep.message}"></p>

                </div>

            </div>

            <!-- REPLY FORM -->
            <form class="reply-form"
                  th:action="@{/admin/reviews/reply}"
                  method="post">

                <input type="hidden"
                       name="reviewId"
                       th:value="${r.id}">

                <textarea name="message"
                          placeholder="Trả lời review..."
                          required></textarea>

                <button type="submit">
                    Trả lời
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
