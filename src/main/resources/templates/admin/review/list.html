<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin - Review Management</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin-review.css}">
</head>

<body>

<div th:fragment="content">

    <div class="page">

    <h2>Quản lý Review</h2>

    <!-- REVIEW LIST -->
    <div class="review-list">

        <div class="review-box" th:each="r : ${reviews}">

            <!-- HEADER -->
            <div class="review-header">

                <div class="product">
                    <span class="label">Sản phẩm:</span>
                    <b th:text="${r.product.name}"></b>
                </div>

                <div class="date"
                     th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}">
                </div>

            </div>

            <!-- USER + RATING -->
            <div class="review-meta">

                <div class="review-user">
                    <span class="label">Người dùng:</span>
                    <b th:text="${r.name}"></b>
                </div>

                <div class="rating">
                    <span th:if="${r.rating != null}"
                          th:each="i : ${#numbers.sequence(1,r.rating)}">⭐</span>
                </div>

            </div>

            <!-- MESSAGE -->
            <div class="review-message"
                 th:text="${r.message}">
            </div>

            <!-- ADMIN REPLY -->
            <div class="reply-list">

                <div class="admin-reply"
                     th:if="${r.replies != null}"
                     th:each="rep : ${r.replies}">

                    <div class="reply-header">

                        <b th:text="${rep.name}"></b>

                        <span class="reply-date"
                              th:text="${#temporals.format(rep.createdAt,'dd/MM/yyyy HH:mm')}">
            </span>

                    </div>

                    <p th:text="${rep.message}"></p>

                </div>

            </div>

            <!-- REPLY FORM -->
        <form th:if="${session.user != null and
              (session.user.role.name() == 'ADMIN' or session.user.role.name() == 'STAFF')}"
              class="reply-form"
              th:action="@{/admin/reviews/reply}"
              method="post">

                <input type="hidden"
                       name="reviewId"
                       th:value="${r.id}">

                <textarea name="message"
                          placeholder="Trả lời review..."
                          required></textarea>

                <button type="submit">
                    Trả lời
                </button>

            </form>

            <form th:if="${session.user != null and session.user.role.name() == 'ADMIN'}"
                  th:action="@{/admin/reviews/delete}"
                  method="post"
                  style="margin-top:10px;">

                <input type="hidden" name="reviewId" th:value="${r.id}"/>

                <button type="submit" style="background:red;color:white;">
                    Xóa Review
                </button>
            </form>

        </div>


    </div>

        <!-- ===== PAGINATION ===== -->
        <div class="pagination" th:if="${totalPages > 1}">

            <!-- PREV -->
            <a th:if="${currentPage > 0}"
               th:href="@{/admin/reviews(page=${currentPage - 1})}">
                Prev
            </a>

            <!-- PAGE NUMBERS -->
            <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">

        <a th:href="@{/admin/reviews(page=${i})}"
           th:text="${i + 1}"
           th:classappend="${i == currentPage} ? 'active'">
        </a>

    </span>

            <!-- NEXT -->
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/admin/reviews(page=${currentPage + 1})}">
                Next
            </a>

        </div>
</div>
</div>
</body>
</html>
