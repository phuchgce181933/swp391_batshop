<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin - Review Management</title>
    <link rel="stylesheet" th:href="@{/css/admin/admin-review.css}">
</head>

<body>

<div class="page">

    <h2>Quản lý Review</h2>

    <!-- FILTER -->
    <form class="filter-bar" method="get" th:action="@{/admin/reviews}">

        <select name="rating">
            <option value="">Tất cả sao</option>
            <option value="5" th:selected="${selectedRating == 5}">5 ⭐</option>
            <option value="4" th:selected="${selectedRating == 4}">4 ⭐</option>
            <option value="3" th:selected="${selectedRating == 3}">3 ⭐</option>
            <option value="2" th:selected="${selectedRating == 2}">2 ⭐</option>
            <option value="1" th:selected="${selectedRating == 1}">1 ⭐</option>
        </select>

        <button type="submit">Lọc</button>

    </form>

    <!-- REVIEW LIST -->
    <div class="review-list">

        <div class="review-box" th:each="r : ${reviews}">

            <!-- HEADER -->
            <div class="review-header">

                <div class="product">
                    <span class="label">Sản phẩm:</span>
                    <b th:text="${r.product.name}"></b>
                </div>

                <div class="date"
                     th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy HH:mm')}">
                </div>

            </div>

            <!-- USER + RATING -->
            <div class="review-meta">

                <div class="review-user">
                    <span class="label">Người dùng:</span>
                    <b th:text="${r.name}"></b>
                </div>

                <div class="rating">
                    <span th:if="${r.rating != null}"
                          th:each="i : ${#numbers.sequence(1,r.rating)}">⭐</span>
                </div>

            </div>

            <!-- MESSAGE -->
            <div class="review-message"
                 th:text="${r.message}">
            </div>

            <!-- ADMIN REPLY -->
            <div class="reply-list">

                <div class="admin-reply"
                     th:each="rep : ${r.replies}">

                    <div class="reply-header">

                        <b>Admin</b>

                        <span class="reply-date"
                              th:text="${#temporals.format(rep.createdAt,'dd/MM/yyyy HH:mm')}">
                        </span>

                    </div>

                    <p th:text="${rep.message}"></p>

                </div>

            </div>

            <!-- REPLY FORM -->
            <div class="action-group">

                <!-- REPLY FORM -->
                <form class="reply-form"
                      th:action="@{/admin/reviews/reply}"
                      method="post">

                    <input type="hidden"
                           name="reviewId"
                           th:value="${r.id}">

                    <textarea name="message"
                              class="reply-input"
                              placeholder="Trả lời review..."
                              required></textarea>

                    <div class="suggestions">
                        <span onclick="setReply(this)">Cảm ơn bạn đã đánh giá sản phẩm ❤️</span>
                        <span onclick="setReply(this)">Shop xin lỗi vì trải nghiệm chưa tốt 😢</span>
                        <span onclick="setReply(this)">Shop sẽ cải thiện chất lượng dịch vụ 💪</span>
                        <span onclick="setReply(this)">Nếu cần hỗ trợ thêm hãy liên hệ shop nhé 📞</span>
                    </div>

                    <button type="submit">
                        Trả lời
                    </button>
                </form>

                <!-- DELETE -->
                <form th:action="@{/admin/reviews/delete}" method="post"
                      onsubmit="return confirm('Bạn có chắc muốn xóa review này?');">

                    <input type="hidden" name="reviewId" th:value="${r.id}">

                    <button type="submit" class="delete-btn">
                        Xóa
                    </button>

                </form>

            </div>

    </div>
    <div class="pagination">

        <!-- PREVIOUS -->

        <a th:if="${currentPage > 0}"
           th:href="@{/admin/reviews(
        page=${currentPage - 1},
        rating=${selectedRating}
   )}">
            Previous
        </a>

        <!-- PAGE NUMBER -->
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
        <a th:href="@{/admin/reviews(
        page=${i},
        rating=${selectedRating}
            )}"
           th:text="${i + 1}"
           th:classappend="${i == currentPage} ? 'active' : ''">
        </a>
    </span>

        <!-- NEXT -->
        <a th:if="${currentPage < totalPages - 1}"
           th:href="@{/admin/reviews(
            page=${currentPage + 1},
            rating=${selectedRating}
       )}">
            Next
        </a>

    </div>

</div>
    <script>
        function setReply(el) {
            const textarea = el.closest(".reply-form").querySelector(".reply-input");

            if (textarea.value.trim() !== "") {
                textarea.value += " " + el.innerText;
            } else {
                textarea.value = el.innerText;
            }

            textarea.focus();
        }
    </script>

</div>
</body>
</html>
