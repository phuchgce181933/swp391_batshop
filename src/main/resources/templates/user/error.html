<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đã xảy ra lỗi - SmashSports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            max-width: 500px;
            border: none;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            border-radius: 15px;
        }
        .error-icon {
            font-size: 80px;
            color: #dc3545; /* Màu đỏ Danger phù hợp chủ đề cầu lông */
        }
        .btn-home {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
            padding: 10px 30px;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .btn-home:hover {
            background-color: #bb2d3b;
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="card error-card mx-auto p-5">
        <div class="mb-4">
            <i class="fas fa-exclamation-circle error-icon"></i>
        </div>

        <h1 class="display-4 fw-bold text-dark" th:text="${status}">404</h1>

        <h4 class="mb-3 text-secondary" th:text="${error}">Page Not Found</h4>

        <p class="text-muted mb-4"
           th:text="${message != null} ? ${message} : 'Rất tiếc, đã có lỗi xảy ra hoặc trang bạn tìm không tồn tại.'">
            Mô tả lỗi sẽ hiện ở đây.
        </p>

        <a href="/" class="btn btn-home text-decoration-none">
            <i class="fas fa-home me-2"></i> Quay về Trang chủ
        </a>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
