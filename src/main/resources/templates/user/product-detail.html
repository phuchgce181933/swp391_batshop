<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">Product</title>
    <link rel="stylesheet" th:href="@{/css/product-detail.css}">
    <link rel="stylesheet" th:href="@{/css/user/review.css}">

</head>
<body>

<div th:replace="layout/header :: header"></div>

<div class="product-detail-container">

    <!-- IMAGE -->
    <div class="product-images">

        <!-- MAIN IMAGE -->
        <img class="main-img"
             th:if="${product.images != null and !product.images.isEmpty()}"
             th:src="@{/uploads/product/{img}(img=${product.images[0].image})}">

        <img class="main-img"
             th:if="${product.images == null or product.images.isEmpty()}"
             src="/img/no-image.png">

        <!-- THUMB LIST -->
        <div class="thumb-list">
            <img th:each="img : ${product.images}"
                 th:src="@{/uploads/product/{img}(img=${img.image})}">
        </div>

    </div>

    <!-- INFO -->
    <div class="product-info">

        <h1 th:text="${product.name}"></h1>

        <div th:if="${activeFlashSale != null}" class="fs-badge">
            ⚡ FLASH SALE ĐANG DIỄN RA: GIẢM <span th:text="${activeFlashSale.discountPercent}"></span>%
        </div>

        <p>
            Thương hiệu:
            <b th:text="${product.brand != null ? product.brand.name : 'No brand'}"></b>
        </p>

        <p>
            Danh mục:
            <b th:text="${product.category != null ? product.category.name : 'No category'}"></b>
        </p>

        <p>
            Tình trạng:
            <span th:text="${product.status ? 'Còn hàng' : 'Hết hàng'}"></span>
        </p>

        <!-- VARIANT SELECT -->
        <div class="variant-box"
             th:if="${variants != null and !variants.isEmpty()}">

            <h3>Chọn phiên bản:</h3>

            <form th:action="@{/cart/add}" method="post">

                <div th:each="v, stat : ${variants}" class="variant-item">

                    <label>

                        <input type="radio"
                               name="productVariantId"
                               th:value="${v.id}"
                               th:checked="${stat.index == 0}">

                        <span>

                            <span th:text="${v.brand != null ? v.brand.name : ''}"></span>

                            <span th:if="${v.size != null}"
                                  th:text="' - Size: ' + ${v.size.name}"></span>

                            <span th:if="${v.color != null}"
                                  th:text="' - ' + ${v.color.name}"></span>

                            -

                            <b th:text="${#numbers.formatDecimal(
                            (v.additionalPrice != null ? v.additionalPrice : product.price),
                            0,
                            'COMMA',
                            0,
                            'POINT')} + ' ₫'">
                            </b>

                        </span>

                    </label>

                </div>
                <!-- QUANTITY -->
                <div class="qty-box">
                    <button type="button" onclick="minusQty()">-</button>

                    <input id="qty"
                           type="number"
                           name="quantity"
                           value="1"
                           min="1">

                    <button type="button" onclick="plusQty()">+</button>
                </div>

                <button type="submit" class="btn-cart">
                    THÊM VÀO GIỎ HÀNG
                </button>
                <a th:href="@{'/wishlist/add/' + ${product.id}}" class="btn-wishlist" title="Thêm vào yêu thích">
                    <i class="fa-solid fa-heart" style="color: #ff4757; font-size: 1.5rem;"></i>
                </a>
            </form>

        </div>

    </div>

</div>

<!-- DESCRIPTION -->

<div class="product-desc">

    <h3>Mô tả sản phẩm</h3>

    <p th:text="${product.description}"></p>

</div>

<hr>

<div th:if="${reviews == null or reviews.isEmpty()}"
     style="text-align:center;color:#888;margin-top:20px;">

    Chưa có đánh giá nào cho sản phẩm này.

</div>
<!-- ================= REVIEW SECTION ================= -->

<div class="review-section">

    <h3>
        Đánh giá & nhận xét
        <span th:text="${product.name}"></span>
    </h3>

    <!-- ===== RATING SUMMARY ===== -->

    <div class="review-summary">

        <div class="avg-rating">

            <h2 th:text="${avgRating != null ? #numbers.formatDecimal(avgRating,1,1) : '0.0'} + '/5'"></h2>

            <div class="stars">
                ⭐ ⭐ ⭐ ⭐ ⭐
            </div>

            <p th:text="${reviews.size()} + ' đánh giá và nhận xét'"></p>

        </div>

    </div>


    <!-- ===== REVIEW BUTTON ===== -->

    <div class="review-action">

        <p>Bạn đánh giá sao sản phẩm này?</p>

        <button onclick="document.getElementById('reviewForm').style.display='block'">
            Đánh giá ngay
        </button>

    </div>


    <!-- ===== REVIEW FORM ===== -->

    <form id="reviewForm"
          th:action="@{/product/review}"
          method="post"
          style="display:none">

        <input type="hidden"
               name="productId"
               th:value="${product.id}">

        <label>Tên</label>
        <input type="text" name="name" required>

        <label>Số điện thoại</label>
        <input type="text" name="phone" required>

        <label>Đánh giá</label>
        <select name="rating">
            <option value="5">5 ⭐</option>
            <option value="4">4 ⭐</option>
            <option value="3">3 ⭐</option>
            <option value="2">2 ⭐</option>
            <option value="1">1 ⭐</option>
        </select>

        <label>Nhận xét</label>
        <textarea name="message"></textarea>

        <button type="submit">
            Gửi đánh giá
        </button>

    </form>


    <!-- ===== REVIEW LIST ===== -->

    <div class="review-item"
         th:each="r : ${reviews}">

        <h4 th:text="${r.name}"></h4>

        <p>

            Đánh giá:

            <span th:each="i : ${#numbers.sequence(1,r.rating)}">
⭐
</span>

        </p>

        <p>
            <b>Nhận xét :</b>

            <span th:text="${r.message}"></span>

        </p>

        <p class="review-date"
           th:text="${#temporals.format(r.createdAt,'dd/MM/yyyy')}"></p>


        <!-- ADMIN REPLY -->

        <div th:each="rep : ${r.replies}">

            <b>Admin:</b>

            <p th:text="${rep.message}"></p>

        </div>

    </div>


    <!-- ===== PAGINATION ===== -->

<!--    <div class="pagination"-->
<!--         th:if="${totalPages > 1}">-->

<!--        <a th:if="${currentPage > 0}"-->
<!--           th:href="@{/product/detail/{id}(id=${product.id},page=${currentPage-1})}">-->
<!--            Prev-->
<!--        </a>-->

<!--        <span th:each="i : ${#numbers.sequence(0,totalPages-1)}">-->

<!--<a th:href="@{/product/detail/{id}(id=${product.id},page=${i})}"-->
<!--   th:text="${i+1}"-->
<!--   th:classappend="${i == currentPage} ? 'active'">-->
<!--</a>-->

<!--</span>-->

<!--        <a th:if="${currentPage < totalPages-1}"-->
<!--           th:href="@{/product/detail/{id}(id=${product.id},page=${currentPage+1})}">-->
<!--            Next-->
<!--        </a>-->

<!--    </div>-->

</div>

<div class="comment-section">

    <h3>Bình luận</h3>

    <form th:action="@{/product/comment}" method="post">

        <input type="hidden"
               name="productId"
               th:value="${product.id}">

        <input type="text"
               name="name"
               placeholder="Tên của bạn"
               required>

        <textarea name="message"
                  placeholder="Nhập bình luận..."
                  required></textarea>

        <button type="submit">
            Gửi
        </button>

    </form>

    <hr>

    <div class="comment-item"
         th:each="c : ${comments}">

        <div class="comment-header">

            <b th:text="${c.name}"></b>

            <span th:if="${c.admin}" class="admin-badge">
QTV
</span>

        </div>

        <p th:text="${c.message}"></p>

        <!-- reply form -->

        <form th:action="@{/product/comment/reply}" method="post">

            <input type="hidden"
                   name="productId"
                   th:value="${product.id}">

            <input type="hidden"
                   name="parentId"
                   th:value="${c.id}">

            <input type="text"
                   name="name"
                   placeholder="Tên">

            <textarea name="message"
                      placeholder="Trả lời..."></textarea>

            <button type="submit">
                Trả lời
            </button>

        </form>


        <!-- replies -->

        <div class="reply-item"
             th:each="rep : ${c.replies}">

            <b th:text="${rep.name}"></b>

            <span th:if="${rep.admin}" class="admin-badge">
QTV
</span>

            <p th:text="${rep.message}"></p>

        </div>

    </div>

</div>
<!-- FOOTER -->

<div th:replace="layout/footer :: footer"></div>

<!-- JS -->

<script>

    function plusQty() {

        let q = document.getElementById("qty");

        q.value = parseInt(q.value) + 1;
    }

    function minusQty() {

        let q = document.getElementById("qty");

        if (q.value > 1) {
            q.value--;
        }

    }
    //phước bỏ vào
    document.addEventListener("DOMContentLoaded", function() {
        const radios = document.querySelectorAll('.variant-radio');
        const btnAddToCart = document.getElementById('btnAddToCart');
        const qtyInput = document.getElementById('qty');

        // Hàm cập nhật trạng thái của nút Mua Hàng
        function updateCartState() {
            const selectedRadio = document.querySelector('.variant-radio:checked');
            if (selectedRadio) {
                // Lấy số lượng tồn kho từ biến thể đang được chọn
                const stock = parseInt(selectedRadio.getAttribute('data-stock'));

                if (stock <= 0) {
                    // Trạng thái: HẾT HÀNG
                    btnAddToCart.disabled = true;
                    btnAddToCart.style.backgroundColor = '#ccc';
                    btnAddToCart.style.cursor = 'not-allowed';
                    btnAddToCart.innerText = 'ĐÃ HẾT HÀNG';
                    qtyInput.disabled = true;
                } else {
                    // Trạng thái: CÒN HÀNG
                    btnAddToCart.disabled = false;
                    btnAddToCart.style.backgroundColor = '#f15a22';
                    btnAddToCart.style.cursor = 'pointer';
                    btnAddToCart.innerText = 'THÊM VÀO GIỎ HÀNG';
                    qtyInput.disabled = false;

                    // Giới hạn max để khách không nhập quá số lượng tồn kho
                    qtyInput.max = stock;
                    if (parseInt(qtyInput.value) > stock) {
                        qtyInput.value = stock; // Tự động giảm số lượng về mức tồn kho thực tế
                    }
                }
            }
        }

        // Chạy ngay lúc vừa load trang để check biến thể đầu tiên
        if(radios.length > 0) updateCartState();

        // Lắng nghe sự kiện mỗi khi người dùng đổi biến thể khác (đổi Size, Màu...)
        radios.forEach(radio => {
            radio.addEventListener('change', updateCartState);
        });
    });

    // Cập nhật lại 2 hàm tăng giảm số lượng an toàn hơn
    function plusQty() {
        let q = document.getElementById("qty");
        if(q.disabled) return; // Nếu hết hàng thì không cho bấm

        let currentVal = parseInt(q.value);
        let maxVal = parseInt(q.max); // Lấy max từ JS đã set ở trên

        if (currentVal < maxVal) {
            q.value = currentVal + 1;
        } else {
            alert("Số lượng sản phẩm trong kho chỉ còn " + maxVal);
        }
    }

    function minusQty() {
        let q = document.getElementById("qty");
        if(q.disabled) return;

        if (parseInt(q.value) > 1) {
            q.value = parseInt(q.value) - 1;
        }
    }
</script>

</body>
</html>
