<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}"></title>
    <link rel="stylesheet" th:href="@{/css/product-detail.css}">
</head>
<body>

<div th:replace="layout/header :: header"></div>

<div class="product-detail-container">

    <!-- IMAGE -->
    <div class="product-images">

        <img class="main-img"
             th:if="${product.images != null and !product.images.isEmpty()}"
             th:src="@{/uploads/product/{img}(img=${product.images[0].image})}">

        <img class="main-img"
             th:if="${product.images == null or product.images.isEmpty()}"
             src="/img/no-image.png">

        <div class="thumb-list">
            <img th:each="img : ${product.images}"
                 th:src="@{/uploads/product/{img}(img=${img.image})}">
        </div>
    </div>

    <!-- INFO -->
    <div class="product-info">

        <h1 th:text="${product.name}"></h1>

        <p>Thương hiệu:
            <b th:text="${product.brand != null ? product.brand.name : 'No brand'}"></b>
        </p>

        <p>Danh mục:
            <b th:text="${product.category != null ? product.category.name : 'No category'}"></b>
        </p>

        <p>Tình trạng:
            <span th:text="${product.status ? 'Còn hàng' : 'Hết hàng'}"></span>
        </p>

        <!-- VARIANT SELECT -->
        <div class="variant-box"
             th:if="${variants != null and !variants.isEmpty()}">

            <h3>Chọn phiên bản:</h3>

            <form th:action="@{/cart/add}" method="post">

                <div th:each="v, stat : ${variants}" class="variant-item">
                    <label>
                        <input type="radio"
                               name="productVariantId"
                               th:value="${v.id}"
                               th:checked="${stat.index == 0}">

                        <span>
                    <span th:text="${v.brand.name}"></span>

                    <span th:if="${v.size != null}"
                          th:text="' - Size: ' + ${v.size.name}"></span>

                    <span th:if="${v.color != null}"
                          th:text="' - ' + ${v.color.name}"></span>

                    -
                    <b th:text="${#numbers.formatDecimal(
                        product.price +
                        (v.additionalPrice != null ? v.additionalPrice : 0),
                        0,'COMMA',0,'POINT')} + ' ₫'">
                    </b>
                </span>
                    </label>
                </div>

                <div class="qty-box">
                    <button type="button" onclick="minusQty()">-</button>
                    <input id="qty" type="number" name="quantity" value="1" min="1">
                    <button type="button" onclick="plusQty()">+</button>
                </div>

                <button type="submit" class="btn-cart">
                    THÊM VÀO GIỎ HÀNG
                </button>

            </form>
        </div>

    </div>

</div>

<!-- DESCRIPTION -->
<div class="product-desc">
    <h3>Mô tả sản phẩm</h3>
    <p th:text="${product.description}"></p>
</div>

<div th:replace="layout/footer :: footer"></div>

<script>
    function plusQty() {
        let q = document.getElementById("qty");
        q.value = parseInt(q.value) + 1;
    }

    function minusQty() {
        let q = document.getElementById("qty");
        if (q.value > 1) q.value--;
    }
</script>

</body>
</html>
