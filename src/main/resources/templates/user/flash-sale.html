<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Sale - BatShop</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/user/header.css}">
    <link rel="stylesheet" th:href="@{/css/user/flash-sale.css}">
    <link rel="stylesheet" th:href="@{/css/user/footer.css}">
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="flash-sale-container">
    <div class="flash-sale-banner">
        <h2>⚡ FLASH SALE ⚡</h2>

        <div th:if="${flashSale != null}" class="countdown-wrapper">
            <p>Kết thúc trong:</p>
            <div id="countdown" class="countdown-timer" th:data-endtime="${flashSale.endDate}">
                <span id="days">00</span> Ngày
                <span id="hours">00</span> Giờ
                <span id="minutes">00</span> Phút
                <span id="seconds">00</span> Giây
            </div>
        </div>
        <div th:if="${flashSale == null}">
            <p>Hiện tại không có chương trình Flash Sale nào đang diễn ra.</p>
        </div>
    </div>

    <div th:if="${flashSale != null}" class="flash-sale-products">
        <div class="product-grid">
            <div th:each="fsp : ${flashSaleProducts}" class="product-card">

                <div class="product-image">
                    <img th:if="${!fsp.product.images.isEmpty()}"
                         th:src="@{'/uploads/product/' + ${fsp.product.images[0].image}}"
                         alt="Product Image">
                    <div class="discount-badge">
                        -<span th:text="${flashSale.discountPercent}"></span>%
                    </div>
                </div>

                <div class="product-info">
                    <h3 th:text="${fsp.product.name}">Tên vợt</h3>

                    <div class="price-section">
                        <span class="sale-price" th:text="${#numbers.formatDecimal(fsp.salePrice, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
                        <span class="original-price" th:text="${#numbers.formatDecimal(fsp.product.price, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"></span>
                    </div>

                    <a th:href="@{/product/{id}(id=${fsp.product.id})}" class="btn-buy-now">Mua Ngay</a>
                </div>
            </div>
        </div>
    </div>

    <script th:if="${flashSale != null}">
        document.addEventListener('DOMContentLoaded', function() {
            const countdownElement = document.getElementById('countdown');
            const endTimeStr = countdownElement.getAttribute('data-endtime');

            const countDownDate = new Date(endTimeStr).getTime();

            const x = setInterval(function() {
                const now = new Date().getTime();
                const distance = countDownDate - now;

                if (distance < 0) {
                    clearInterval(x);
                    countdownElement.innerHTML = "Đã kết thúc";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days.toString().padStart(2, '0');
                document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
                document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
                document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
            }, 1000);
        });
    </script>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

</body>
</html>
