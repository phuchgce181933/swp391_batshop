<div th:fragment="productvariant-list">

    <div class="filter-wrapper">
        <form method="get" th:action="@{/home}">
            <select name="categoryId" onchange="this.form.submit()" style="padding: 8px; border-radius: 5px; border: 1px solid #ddd;">
                <option value="">-- Tất cả danh mục --</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}"
                        th:selected="${selectedCategory == c.id}">
                </option>
            </select>
        </form>
    </div>

    <div class="product-grid">

        <div th:each="p : ${products}" class="product-card">

            <a th:href="@{/product/detail/{id}(id=${p.id})}" class="product-image" style="position: relative; display: block;">

                <div th:if="${activeFlashSale != null and activeFlashSale.products.![product.id].contains(p.id)}"
                     style="position: absolute; top: 10px; right: 10px; background: #e74c3c; color: white; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: bold; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.2);">
                    -<span th:text="${activeFlashSale.discountPercent}"></span>%
                </div>

                <img th:if="${p.images != null and !p.images.isEmpty()}"
                     th:src="@{/uploads/product/{img}(img=${p.images[0].image})}"
                     th:alt="${p.name}" style="width: 100%; height: auto; object-fit: cover;">

                <img th:if="${p.images == null or p.images.isEmpty()}"
                     th:src="@{/img/no-image.png}"
                     alt="No image available" style="width: 100%; height: auto; object-fit: cover;">

            </a>

            <div class="product-info" style="padding: 15px; text-align: center;">

                <a th:href="@{/product/detail/{id}(id=${p.id})}" style="text-decoration: none; color: #333;">
                    <h3 th:text="${p.name}" style="font-size: 1.1rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></h3>
                </a>

                <div class="brand" style="color: #7f8c8d; font-size: 0.9rem; margin-bottom: 10px;">
                    <span th:text="${p.brand != null ? p.brand.name : 'No brand'}"></span>
                </div>

                <div class="price" style="margin-bottom: 15px;">

                    <th:block th:if="${activeFlashSale != null and activeFlashSale.products.![product.id].contains(p.id)}">
                        <span style="color: #95a5a6; text-decoration: line-through; font-size: 0.9rem; margin-right: 8px;"
                              th:text="${#numbers.formatDecimal(p.price, 0,'COMMA',0,'POINT')} + ' ₫'">
                        </span>
                        <span style="color: #e74c3c; font-weight: bold; font-size: 1.2rem;"
                              th:text="${#numbers.formatDecimal(p.price - (p.price * activeFlashSale.discountPercent / 100.0), 0,'COMMA',0,'POINT')} + ' ₫'">
                        </span>
                    </th:block>

                    <th:block th:unless="${activeFlashSale != null and activeFlashSale.products.![product.id].contains(p.id)}">
                        <span style="font-weight: bold; font-size: 1.1rem; color: #f15a22;"
                              th:text="${#numbers.formatDecimal(p.price, 0,'COMMA',0,'POINT')} + ' ₫'">
                        </span>
                    </th:block>

                </div>

            </div>

            <div class="product-actions" style="text-align: center; padding-bottom: 15px;">
                <a th:href="@{/product/detail/{id}(id=${p.id})}"
                   class="btn-cart" style="background-color: #333; color: white; padding: 8px 15px; text-decoration: none; border-radius: 4px; font-size: 0.9rem; transition: background 0.3s;">
                    Xem chi tiết
                </a>
            </div>

        </div>

    </div>

</div>
