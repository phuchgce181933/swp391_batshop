<div th:fragment="productvariant-list">

    <!-- FILTER CATEGORY -->
    <div class="filter-wrapper">
        <form method="get" th:action="@{/home}">
            <select name="categoryId" onchange="this.form.submit()">
                <option value="">-- Tất cả danh mục --</option>

                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}"
                        th:selected="${selectedCategory == c.id}">
                </option>
            </select>
        </form>
    </div>

    <!-- GRID PRODUCTS -->
    <div class="product-grid">

        <div th:each="p : ${products}" class="product-card">

            <!-- IMAGE -->
            <a th:href="@{/product/detail/{id}(id=${p.id})}" class="product-image">

                <img th:if="${p.images != null and !p.images.isEmpty()}"
                     th:src="@{/uploads/product/{img}(img=${p.images[0].image})}"
                     th:alt="${p.name}">

                <img th:if="${p.images == null or p.images.isEmpty()}"
                     th:src="@{/img/no-image.png}"
                     alt="No image available">

            </a>

            <!-- INFO -->
            <div class="product-info">

                <a th:href="@{/product/detail/{id}(id=${p.id})}"
                   style="text-decoration: none;">
                    <h3 th:text="${p.name}"></h3>
                </a>

                <div class="brand">
                    <span th:text="${p.brand != null ? p.brand.name : 'No brand'}"></span>
                </div>

                <div class="price"
                     th:text="${#numbers.formatDecimal(
                     p.price,
                     0,'COMMA',0,'POINT')} + ' ₫'">
                </div>

            </div>

            <!-- ACTION -->
            <div class="product-actions">
                <a th:href="@{/product/detail/{id}(id=${p.id})}"
                   class="btn-cart">
                    Xem chi tiết
                </a>
            </div>

        </div>

    </div>

</div>
