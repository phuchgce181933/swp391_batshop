<link rel="stylesheet" th:href="@{/css/user/product-list.css}">
<body>
<div th:fragment="product-list">

<div th:replace="layout/header :: header"></div>

<section class="section-container">

    <h2 class="section-title">Tất cả sản phẩm</h2>

    <div class="shop-layout">

        <!-- SIDEBAR FILTER -->
        <aside class="sidebar">

            <form method="get" th:action="@{/products}" class="filter-form">

                <!-- SEARCH -->
                <div class="filter-group">
                    <input type="text"
                           name="keyword"
                           placeholder="Tìm sản phẩm..."
                           th:value="${keyword}">
                </div>

                <!-- CATEGORY -->
                <div class="filter-group">
                    <label>Danh mục</label>
                    <select name="categoryId">
                        <option value="">Tất cả</option>
                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.name}"
                                th:selected="${selectedCategory == c.id}">
                        </option>
                    </select>
                </div>

                <!-- BRAND -->
                <div class="filter-group">
                    <label>Thương hiệu</label>
                    <select name="brandId">
                        <option value="">Tất cả</option>
                        <option th:each="b : ${brands}"
                                th:value="${b.id}"
                                th:text="${b.name}"
                                th:selected="${selectedBrand == b.id}">
                        </option>
                    </select>
                </div>

                <!-- SORT -->
                <div class="filter-group">
                    <label>Sắp xếp</label>
                    <select name="sort">
                        <option value="default">Mặc định</option>
                        <option value="priceAsc"
                                th:selected="${selectedSort == 'priceAsc'}">
                            Giá tăng dần
                        </option>
                        <option value="priceDesc"
                                th:selected="${selectedSort == 'priceDesc'}">
                            Giá giảm dần
                        </option>
                    </select>
                </div>

                <button type="submit" class="filter-btn">Áp dụng</button>

            </form>

        </aside>


        <!-- PRODUCT CONTENT -->
        <div class="product-content">

            <div class="product-grid">
                <div th:each="p : ${products}" class="product-card">

                    <a th:href="@{/product/detail/{id}(id=${p.id})}">
                        <img th:if="${p.images != null and !p.images.isEmpty()}"
                             th:src="@{/uploads/product/{img}(img=${p.images[0].image})}">
                        <img th:if="${p.images == null or p.images.isEmpty()}"
                             src="/img/no-image.png">
                    </a>

                    <h3 th:text="${p.name}"></h3>
                    <p th:text="${p.brand != null ? p.brand.name : 'No brand'}"></p>

                    <div class="price"
                         th:text="${#numbers.formatDecimal(
                         p.price,0,'COMMA',0,'POINT')} + ' ₫'">
                    </div>

                </div>
            </div>

        </div>

    </div>
    <div class="pagination" th:if="${totalPages > 1}">

        <!-- PREV -->
        <a th:if="${currentPage > 0}"
           th:with="prevPage=${currentPage - 1}"
           th:href="@{/products(page=${prevPage},categoryId=${selectedCategory},brandId=${selectedBrand},keyword=${keyword},sort=${selectedSort})}">
            ←
        </a>

        <!-- PAGE NUMBERS -->
        <span th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
        <a th:href="@{/products(page=${i},categoryId=${selectedCategory},brandId=${selectedBrand},keyword=${keyword},sort=${selectedSort})}"
           th:text="${i+1}"
           th:classappend="${i == currentPage} ? ' active' : ''">
        </a>
    </span>

        <!-- NEXT -->
        <a th:if="${currentPage < totalPages - 1}"
           th:with="nextPage=${currentPage + 1}"
           th:href="@{/products(page=${nextPage},categoryId=${selectedCategory},brandId=${selectedBrand},keyword=${keyword},sort=${selectedSort})}">
            →
        </a>
    </div>
</section>
</div>
</body>
