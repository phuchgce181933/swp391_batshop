<div th:fragment="productBestseller-list" class="product-grid bestseller-area">
    <div th:each="row : ${topSellingProducts}" class="product-card" th:with="product=${row[0]}, sold=${row[1]}">

        <a th:href="@{/product/detail/{id}(id=${product.id})}" class="product-image" style="position: relative; display: block;">
            <div class="top-selling-badge">HOT</div>

            <img th:if="${product.images != null and !product.images.isEmpty()}"
                 th:src="@{/uploads/product/{img}(img=${product.images[0].image})}"
                 th:alt="${product.name}">

            <img th:if="${product.images == null or product.images.isEmpty()}"
                 th:src="@{/img/no-image.png}"
                 alt="No image available">
        </a>

        <div class="product-info bestseller-info">
            <a th:href="@{/product/detail/{id}(id=${product.id})}" class="bestseller-title-link">
                <h3 class="bestseller-title" th:text="${product.name}"></h3>
            </a>

            <div class="bestseller-brand">
                <span th:text="${product.brand != null ? product.brand.name : 'No brand'}"></span>
            </div>

            <div class="bestseller-price">
                <span th:text="${#numbers.formatDecimal(product.price, 0,'COMMA',0,'POINT')} + ' ₫'"></span>
            </div>

            <div class="bestseller-sold-wrap">
                <div class="bestseller-sold">
                    <i class="fa-solid fa-cart-shopping"></i> Đã bán: <span class="sold-number" th:text="${sold}">0</span>
                </div>
            </div>
        </div>

    </div>
</div>
