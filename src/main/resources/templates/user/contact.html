<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liên Hệ - BatShop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/user/contact.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<div th:replace="layout/header :: header"></div>

<div class="contact-container">
    <div class="breadcrumb">
        <a th:href="@{/home}">Trang chủ</a> <span class="separator">></span> <span class="current">Liên hệ</span>
    </div>

    <div class="contact-content">
        <h2 class="contact-main-title">NƠI GIẢI ĐÁP TOÀN BỘ MỌI THẮC MẮC CỦA BẠN?</h2>

        <div class="contact-info">
            <p><strong>Hotline:</strong> <span class="highlight">090090909 | 0909090909</span></p>
            <p><strong>Email:</strong> <span class="highlight">info@batshop.com</span></p>
        </div>

        <h3 class="contact-sub-title">LIÊN HỆ VỚI CHÚNG TÔI</h3>

        <form th:action="@{/contact}" method="post" th:object="${contactSupport}" class="contact-form">
            <div class="form-group-row">
                <input type="text" th:field="*{name}" placeholder="Họ và tên" class="form-control" required>
                <input type="email" th:field="*{email}" placeholder="Email" class="form-control" required>
            </div>
            <div class="form-group">
                <input type="text" th:field="*{phone}" placeholder="Điện thoại" class="form-control">
            </div>
            <div class="form-group">
                <textarea th:field="*{message}" placeholder="Nội dung" rows="6" class="form-control" required></textarea>
            </div>
            <button type="submit" class="submit-btn">Gửi thông tin</button>
        </form>

        <div class="map-container">
            <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3929.0543809241854!2d105.730018074807!3d10.012366990093701!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMTDCsDAwJzQ0LjUiTiAxMDXCsDQzJzU3LjMiRQ!5e0!3m2!1svi!2sus!4v1772442428434!5m2!1svi!2sus"
                    width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
    </div>
</div>

<div th:replace="layout/footer :: footer"></div>

<div class="popup-overlay" th:if="${param.success != null}">
    <div class="popup-content">
        <div class="popup-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h3 class="popup-title">Thành công!</h3>
        <p class="popup-message">Thông tin liên hệ đã được gửi đi thành công.</p>
        <div class="popup-actions">
            <a th:href="@{/home}" class="btn-home">Trang chủ</a>
            <a th:href="@{/contact}" class="btn-close">Tiếp tục</a>
        </div>
    </div>
</div>

</body>
</html>
