<div th:fragment="category">
<h1>All Categories</h1>

<p th:if="${error}" th:text="${error}" style="color:red"></p>

<table>
    <thead>
    <tr>
        <th>Name</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="c : ${categories}">
        <td th:text="${c.name}"></td>
    </tr>
    </tbody>
</table>
</div>
