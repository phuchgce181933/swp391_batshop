<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Địa chỉ - BatShop</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <!-- CSS riêng -->
  <link rel="stylesheet" th:href="@{/css/address.css}">
</head>

<body>

<div th:replace="layout/header :: header"></div>

<div class="container address-container">
  <div class="row">

    <!-- DANH SÁCH ĐỊA CHỈ -->
    <div class="col-md-6">
      <h4 class="mb-4">
        <i class="fa-solid fa-map-location-dot"></i> Địa chỉ của tôi
      </h4>

      <div th:each="addr : ${addresses}" class="card mb-3">
        <div class="card-body d-flex justify-content-between align-items-start">
          <div>
                        <span th:if="${addr.isDefault}" class="badge badge-default mb-2">
                            <i class="fa-solid fa-circle-check"></i> Địa chỉ mặc định
                        </span>

            <div class="user-info-row">
              <i class="fa-solid fa-user"></i>
              <strong th:text="${addr.fullName}"></strong>
            </div>

            <div class="user-info-row">
              <i class="fa-solid fa-phone"></i>
              <span th:text="${addr.phone}"></span>
            </div>

            <p class="mb-1 fw-bold mt-2" th:text="${addr.detail}"></p>

            <small class="text-muted"
                   th:text="${addr.ward} + ', ' + ${addr.district} + ', ' + ${addr.city}">
            </small>
          </div>

          <button type="button"
                  class="btn btn-outline-warning btn-sm"
                  th:onclick="'editAddress(' + ${addr.id} + ')'">
            <i class="fa-solid fa-pencil"></i> Sửa
          </button>
        </div>
      </div>
    </div>

    <!-- FORM THÊM / SỬA -->
    <div class="col-md-6">
      <div class="card p-4">

        <form th:action="@{/address/save}" method="post" id="addressForm">

          <h5 id="formTitle" class="mb-3 text-primary">
            Thêm địa chỉ mới
          </h5>

          <input type="hidden" name="id" id="addressId">

          <div class="mb-3">
            <label class="form-label small fw-bold">
              Họ tên người nhận
            </label>
            <input type="text" class="form-control"
                   name="fullName" id="fullName" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">
              Số điện thoại
            </label>
            <input type="text" class="form-control"
                   name="phone" id="phone" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">
              Tỉnh/Thành phố
            </label>
            <select class="form-select"
                    id="city" name="city" required>
              <option value="" selected>
                -- Chọn Tỉnh/Thành --
              </option>
            </select>
          </div>

          <div class="address-row-flex mb-3">
            <div class="flex-item">
              <label class="form-label small fw-bold">
                Quận/Huyện
              </label>
              <select class="form-select"
                      id="district"
                      name="district"
                      required disabled>
                <option value="" selected>
                  -- Chọn Huyện --
                </option>
              </select>
            </div>

            <div class="flex-item">
              <label class="form-label small fw-bold">
                Phường/Xã
              </label>
              <select class="form-select"
                      id="ward"
                      name="ward"
                      required disabled>
                <option value="" selected>
                  -- Chọn Xã --
                </option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">
              Số nhà, tên đường
            </label>
            <input type="text" class="form-control"
                   name="detail" id="detail" required>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input"
                   type="checkbox"
                   name="isDefault"
                   id="isDefaultCheck">
            <label class="form-check-label">
              Đặt làm địa chỉ mặc định
            </label>
          </div>

          <div class="d-grid gap-2">
            <button type="submit"
                    class="btn btn-primary">
              LƯU ĐỊA CHỈ
            </button>

            <button type="button"
                    onclick="prepareAddNew()"
                    class="btn btn-add-new">
              <i class="fa-solid fa-plus-circle"></i>
              THÊM ĐỊA CHỈ KHÁC
            </button>
          </div>

        </form>

      </div>
    </div>

  </div>
</div>

<!-- SCRIPT ĐẶT TRƯỚC </body> -->
<script>
  const citis = document.getElementById("city");
  const districts = document.getElementById("district");
  const wards = document.getElementById("ward");
  let provinceData = [];

  fetch("https://provinces.open-api.vn/api/?depth=3")
          .then(res => res.json())
          .then(data => {
            provinceData = data;
            data.forEach(x => {
              citis.options[citis.options.length] =
                      new Option(x.name, x.name);
            });
          });

  citis.onchange = () => {
    districts.length = 1;
    wards.length = 1;
    districts.disabled = true;
    wards.disabled = true;

    if (citis.value !== "") {
      const result = provinceData.find(n => n.name === citis.value);
      result.districts.forEach(k => {
        districts.options[districts.options.length] =
                new Option(k.name, k.name);
      });
      districts.disabled = false;
    }
  };

  districts.onchange = () => {
    wards.length = 1;
    wards.disabled = true;

    if (districts.value !== "") {
      const resultCity = provinceData.find(n => n.name === citis.value);
      const resultDistrict =
              resultCity.districts.find(m => m.name === districts.value);

      resultDistrict.wards.forEach(w => {
        wards.options[wards.options.length] =
                new Option(w.name, w.name);
      });

      wards.disabled = false;
    }
  };

  function prepareAddNew() {
    document.getElementById('addressForm').reset();
    document.getElementById('addressId').value = "";
    document.getElementById('formTitle').innerText = "Thêm địa chỉ mới";
    document.getElementById('formTitle').className = "mb-3 text-success";
    districts.disabled = true;
    wards.disabled = true;
  }

  function editAddress(id) {
    fetch('/address/get/' + id)
            .then(res => res.json())
            .then(data => {

              document.getElementById('formTitle').innerText =
                      "Chỉnh sửa địa chỉ";
              document.getElementById('formTitle').className =
                      "mb-3 text-warning";

              document.getElementById('addressId').value = data.id;
              document.getElementById('fullName').value = data.fullName;
              document.getElementById('phone').value = data.phone;
              document.getElementById('detail').value = data.detail;
              document.getElementById('isDefaultCheck').checked =
                      data.isDefault;

              citis.value = data.city;
              citis.onchange();

              setTimeout(() => {
                districts.value = data.district;
                districts.onchange();

                setTimeout(() => {
                  wards.value = data.ward;
                }, 300);

              }, 300);
            });
  }
</script>

</body>
</html>
