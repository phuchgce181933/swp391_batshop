<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Tracking</title>
    <link rel="stylesheet" th:href="@{/css/homeproduct.css}">
    <link rel="stylesheet" th:href="@{/css/user/order-tracking.css}">
</head>
<body>
<div th:replace="layout/header :: header"></div>
<div class="tracking-container">
<h2>Order Tracking</h2>

<div class="box">
    <p><strong>Order ID:</strong> <span th:text="${order.id}"></span></p>
    <p>
        <strong>Created At:</strong>
        <span th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy')} + ' lúc: ' + ${#temporals.format(order.createdAt, 'HH:mm')}"></span>
    </p>
    <p>
        <strong>Total Price:</strong>
        <span th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + '₫'"></span>
    </p>
    <p><strong>Payment Method:</strong> <span th:text="${order.paymentMethod}"></span></p>
    <p><strong>Status:</strong>
        <span th:text="${order.status}"></span>
    </p>
    <p th:if="${order.status.name() == 'CANCELLED'}">
        <strong>Lý do hủy:</strong>
        <span th:text="${order.cancelReason != null ? order.cancelReason : 'Không có'}"></span>
    </p>
    <!-- Nút hủy đơn hàng -->
    <div th:if="${order.status != null and (order.status.name() == 'PENDING' or order.status.name() == 'PROCESSING')}"
         class="cancel-order">
        <form th:action="@{'/user/orders/cancel/' + ${order.id}}" method="post">
            <label for="reason">Lý do hủy đơn:</label>
            <select id="reason" name="reason" required>
                <option value="">-- Chọn lý do --</option>
                <option value="Thay đổi ý định">Thay đổi ý định</option>
                <option value="Tìm được giá tốt hơn">Tìm được giá tốt hơn</option>
                <option value="Đặt nhầm đơn">Đặt nhầm đơn</option>
                <option value="Khác">Khác (vui lòng nhập)</option>
            </select>

            <input type="text" id="otherReason" name="otherReason" placeholder="Nhập lý do khác"
                   style="display:none; margin-top:5px;">

            <button type="submit">Hủy đơn</button>
        </form>
    </div>
</div>
<!-- Timeline trạng thái -->
<div class="box">
    <h3>Tracking Progress</h3>

    <div class="timeline">

        <!-- PENDING -->
        <div class="step" th:classappend="${order.status.name() == 'PENDING'} ? 'active'">
            <div class="circle">1</div>
            <p>PENDING</p>
        </div>

        <!-- CONFIRMED -->
        <div class="step" th:classappend="${order.status.name() == 'CONFIRMED'} ? 'active'">
            <div class="circle">2</div>
            <p>CONFIRMED</p>
        </div>

        <!-- PACKED -->
        <div class="step" th:classappend="${order.status.name() == 'PACKED'} ? 'active'">
            <div class="circle">3</div>
            <p>PACKED</p>
        </div>

        <!-- SHIPPING -->
        <div class="step" th:classappend="${order.status.name() == 'SHIPPING'} ? 'active'">
            <div class="circle">4</div>
            <p>SHIPPING</p>
        </div>

        <!-- COMPLETED -->
        <div class="step" th:classappend="${order.status.name() == 'COMPLETED'} ? 'active'">
            <div class="circle">5</div>
            <p>COMPLETED</p>
        </div>

        <!-- PROCESSING (riêng) -->
        <div class="step" th:if="${order.status.name() == 'PROCESSING'}" th:classappend="'active processing'">
            <div class="circle">P</div>
            <p>PROCESSING</p>
        </div>

        <!-- CANCELLED -->
        <div class="step" th:if="${order.status.name() == 'CANCELLED'}" th:classappend="'active cancelled'">
            <div class="circle">X</div>
            <p>CANCELLED</p>
        </div>

    </div>
</div>

<!-- Danh sách sản phẩm -->
<div class="box">
    <h3>Order Items</h3>

    <table>
        <thead>
        <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Total</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${order.orderItems}">
            <td th:text="${item.productVariant.product.name}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.price}"></td>
            <td th:text="${item.price.multiply(item.quantity)}"></td>
        </tr>
        </tbody>
    </table>
</div>

<a href="/user/orders">← Back to Orders</a>
</div>
</body>
<script>
    const select = document.getElementById('reason');
    const otherInput = document.getElementById('otherReason');

    select.addEventListener('change', function() {
        if (this.value === 'Khác') {
            otherInput.style.display = 'block';
            otherInput.required = true;
        } else {
            otherInput.style.display = 'none';
            otherInput.required = false;
        }
    });
</script>
</html>
