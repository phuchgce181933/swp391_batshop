<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm yêu thích - BatShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .product-card-wish { border: none; shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .product-card-wish:hover { transform: translateY(-5px); }
        .wish-img { height: 200px; object-fit: cover; border-radius: 8px 8px 0 0; }
    </style>
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="container my-5" style="min-height: 600px;">
    <div class="d-flex align-items-center mb-4">
        <h2 class="fw-bold"><i class="fa-solid fa-heart text-danger me-2"></i> Danh sách yêu thích</h2>
    </div>

    <div th:if="${#lists.isEmpty(wishlistItems)}" class="text-center py-5 shadow-sm bg-light rounded">
        <i class="fa-solid fa-heart-crack fa-3x text-secondary mb-3"></i>
        <h4>Danh sách đang trống</h4>
        <p class="text-muted">Hãy thêm những sản phẩm bạn yêu thích vào đây nhé!</p>
        <a href="/" class="btn btn-primary px-4">Tiếp tục mua sắm</a>
    </div>

    <div class="row" th:if="${!#lists.isEmpty(wishlistItems)}">
        <div th:each="item : ${wishlistItems}" class="col-md-3 mb-4">
            <div class="card h-100 product-card-wish">

                <div class="position-relative">
                    <img th:if="${item.product.images != null and !item.product.images.isEmpty()}"
                         th:src="@{/uploads/products/{img}(img=${item.product.images[0].image})}"
                         class="card-img-top wish-img" alt="Product image">

                    <img th:if="${item.product.images == null or item.product.images.isEmpty()}"
                         src="/img/no-image.png" class="card-img-top wish-img" alt="No image">
                </div>

                <div class="card-body">
                    <p class="text-muted small mb-1" th:text="${item.product.brand.name}"></p>
                    <h6 class="card-title fw-bold" th:text="${item.product.name}"></h6>

                    <p class="text-danger fw-bold mb-3"
                       th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
                    </p>

                    <div class="d-grid gap-2">
                        <a th:href="@{/product/detail/{id}(id=${item.product.id})}"
                           class="btn btn-sm btn-outline-dark">Xem chi tiết</a>

                        <button class="btn btn-sm btn-danger"
                                th:onclick="'confirmDelete(' + ${item.id} + ')'">
                            <i class="fa-solid fa-trash-can me-1"></i> Bỏ thích
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{layout/footer :: footer}"></div>

<script>
    function confirmDelete(id) {
        if (confirm('Bạn có chắc muốn xóa sản phẩm này khỏi danh sách yêu thích?')) {
            // Chuyển hướng đến link xóa trong Controller
            window.location.href = '/wishlist/delete/' + id;
        }
    }
</script>

</body>
</html>
