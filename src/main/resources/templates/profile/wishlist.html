<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sản phẩm yêu thích - BatShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div th:replace="layout/header :: header"></div>

<div class="container my-5">
    <h4 class="mb-4"><i class="fa-solid fa-heart text-danger"></i> Danh sách yêu thích</h4>

    <div th:if="${#lists.isEmpty(wishlistItems)}" class="alert alert-light border text-center">
        <p>Bạn chưa có sản phẩm yêu thích nào.</p>
        <a href="/product/list" class="btn btn-primary">Tiếp tục mua sắm</a>
    </div>

    <div class="row">
        <div th:each="item : ${wishlistItems}" class="col-md-3 mb-4">
            <div class="card h-100 border-0 shadow-sm">
                <img th:if="${!item.product.images.isEmpty()}"
                     th:src="@{'/upload/' + ${item.product.images[0].image}}"
                     class="card-img-top" alt="Product Image">

                <div class="card-body text-center">
                    <h6 class="card-title" th:text="${item.product.name}"></h6>
                    <p class="text-danger fw-bold" th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></p>

                    <div class="d-grid gap-2">
                        <a th:href="@{'/product/detail/' + ${item.product.id}}" class="btn btn-sm btn-outline-primary">Xem chi tiết</a>
                        <button class="btn btn-sm btn-outline-danger" th:onclick="'confirmDelete(' + ${item.id} + ')'">
                            <i class="fa-solid fa-trash"></i> Xóa
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="layout/footer :: footer"></div>

<form id="deleteForm" method="get" style="display:none;"></form>
<script>
    function confirmDelete(id) {
        if (confirm('Bỏ sản phẩm này khỏi danh sách yêu thích?')) {
            const form = document.getElementById('deleteForm');
            form.action = '/wishlist/delete/' + id;
            form.submit();
        }
    }
</script>
</body>
</html>
