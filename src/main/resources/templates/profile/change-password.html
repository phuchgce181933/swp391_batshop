<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu - BatShop</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        .main-wrapper { background-color: #f4f7f6; min-height: 100vh; }
        .bat-header { background-color: #ff6600; padding: 12px 5%; color: white; display: flex; justify-content: space-between; align-items: center; }
        .bat-header a { color: white; text-decoration: none; font-weight: bold; margin-left: 15px; font-size: 14px; }
        .form-container { display: flex; justify-content: center; padding: 50px 0; }
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn-back {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: #fff; color: #666; border: 1px solid #ccc; border-radius: 10px;
            text-decoration: none; font-weight: bold; font-size: 14px;
        }
        .btn-submit { flex: 1; margin-top: 0 !important; }
    </style>
</head>
<body>
<div class="main-wrapper">
    <div class="bat-header">
        <div style="font-size: 24px; font-weight: bold;">BAT<span>SHOP</span>.</div>
        <nav>
            <a th:href="@{/home}">Trang chủ</a>
            <a th:href="@{/profile/edit}">Hồ sơ</a>
            <a th:href="@{/logout}">Đăng xuất</a> </nav>
    </div>

    <div class="form-container">
        <div class="login-card" style="width: 400px;">
            <h2>Đổi mật khẩu</h2>
            <form th:action="@{/change-password}" method="post">
                <label>Mật khẩu cũ</label>
                <input type="password" name="oldPass" required>
                <label>Mật khẩu mới</label>
                <input type="password" name="newPass" required>
                <label>Nhập lại mật khẩu mới</label>
                <input type="password" name="confirmPass" required>

                <div class="btn-group">
                    <a th:href="@{/home}" class="btn-back">Quay lại</a>
                    <button type="submit" class="btn-submit">ĐỔI MẬT KHẨU</button>
                </div>
                <div class="error-box" th:if="${error}" th:text="${error}"></div>
                <div class="success-box" th:if="${success}" th:text="${success}"></div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
