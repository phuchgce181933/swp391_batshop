<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu - BatShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .main-content {
            padding: 60px 20px;
            max-width: 500px; /* Nhỏ gọn giống trang Edit */
            margin: auto;
        }
        .pass-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .pass-card h2 {
            color: #333;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #888;
            margin-bottom: 30px;
            font-size: 15px;
        }

        /* Style Input đồng bộ với edit-profile.html */
        .form-label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .form-control {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #eee;
            background-color: #fdfdfd;
            transition: 0.3s;
        }
        .form-control:focus {
            border-color: #ff6600;
            box-shadow: 0 0 0 0.25rem rgba(255, 102, 0, 0.1);
            background-color: #fff;
        }

        /* Group nút bấm đồng bộ action-group */
        .action-group {
            margin-top: 35px;
            display: flex;
            gap: 15px;
        }
        .btn-custom {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn-save {
            background: #ff6600; /* Màu cam đặc trưng BatShop */
            color: white;
            border: none;
        }
        .btn-save:hover {
            background: #e65c00;
            box-shadow: 0 5px 15px rgba(255,102,0,0.3);
            color: white;
        }
        .btn-cancel {
            background: #f8f9fa;
            color: #666;
            border: 1px solid #ddd;
        }
        .btn-cancel:hover {
            background: #eee;
            color: #333;
        }

        /* Thông báo lỗi đơn giản */
        .alert-error {
            background-color: #fff5f5;
            color: #e53e3e;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #feb2b2;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="main-content">
    <div class="pass-card">
        <div class="text-center">
            <h2>Đổi mật khẩu</h2>
            <p class="subtitle">Nhập mật khẩu cũ và mới để cập nhật</p>
        </div>

        <div th:if="${error}" class="alert-error">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/change-password}" method="post">
            <div class="mb-3">
                <label class="form-label">Mật khẩu hiện tại</label>
                <input type="password" name="oldPass" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mật khẩu mới</label>
                <input type="password" name="newPass" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Xác nhận mật khẩu</label>
                <input type="password" name="confirmPass" class="form-control" required>
            </div>

            <div class="action-group">
                <a th:href="@{/profile}" class="btn-custom btn-cancel">Quay lại</a>
                <button type="submit" class="btn-custom btn-save">
                    <i class="fa-solid fa-key me-2"></i> Cập nhật
                </button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
