<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ của tôi - BatShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .main-content { padding: 60px 20px; max-width: 900px; margin: auto; }
        .profile-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .profile-card h2 { color: #333; font-weight: 700; margin-bottom: 5px; }
        .subtitle { color: #888; margin-bottom: 35px; font-size: 15px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; color: #555; margin-bottom: 8px; font-size: 14px; text-transform: uppercase; }
        .info-box { background: #fdfdfd; padding: 14px 20px; border-radius: 10px; border: 1px solid #eee; color: #333; font-size: 16px; }
        .action-group { margin-top: 35px; display: flex; gap: 15px; }
        .btn-custom { padding: 12px 25px; border-radius: 10px; text-decoration: none; font-weight: 600; display: flex; align-items: center; justify-content: center; }
        .btn-edit { background: #ff6600; color: white; border: none; }
        .btn-password { background: #333; color: white; border: none; }

        /* TOAST GIỐNG HÌNH */
        .custom-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #d1e7dd;
            color: #0f5132;
            border: 1px solid #badbcc;
            padding: 16px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 280px;
            z-index: 9999;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            animation: slideIn 0.3s ease;
        }

        .toast-close {
            margin-left: auto;
            cursor: pointer;
            font-size: 18px;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="main-content">
    <div class="profile-card">
        <div class="text-center text-md-start">
            <h2>Hồ sơ cá nhân</h2>
            <p class="subtitle">Thông tin tài khoản chính thức của bạn tại BatShop</p>

            <div class="row">
                <div class="col-12 form-group">
                    <label><i class="fa-solid fa-user me-2 text-muted"></i>Họ tên</label>
                    <div class="info-box" th:text="${user.fullName}"></div>
                </div>

                <div class="col-md-7 form-group">
                    <label><i class="fa-solid fa-envelope me-2 text-muted"></i>Email</label>
                    <div class="info-box" th:text="${user.email}"></div>
                </div>

                <div class="col-md-5 form-group">
                    <label><i class="fa-solid fa-phone me-2 text-muted"></i>Số điện thoại</label>
                    <div class="info-box" th:text="${user.phone}"></div>
                </div>
            </div>

            <div class="action-group">
                <a th:href="@{/profile/edit}" class="btn-custom btn-edit">
                    <i class="fa-solid fa-user-pen me-2"></i> Chỉnh sửa hồ sơ
                </a>
                <a th:href="@{/change-password}" class="btn-custom btn-password">
                    <i class="fa-solid fa-key me-2"></i> Đổi mật khẩu
                </a>
            </div>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast-success" class="custom-toast" style="display:none;">
    <i class="fa-solid fa-circle-check"></i>
    <span>Cập nhật hồ sơ thành công!</span>
    <span class="toast-close">&times;</span>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        if (sessionStorage.getItem('updateSuccess')) {
            const toast = document.getElementById('toast-success');
            toast.style.display = 'flex';

            setTimeout(() => toast.style.display = 'none', 3000);

            toast.querySelector('.toast-close').onclick = () => {
                toast.style.display = 'none';
            };

            sessionStorage.removeItem('updateSuccess');
        }
    });
</script>

</body>
</html>
