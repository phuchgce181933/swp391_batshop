<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ của tôi - BatShop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* CSS đồng bộ với trang Change Password và Edit Profile */
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Thanh Header màu cam */
        .orange-header {
            background-color: #ff6600;
            padding: 15px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .orange-header .logo {
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        /* Khung nội dung chính */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 70px);
        }
        .profile-card {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 24px;
            color: #333;
        }
        .subtitle {
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
            color: #333;
        }
        .info-box {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #fdfdfd;
            font-size: 14px;
            color: #555;
            box-sizing: border-box;
        }

        /* Nút bấm đồng bộ kiểu dáng */
        .btn-action {
            width: 100%;
            padding: 13px;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: block;
            transition: 0.3s;
            margin-top: 15px;
            font-size: 14px;
        }
        .btn-red {
            background-color: #ff5252;
        }
        .btn-red:hover {
            background-color: #ff3838;
        }
        .btn-gray {
            background-color: #f0f0f0;
            color: #555;
            border: 1px solid #ddd;
        }
        .btn-gray:hover {
            background-color: #e0e0e0;
        }

        .footer-link {
            display: block;
            margin-top: 20px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>

<header class="orange-header">
    <a href="/home" class="logo">BATSHOP.</a>
    <nav class="nav-links">
        <a th:href="@{/home}">Trang chủ</a>
        <a th:href="@{/logout}">Đăng xuất</a>
    </nav>
</header>

<div class="main-content">
    <div class="profile-card">
        <h2>Hồ sơ cá nhân</h2>
        <p class="subtitle">Quản lý thông tin tài khoản của bạn</p>

        <div class="form-group">
            <label>Họ tên</label>
            <div class="info-box" th:text="${user.fullName}">Nhat Huy</div>
        </div>

        <div class="form-group">
            <label>Email</label>
            <div class="info-box" th:text="${user.email}">huydn2.ce190894@gmail.com</div>
        </div>

        <div class="form-group">
            <label>Số điện thoại</label>
            <div class="info-box" th:text="${user.phone}">0792165219</div>
        </div>

        <a th:href="@{/profile/edit}" class="btn-action btn-red">CHỈNH SỬA THÔNG TIN</a>

        <a th:href="@{/change-password}" class="btn-action btn-red">ĐỔI MẬT KHẨU</a>

        <a th:href="@{/home}" class="footer-link">Quay lại Trang chủ</a>
    </div>
</div>

</body>
</html>
