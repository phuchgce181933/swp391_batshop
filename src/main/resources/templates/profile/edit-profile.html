<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cập nhật hồ sơ - BatShop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .main-content { padding: 60px 20px; max-width: 600px; margin: auto; }
        .edit-card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        .edit-card h2 { color: #333; font-weight: 700; margin-bottom: 10px; }
        .subtitle { color: #888; margin-bottom: 30px; font-size: 15px; }
        .form-label { font-weight: 600; color: #555; font-size: 14px; text-transform: uppercase; margin-bottom: 8px; }
        .form-control { padding: 12px 15px; border-radius: 10px; border: 1px solid #eee; background-color: #fdfdfd; }
        .action-group { margin-top: 35px; display: flex; gap: 15px; }
        .btn-custom { flex: 1; padding: 12px; border-radius: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        .btn-save { background: #ff6600; color: white; border: none; }
        .btn-cancel { background: #f8f9fa; color: #666; border: 1px solid #ddd; }
        /* Style cho thông báo lỗi */
        .alert-custom { border-radius: 10px; margin-bottom: 20px; font-size: 14px; }
    </style>
</head>

<body>

<div th:replace="~{layout/header :: header}"></div>

<div class="main-content">
    <div class="edit-card">
        <div class="text-center">
            <h2>Cập nhật hồ sơ</h2>
            <p class="subtitle">Thay đổi thông tin cá nhân</p>
        </div>

        <div th:if="${error}" class="alert alert-danger alert-custom shadow-sm animate__animated animate__shakeX">
            <i class="fa-solid fa-triangle-exclamation me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/profile/edit}" method="post" th:object="${user}" id="editProfileForm">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label class="form-label">Họ tên</label>
                <input type="text" th:field="*{fullName}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" th:field="*{email}" class="form-control" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Số điện thoại</label>
                <input type="text" th:field="*{phone}" class="form-control"
                       required
                       pattern="\d{10}"
                       title="Số điện thoại phải gồm đúng 10 chữ số"
                       id="phoneInput">
                <div class="form-text mt-1" style="font-size: 12px;">Ví dụ: 0912345678</div>
            </div>

            <div class="action-group">
                <a th:href="@{/profile}" class="btn-custom btn-cancel">Hủy bỏ</a>
                <button type="submit" class="btn-custom btn-save shadow-sm">Lưu thay đổi</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Xử lý chuyển hướng khi thành công
    const params = new URLSearchParams(window.location.search);
    if (params.has("success")) {
        sessionStorage.setItem("updateSuccess", "true");
        window.location.href = "/profile";
    }

    // Validation Javascript lớp 2 (Tùy chọn nhưng nên có)
    document.getElementById('editProfileForm').onsubmit = function(e) {
        const phone = document.getElementById('phoneInput').value;
        const phoneRegex = /^\d{10}$/;

        if (!phoneRegex.test(phone)) {
            alert("Số điện thoại phải có đúng 10 chữ số!");
            e.preventDefault();
            return false;
        }
        return true;
    };
</script>

</body>
</html>
