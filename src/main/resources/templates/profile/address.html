<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Địa chỉ - BatShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .address-container { margin-top: 50px; margin-bottom: 50px; }
    .card { border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
    select:disabled { background-color: #f8f9fa; cursor: not-allowed; }
    .btn-primary { background-color: #ff6600; border: none; }
    .btn-primary:hover { background-color: #e65c00; }
    .badge-default { background-color: #28a745; font-size: 0.75rem; padding: 5px 10px; }
    .text-orange { color: #ff6600; }
  </style>
</head>
<body>
<div th:replace="layout/header :: header"></div>

<div class="container address-container">
  <div class="row">
    <div class="col-md-7">
      <h4 class="mb-4"><i class="fa-solid fa-map-location-dot text-orange"></i> Địa chỉ của tôi</h4>
      <div th:if="${#lists.isEmpty(addresses)}" class="alert alert-light border text-center">
        <p class="mb-0">Bạn chưa có địa chỉ nào được lưu.</p>
      </div>

      <div th:each="addr : ${addresses}" class="card mb-3">
        <div class="card-body d-flex justify-content-between align-items-start">
          <div>
            <span th:if="${addr.isDefault}" class="badge badge-default mb-2">
               <i class="fa-solid fa-circle-check"></i> Địa chỉ mặc định
            </span>
            <div class="mb-1">
              <span class="fw-bold fs-5" th:text="${addr.receiverName}"></span>
              <span class="text-muted mx-2">|</span>
              <span class="text-muted" th:text="${addr.receiverPhone}"></span>
            </div>
            <p class="mb-1 text-secondary" th:text="${addr.detail}"></p>
            <small class="text-muted" th:text="${addr.ward} + ', ' + ${addr.district} + ', ' + ${addr.city}"></small>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-warning btn-sm" th:onclick="'editAddress(' + ${addr.id} + ')'">
              <i class="fa-solid fa-pencil"></i>
            </button>

            <button type="button" class="btn btn-outline-danger btn-sm" th:onclick="'confirmDelete(' + ${addr.id} + ')'">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-5">
      <div class="card p-4 sticky-top" style="top: 20px;">
        <form th:action="@{/address/save}" method="post" id="addressForm">
          <h5 id="formTitle" class="mb-4 fw-bold">Thêm địa chỉ mới</h5>
          <input type="hidden" name="id" id="addressId">

          <div class="mb-3">
            <label class="form-label small fw-bold">Họ tên người nhận</label>
            <input type="text" class="form-control" name="receiverName" id="receiverName" required th:value="${user.fullName}">
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Số điện thoại người nhận</label>
            <input type="text" class="form-control" name="receiverPhone" id="receiverPhone" required th:value="${user.phone}">
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">Tỉnh/Thành phố</label>
            <select class="form-select" id="city" name="city" required><option value="">-- Chọn Tỉnh/Thành --</option></select>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Quận/Huyện</label>
            <select class="form-select" id="district" name="district" required disabled><option value="">-- Chọn Huyện --</option></select>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Phường/Xã</label>
            <select class="form-select" id="ward" name="ward" required disabled><option value="">-- Chọn Xã --</option></select>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">Số nhà, tên đường</label>
            <input type="text" class="form-control" name="detail" id="detail" placeholder="Ví dụ: 123 Đường ABC" required>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="isDefault" id="isDefaultCheck">
            <label class="form-check-label" for="isDefaultCheck">Đặt làm địa chỉ mặc định</label>
          </div>
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary">Lưu địa chỉ</button>
            <button type="button" onclick="resetForm()" class="btn btn-light border">Hủy / Làm mới</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div th:replace="layout/footer :: footer"></div>

<form id="deleteForm" method="get" style="display:none;"></form>

<script>
  const citis = document.getElementById("city");
  const districts = document.getElementById("district");
  const wards = document.getElementById("ward");
  let provinceData = [];

  // API Tỉnh thành
  fetch("https://provinces.open-api.vn/api/?depth=3")
          .then(res => res.json())
          .then(data => {
            provinceData = data;
            data.forEach(x => citis.options[citis.options.length] = new Option(x.name, x.name));
          });

  citis.onchange = () => {
    districts.length = 1; wards.length = 1;
    districts.disabled = wards.disabled = true;
    if (citis.value !== "") {
      const res = provinceData.find(n => n.name === citis.value);
      res.districts.forEach(k => districts.options[districts.options.length] = new Option(k.name, k.name));
      districts.disabled = false;
    }
  };

  districts.onchange = () => {
    wards.length = 1; wards.disabled = true;
    if (districts.value !== "") {
      const resC = provinceData.find(n => n.name === citis.value);
      const resD = resC.districts.find(m => m.name === districts.value);
      resD.wards.forEach(w => wards.options[wards.options.length] = new Option(w.name, w.name));
      wards.disabled = false;
    }
  };

  // Hàm Sửa
  function editAddress(id) {
    fetch('/address/get/' + id)
            .then(res => res.json())
            .then(data => {
              document.getElementById('formTitle').innerText = "Cập nhật địa chỉ";
              document.getElementById('addressId').value = data.id;
              document.getElementById('receiverName').value = data.receiverName;
              document.getElementById('receiverPhone').value = data.receiverPhone;
              document.getElementById('detail').value = data.detail;
              document.getElementById('isDefaultCheck').checked = data.isDefault;
              citis.value = data.city;
              citis.onchange();
              setTimeout(() => {
                districts.value = data.district;
                districts.onchange();
                setTimeout(() => { wards.value = data.ward; }, 300);
              }, 300);
              window.scrollTo({ top: 0, behavior: 'smooth' });
            });
  }

  // Hàm Xóa (CÁCH MỚI)
  function confirmDelete(id) {
    if (confirm('Bạn có chắc chắn muốn xóa địa chỉ này?')) {
      const deleteForm = document.getElementById('deleteForm');
      deleteForm.action = '/address/delete/' + id;
      deleteForm.submit();
    }
  }

  function resetForm() {
    document.getElementById('addressForm').reset();
    document.getElementById('addressId').value = "";
    document.getElementById('formTitle').innerText = "Thêm địa chỉ mới";
    districts.disabled = wards.disabled = true;
  }
</script>
</body>
</html>
