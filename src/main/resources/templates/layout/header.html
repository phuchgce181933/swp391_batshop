<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header th:fragment="header">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <div class="top-header">
        <div class="container">
            <div class="logo">
                <img src="/images/logo.png" alt="Logo">
            </div>

            <div class="hotline">
                HOTLINE: <span>0905087335</span> | <span>0905087335</span>
            </div>

            <div class="search-box">
                <input type="text" placeholder="Tìm sản phẩm...">
                <button>🔍</button>
            </div>

            <div class="top-icons">
                <div class="account-menu">
                    <a th:href="@{/profile/edit}" class="user-action">
                        <i class="fa-solid fa-circle-user"></i>
                        <span>Tài khoản</span>
                    </a>
                    <div class="dropdown-content">
                        <a th:href="@{/profile/edit}"><i class="fa-solid fa-user-pen"></i> Hồ sơ của tôi</a>
                        <a th:href="@{/address/list}"><i class="fa-solid fa-location-dot"></i> Địa chỉ của tôi</a>
                    </div>
                </div>
                <a th:href="@{/cart/list}" class="cart-link">
                    <i class="fa-solid fa-cart-shopping"></i> giỏ hàng
                </a>
            </div>
        </div>
    </div>

    <nav class="main-nav">
        <a th:href="@{/home}">Trang chủ</a>
        <a th:href="@{/products}">Sản phẩm</a>
        <a th:href="@{/sale}">Sale off</a>
        <a th:href="@{/blog}">Tin tức</a>
        <a th:href="@{/about}">Giới thiệu</a>
        <a th:href="@{/contact}">Liên hệ</a>
        <a th:href="@{/logout}" class="logout-btn">Đăng xuất</a>
    </nav>
</header>
</html>
