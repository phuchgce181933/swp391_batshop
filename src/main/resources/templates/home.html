<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - BatShop</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/user/banner.css}">
    <link rel="stylesheet" th:href="@{/css/user/home-flash-sale.css}">
    <link rel="stylesheet" th:href="@{/css/user/home-bestseller.css}">
    <link rel="stylesheet" th:href="@{/css/user/home-blog.css}">
    <link rel="stylesheet" th:href="@{/css/user/homeproduct.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
<div th:replace="~{layout/header :: header}"></div>

<div th:if="${successMessage}" class="alert success">
    <p th:text="${successMessage}"></p>
</div>
<div th:if="${errorMessage}" class="alert error">
    <p th:text="${errorMessage}"></p>
</div>

<div th:replace="~{user/banner/list :: banner-list}"></div>

<main class="main-content">

    <section class="section-container" id="new-products">
        <a th:href="@{/category?id=&sort=newest&page=0}" class="title-link">
            <h2 class="section-title">Sản phẩm mới</h2>
        </a>
        <div class="product-wrapper">
            <div th:replace="~{user/product/home-product :: home-product}"></div>
        </div>
    </section>

    <div th:replace="~{user/flash-sale/list :: flash-sale-list}"></div>

    <section class="section-container" th:if="${not #lists.isEmpty(topSellingProducts)}">
        <a th:href="@{/category?id=&sort=best_selling&page=0}" class="title-link">
            <h2 class="section-title top-selling-title">
                <i class="fa-solid fa-fire" style="color: #ff4757;"></i> SẢN PHẨM BÁN CHẠY
            </h2>
        </a>
        <div class="product-wrapper top-selling-wrapper">
            <div th:replace="~{user/productBestseller-list :: productBestseller-list}"></div>
        </div>
    </section>

    <section class="section-container">
        <a th:href="@{/category?id=1}" class="title-link">
            <h2 class="section-title">Sản phẩm cầu lông</h2>
        </a>
        <div th:replace="~{user/category/list :: category}"></div>
    </section>

    <section class="section-container">
        <a th:href="@{/blog}" class="title-link">
            <h2 class="section-title">Tin tức mới</h2>
        </a>
        <div th:replace="~{user/blog/list :: blog}"></div>
    </section>

</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const alerts = document.querySelectorAll(".alert");
        if (alerts.length > 0) {
            setTimeout(() => {
                alerts.forEach(alert => {
                    alert.classList.add("fade-out");
                    setTimeout(() => { alert.style.display = "none"; }, 500);
                });
            }, 5000);
        }
    });
</script>
<script>
    function scrollProductGrid(direction) {
        const grid = document.getElementById('productGrid');
        // Kích thước cuộn = Chiều rộng thẻ (230) + Gap (15)
        const scrollAmount = 245;
        grid.scrollBy({
            left: direction * scrollAmount,
            behavior: 'smooth'
        });
    }
</script>

</body>
</html>
