<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - BatShop</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/user/banner.css}">
    <link rel="stylesheet" th:href="@{/css/user/home-flash-sale.css}">
    <link rel="stylesheet" th:href="@{/css/user/home-bestseller.css}">
    <link rel="stylesheet" th:href="@{/css/user/homeproduct.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
<div th:replace="~{layout/header :: header}"></div>

<div th:if="${successMessage}" class="alert success">
    <p th:text="${successMessage}"></p>
</div>
<div th:if="${errorMessage}" class="alert error">
    <p th:text="${errorMessage}"></p>
</div>

<div th:replace="~{user/banner/list :: banner-list}"></div>

<div class="policy-bar-container">
    <div class="policy-bar">
        <div class="policy-item">
            <i class="fa-solid fa-truck-fast policy-icon"></i>
            <div class="policy-text">
                <strong>Vận chuyển TOÀN QUỐC</strong>
                <span>Thanh toán khi nhận hàng</span>
            </div>
        </div>
        <div class="policy-item">
            <i class="fa-solid fa-medal policy-icon"></i>
            <div class="policy-text">
                <strong>Bảo đảm chất lượng</strong>
                <span>Sản phẩm bảo đảm chất lượng</span>
            </div>
        </div>
        <div class="policy-item">
            <i class="fa-solid fa-credit-card policy-icon"></i>
            <div class="policy-text">
                <strong>Tiến hành THANH TOÁN</strong>
                <span>Với nhiều PHƯƠNG THỨC</span>
            </div>
        </div>
        <div class="policy-item">
            <i class="fa-solid fa-box-open policy-icon"></i>
            <div class="policy-text">
                <strong>Đổi sản phẩm mới</strong>
                <span>Nếu sản phẩm lỗi</span>
            </div>
        </div>
    </div>
</div>

<main class="main-content">





    <div th:replace="~{user/flash-sale/list :: flash-sale-list}"></div>


    <section class="section-container" th:if="${not #lists.isEmpty(topSellingProducts)}">
        <h2 class="section-title top-selling-title">
            <i class="fa-solid fa-fire" style="color: #ff4757;"></i> SẢN PHẨM BÁN CHẠY
        </h2>

        <div class="product-wrapper top-selling-wrapper">
            <div th:replace="~{user/productBestseller-list :: productBestseller-list}"></div>
        </div>
    </section>


    <section class="section-container">
        <h2 class="section-title">Sản phẩm cầu lông</h2>
        <div th:replace="~{user/category/list :: category}"></div>
    </section>
    <section class="section-container">
        <h2 class="section-title">Sản phẩm mới</h2>
        <div class="product-wrapper">
            <div th:replace="~{user/product/home-product :: home-product}"></div>        </div>
    </section>

    <section class="section-container">
        <h2 class="section-title">Tin tức mới</h2>
        <div th:replace="~{user/blog/list :: blog}"></div>
    </section>

</main>

<div th:replace="~{layout/footer :: footer}"></div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const alerts = document.querySelectorAll(".alert");
        if (alerts.length > 0) {
            setTimeout(() => {
                alerts.forEach(alert => {
                    alert.classList.add("fade-out");
                    setTimeout(() => { alert.style.display = "none"; }, 500);
                });
            }, 5000);
        }
    });
</script>

</body>
</html>
