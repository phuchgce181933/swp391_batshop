<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmashSports - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <style>
        /* --- General Styles --- */
        :root {
            --primary-color: #e63946;
            --secondary-color: #1d3557;
        }

        /* --- Wishlist Button --- */
        .btn-wishlist {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 5;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            color: #ccc;
        }
        .btn-wishlist:hover {
            background-color: #fff;
            color: #ff4757;
            transform: scale(1.1);
        }
        .product-img-wrapper {
            position: relative;
        }

        /* --- Flash Sale Specifics --- */
        .flash-sale-section {
            background: #fff0f0; /* Nền hồng nhạt để nổi bật */
            padding: 40px 0;
            margin-bottom: 3rem;
            border-top: 4px solid var(--primary-color);
        }
        .countdown-container {
            display: inline-flex;
            gap: 10px;
            align-items: center;
            margin-left: 15px;
        }
        .countdown-box {
            background: var(--primary-color);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .badge-flash {
            position: absolute;
            top: 0;
            left: 0;
            background: #ffcc00;
            color: #d00000;
            padding: 5px 10px;
            border-bottom-right-radius: 12px;
            font-size: 0.8rem;
            font-weight: 800;
            z-index: 2;
            text-transform: uppercase;
        }
        .flash-stock-status {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 10px;
            text-align: left;
        }
        .progress {
            height: 6px;
            margin-top: 5px;
            border-radius: 10px;
        }

        /* --- Blog Card Styles --- */
        .blog-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
            height: 100%;
            background: #fff;
        }
        .blog-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .blog-thumb {
            height: 200px;
            position: relative;
            overflow: hidden;
        }
        .blog-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.3s;
        }
        .blog-card:hover .blog-thumb img {
            transform: scale(1.1);
        }
        .blog-date {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.9);
            padding: 5px 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            color: var(--secondary-color);
            font-size: 0.8rem;
            line-height: 1.2;
        }
        .blog-date span {
            display: block;
            font-size: 1.2rem;
            color: var(--primary-color);
        }
        .blog-body {
            padding: 20px;
        }
        .blog-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .blog-title a {
            color: var(--secondary-color);
            text-decoration: none;
        }
        .blog-title a:hover {
            color: var(--primary-color);
        }
        .btn-read-more {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            font-size: 0.9rem;
        }
        /* Custom Button Color */
        .btn-primary-custom {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: white;
        }
        .btn-primary-custom:hover {
            background-color: #c92a36;
            border-color: #c92a36;
            color: white;
        }

        /* --- Hero Slider Styles --- */
        .carousel-item { height: 500px; }
        .carousel-item img {
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div th:replace="~{layout/header :: header}"></div>

<div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators" th:if="${banners != null and banners.size() > 1}">
        <button type="button" th:each="banner, iter : ${banners}"
                data-bs-target="#heroCarousel"
                th:data-bs-slide-to="${iter.index}"
                th:classappend="${iter.index == 0} ? 'active'"
                th:aria-current="${iter.index == 0} ? 'true' : 'false'"
                th:aria-label="'Slide ' + ${iter.count}">
        </button>
    </div>

    <div class="carousel-inner">
        <div th:if="${banners == null or #lists.isEmpty(banners)}" class="carousel-item active">
            <img th:src="@{/images/banner1.jpg}" class="d-block w-100" alt="Default Banner">
        </div>

        <div th:if="${banners != null}" th:each="banner, iterStat : ${banners}"
             class="carousel-item"
             th:classappend="${iterStat.index == 0} ? 'active'">

            <a th:if="${banner.link != null and banner.link != ''}" th:href="@{${banner.link}}">
                <img th:src="@{${banner.imageUrl}}" class="d-block w-100" th:alt="${banner.name}">
            </a>

            <div th:unless="${banner.link != null and banner.link != ''}">
                <img th:src="@{${banner.imageUrl}}" class="d-block w-100" th:alt="${banner.name}">
            </div>
        </div>
    </div>

    <th:block th:if="${banners != null and banners.size() > 1}">
        <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
        </button>
    </th:block>
</div>

<div class="container policy-section mt-4">
    <div class="row g-4">
        <div class="col-md-3 col-6">
            <div class="policy-box d-flex align-items-center gap-3 p-3 border rounded">
                <i class="fas fa-check-circle fa-2x text-primary"></i>
                <div><h6 class="mb-0 fw-bold">100% Authentic</h6><small class="text-muted">Genuine Products</small></div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="policy-box d-flex align-items-center gap-3 p-3 border rounded">
                <i class="fas fa-shipping-fast fa-2x text-primary"></i>
                <div><h6 class="mb-0 fw-bold">Fast Delivery</h6><small class="text-muted">Nationwide Shipping</small></div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="policy-box d-flex align-items-center gap-3 p-3 border rounded">
                <i class="fas fa-exchange-alt fa-2x text-primary"></i>
                <div><h6 class="mb-0 fw-bold">Easy Return</h6><small class="text-muted">7 Days Return</small></div>
            </div>
        </div>
        <div class="col-md-3 col-6">
            <div class="policy-box d-flex align-items-center gap-3 p-3 border rounded">
                <i class="fas fa-headset fa-2x text-primary"></i>
                <div><h6 class="mb-0 fw-bold">24/7 Support</h6><small class="text-muted">Expert Advice</small></div>
            </div>
        </div>
    </div>
</div>



<div th:replace="~{layout/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
