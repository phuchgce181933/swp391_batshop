<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" th:href="@{/css/homeproduct.css}">

    <style>
        /* Khung hiển thị chính: Cố định chiều cao */
        .slider-container {
            position: relative;
            width: 100%;
            height: 550px; /* Chiều cao cố định (có thể chỉnh 500px-600px) */
            overflow: hidden; /* Ẩn các phần thừa */
            background-color: #ddd;
        }

        /* Dải chứa toàn bộ các slide */
        .slider-track {
            display: flex;
            height: 100%;
            width: 100%;
            /* Lưu ý: transition sẽ được xử lý bằng JS để làm trùm infinity loop */
        }

        /* Từng slide đơn lẻ */
        .slide {
            min-width: 100%; /* Mỗi slide chiếm trọn chiều rộng khung */
            height: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ảnh tự cắt để lấp đầy khung, không bị méo */
            object-position: center;
        }

        /* Nút điều hướng (Mũi tên) */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: none;
            font-size: 2.5rem;
            padding: 10px 15px;
            cursor: pointer;
            z-index: 10;
            transition: 0.3s;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.8);
        }

        .prev { left: 10px; border-radius: 5px; }
        .next { right: 10px; border-radius: 5px; }

        /* Ẩn nút nếu không cần thiết (xử lý logic sau) */
        .hidden { display: none; }
    </style>
</head>
<body>

<div th:replace="layout/header :: header"></div>

<main style="padding: 0; margin: 0;"> <section th:if="${!banners.isEmpty()}" class="slider-container" id="sliderContainer">

    <div class="slider-track" id="sliderTrack">
        <div th:each="b : ${banners}" class="slide">
            <a th:if="${b.link != null && b.link != ''}" th:href="${b.link}" style="display:block; height:100%">
                <img th:src="@{/uploads/{img}(img=${b.image})}" th:alt="${b.name}">
            </a>

            <div th:if="${b.link == null || b.link == ''}" style="height:100%">
                <img th:src="@{/uploads/{img}(img=${b.image})}" th:alt="${b.name}">
            </div>
        </div>
    </div>

    <button class="nav-btn prev" id="prevBtn">&#10094;</button>
    <button class="nav-btn next" id="nextBtn">&#10095;</button>

</section>

    <div style="padding: 20px;">
        <h1 style="text-align: center; margin-top: 20px;">Welcome to BatShop</h1>
        <div th:replace="user/productvariant-list :: productvariant-list"></div>
    </div>
</main>

<div th:replace="layout/footer :: footer"></div>


<script th:if="${banners.size() > 1}">
    const track = document.getElementById('sliderTrack');
    const slides = document.querySelectorAll('.slide');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentIndex = 1; // Bắt đầu từ 1 vì ta sẽ thêm bản sao vào đầu
    const slideWidth = 100; // Đơn vị %
    const intervalTime = 4000; // Thời gian chuyển: 4 giây
    let slideInterval;

    // --- BƯỚC 1: TẠO HIỆU ỨNG VÔ TẬN (CLONING) ---
    // Nhân bản slide đầu và slide cuối
    const firstClone = slides[0].cloneNode(true);
    const lastClone = slides[slides.length - 1].cloneNode(true);

    firstClone.id = 'first-clone';
    lastClone.id = 'last-clone';

    // Thêm bản sao vào DOM
    track.append(firstClone); // Thêm bản sao của thằng 1 vào cuối
    track.prepend(lastClone); // Thêm bản sao của thằng cuối lên đầu

    // Cập nhật lại danh sách slide sau khi thêm clone
    const allSlides = document.querySelectorAll('.slide');

    // Dịch chuyển track đến vị trí slide thực đầu tiên (bỏ qua slide clone ở đầu)
    track.style.transform = `translateX(${-slideWidth * currentIndex}%)`;

    // --- BƯỚC 2: HÀM DI CHUYỂN ---
    const moveToNextSlide = () => {
        if (currentIndex >= allSlides.length - 1) return; // Chặn spam click
        currentIndex++;
        track.style.transition = 'transform 0.6s ease-in-out'; // Bật hiệu ứng trượt
        track.style.transform = `translateX(${-slideWidth * currentIndex}%)`;
    };

    const moveToPrevSlide = () => {
        if (currentIndex <= 0) return;
        currentIndex--;
        track.style.transition = 'transform 0.6s ease-in-out';
        track.style.transform = `translateX(${-slideWidth * currentIndex}%)`;
    };

    // --- BƯỚC 3: XỬ LÝ RESET VỊ TRÍ (MẤU CHỐT CỦA INFINITY) ---
    track.addEventListener('transitionend', () => {
        // Nếu đang ở bản sao cuối cùng -> Nhảy tức thì về slide thực đầu tiên
        if (allSlides[currentIndex].id === 'first-clone') {
            track.style.transition = 'none'; // Tắt hiệu ứng để nhảy không ai biết
            currentIndex = 1;
            track.style.transform = `translateX(${-slideWidth * currentIndex}%)`;
        }

        // Nếu đang ở bản sao đầu tiên -> Nhảy tức thì về slide thực cuối cùng
        if (allSlides[currentIndex].id === 'last-clone') {
            track.style.transition = 'none';
            currentIndex = allSlides.length - 2;
            track.style.transform = `translateX(${-slideWidth * currentIndex}%)`;
        }
    });

    // --- BƯỚC 4: SỰ KIỆN NÚT BẤM VÀ TỰ ĐỘNG CHẠY ---

    // Nút Next
    nextBtn.addEventListener('click', () => {
        moveToNextSlide();
        resetTimer();
    });

    // Nút Prev
    prevBtn.addEventListener('click', () => {
        moveToPrevSlide();
        resetTimer();
    });

    // Tự động chạy
    const startSlide = () => {
        slideInterval = setInterval(moveToNextSlide, intervalTime);
    };

    const resetTimer = () => {
        clearInterval(slideInterval);
        startSlide();
    };

    // Khởi chạy
    startSlide();

    // Tạm dừng khi chuột di vào banner (tùy chọn, giúp người dùng dễ xem)
    const container = document.getElementById('sliderContainer');
    container.addEventListener('mouseenter', () => clearInterval(slideInterval));
    container.addEventListener('mouseleave', startSlide);

</script>

<script th:if="${banners.size() <= 1}">
    // Ẩn nút nếu ít banner
    document.getElementById('prevBtn').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
</script>

</body>
</html>
