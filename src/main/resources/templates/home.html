<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Home - BatShop</title>
    <link rel="stylesheet" th:href="@{/css/homeproduct.css}">

    <style>
        /* Container chính của banner: Full width, chiều cao cố định hoặc theo tỷ lệ */
        .banner-container {
            position: relative;
            width: 100%;
            height: 500px; /* Bạn có thể chỉnh chiều cao banner ở đây */
            overflow: hidden;
            background-color: #f0f0f0;
            margin-bottom: 20px;
        }

        /* Dải chứa các ảnh */
        .banner-track {
            display: flex;
            height: 100%;
            transition: transform 0.5s ease-in-out;
            width: 100%;
        }

        /* Từng slide ảnh */
        .banner-slide {
            min-width: 100%; /* Mỗi ảnh chiếm trọn chiều rộng khung */
            height: 100%;
            position: relative;
        }

        .banner-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Đảm bảo ảnh phủ kín khung mà không bị méo */
            display: block;
        }

        /* Nút điều hướng */
        .banner-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.3);
            color: white;
            border: none;
            padding: 15px;
            cursor: pointer;
            z-index: 10;
            font-size: 18px;
            border-radius: 50%;
            transition: background 0.3s;
            user-select: none;
        }

        .banner-btn:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }

        .prev-btn { left: 20px; }
        .next-btn { right: 20px; }

        /* Ẩn nút nếu chỉ có 1 banner (xử lý bằng CSS kết hợp Thymeleaf logic class) */
        .hidden-btn { display: none !important; }

    </style>
</head>
<body>

<div th:replace="layout/header :: header"></div>

<div class="banner-container" th:if="${not #lists.isEmpty(banners)}">
<!--    phước-->
    <div class="banner-track" id="bannerTrack">
        <div class="banner-slide" th:each="banner : ${banners}">
            <img th:src="@{'/uploads/product/' + ${banner.image}}" th:alt="${banner.name}">
        </div>
    </div>

    <button class="banner-btn prev-btn" id="prevBtn" th:if="${banners.size() > 1}">&#10094;</button>
    <button class="banner-btn next-btn" id="nextBtn" th:if="${banners.size() > 1}">&#10095;</button>
</div>
<!--phước-->
<main style="padding:20px">
    <h1>Welcome to BatShop</h1>
    <div th:replace="user/productvariant-list :: productvariant-list"></div>
</main>

<div th:replace="layout/footer :: footer"></div>

<script th:inline="javascript">
    /* Lấy số lượng banner từ model để JS xử lý */
    const totalBanners = [[${banners.size()}]];

    // Chỉ chạy script nếu có nhiều hơn 1 banner
    if (totalBanners > 1) {
        const track = document.getElementById('bannerTrack');
        const slides = document.querySelectorAll('.banner-slide');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');

        let currentIndex = 1;
        let slideInterval;
        const intervalTime = 4000; // Thời gian chuyển slide (4 giây)

        // LOGIC INFINITY LOOP (VÒNG LẶP VÔ TẬN)
        // Clone slide đầu và cuối để tạo hiệu ứng trượt mượt mà khi quay vòng
        const firstClone = slides[0].cloneNode(true);
        const lastClone = slides[slides.length - 1].cloneNode(true);

        firstClone.id = 'first-clone';
        lastClone.id = 'last-clone';

        track.append(firstClone);
        track.prepend(lastClone);

        const slideWidth = slides[0].clientWidth; // Lấy chiều rộng 1 slide

        // Đặt vị trí ban đầu (bỏ qua bản clone đầu tiên)
        track.style.transform = `translateX(${-slideWidth * currentIndex}px)`;

        // Hàm chuyển slide
        const moveToSlide = (index) => {
            track.style.transition = 'transform 0.5s ease-in-out';
            track.style.transform = `translateX(${-slideWidth * index}px)`;
            currentIndex = index;
        };

        const nextSlide = () => {
            if (currentIndex >= slides.length + 1) return;
            moveToSlide(currentIndex + 1);
        };

        const prevSlide = () => {
            if (currentIndex <= 0) return;
            moveToSlide(currentIndex - 1);
        };

        // Sự kiện click nút
        nextBtn.addEventListener('click', () => {
            nextSlide();
            resetTimer();
        });

        prevBtn.addEventListener('click', () => {
            prevSlide();
            resetTimer();
        });

        // Xử lý khi slide chạy hết animation (Transition End)
        // Đây là bí mật của Infinity Loop: Khi chạy đến bản clone, nó sẽ nhảy tức thì về bản gốc
        track.addEventListener('transitionend', () => {
            const allSlides = document.querySelectorAll('.banner-slide');
            if (allSlides[currentIndex].id === 'first-clone') {
                track.style.transition = 'none';
                currentIndex = 1;
                track.style.transform = `translateX(${-slideWidth * currentIndex}px)`;
            }
            if (allSlides[currentIndex].id === 'last-clone') {
                track.style.transition = 'none';
                currentIndex = slides.length;
                track.style.transform = `translateX(${-slideWidth * currentIndex}px)`;
            }
        });

        // Tự động chạy (Auto play)
        const startSlide = () => {
            slideInterval = setInterval(nextSlide, intervalTime);
        };

        const resetTimer = () => {
            clearInterval(slideInterval);
            startSlide();
        };

        // Xử lý resize cửa sổ (cập nhật lại chiều rộng slide)
        window.addEventListener('resize', () => {
            const newSlideWidth = document.querySelector('.banner-slide').clientWidth;
            track.style.transition = 'none';
            track.style.transform = `translateX(${-newSlideWidth * currentIndex}px)`;
        });

        // Bắt đầu chạy
        startSlide();
    }
</script>

</body>
</html>
