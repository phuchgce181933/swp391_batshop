<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - VNB Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body {
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }

        .forgot-password-card {
            max-width: 450px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            background: #fff;
            border: 1px solid rgba(0,0,0,0.05);
        }

        /* --- ĐỒNG BỘ LOGO CHỮ VNB --- */
        .vnb-logo-container {
            margin-bottom: 25px;
            text-align: center;
        }

        .vnb-text-logo {
            font-size: 42px;
            font-weight: 900;
            color: #d32f2f;
            letter-spacing: -2px;
            display: inline-block;
            position: relative;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
            line-height: 1;
        }

        .vnb-text-logo .logo-dot {
            color: #ff9800;
            font-size: 52px;
            line-height: 0;
        }

        .vnb-text-logo::after {
            content: '';
            display: block;
            width: 35px;
            height: 4px;
            background: #ff9800;
            margin: 5px auto 0;
            border-radius: 2px;
        }

        /* --- CUSTOM FORM --- */
        .step-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-label {
            font-weight: 700;
            color: #555;
            margin-top: 10px;
        }

        .form-control {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #d32f2f;
            box-shadow: 0 0 0 4px rgba(211,47,47,0.1);
            outline: none;
        }

        .input-group-text {
            border-radius: 10px 0 0 10px !important;
            background-color: #f8f9fa;
            border-color: #ddd;
        }

        .form-control.border-start-0 {
            border-radius: 0 10px 10px 0 !important;
        }

        /* --- BUTTON ĐỒNG BỘ MÀU ĐỎ --- */
        .btn-vnb {
            background: #d32f2f;
            border: none;
            padding: 14px;
            font-weight: 800;
            color: white;
            border-radius: 12px;
            width: 100%;
            margin-top: 20px;
            transition: 0.3s;
        }

        .btn-vnb:hover {
            background: #b71c1c;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(211,47,47,0.3);
            color: white;
        }

        .back-link {
            color: #d32f2f;
            font-weight: bold;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #ff9800;
        }

        .error-box {
            background: #fff1f0;
            color: #d32f2f;
            border: 1px solid #ffa39e;
            padding: 12px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="forgot-password-card">
    <div class="vnb-logo-container">
        <div class="vnb-text-logo">
            VNB<span class="logo-dot">.</span>
        </div>
    </div>

    <h5 class="step-title">Khôi phục mật khẩu</h5>
    <p class="text-muted text-center small mb-4">Nhập email của bạn để nhận mã xác nhận bảo mật</p>

    <form th:action="@{/forgot-password}" method="post">
        <div class="mb-3">
            <label class="form-label small">Email đăng ký</label>
            <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-envelope text-muted"></i></span>
                <input type="email" name="email" class="form-control border-start-0" placeholder="Nhập email của bạn..." required>
            </div>
        </div>

        <button type="submit" class="btn btn-vnb">GỬI MÃ XÁC NHẬN</button>

        <div th:if="${error}" class="error-box" th:text="${error}"></div>

        <div class="text-center mt-4 pt-3" style="border-top: 1px solid #eee;">
            <a th:href="@{/login}" class="back-link small">
                <i class="fa-solid fa-arrow-left"></i> Quay lại Đăng nhập
            </a>
        </div>
    </form>
</div>

</body>
</html>
