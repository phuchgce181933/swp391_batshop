<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - BatShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .forgot-password-card { max-width: 450px; width: 100%; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: #fff; border: none; }
        .brand-logo { font-size: 2rem; font-weight: bold; color: #ff6600; text-align: center; margin-bottom: 20px; }
        .btn-primary { background-color: #ff6600; border: none; padding: 10px; font-weight: 600; }
        .btn-primary:hover { background-color: #e65c00; }
        .step-title { font-size: 1.25rem; font-weight: 600; color: #333; margin-bottom: 25px; text-align: center; }
    </style>
</head>
<body>

<div class="forgot-password-card">
    <div class="brand-logo"><i class="fa-solid fa-bolt"></i> BATSHOP</div>
    <h5 class="step-title">Khôi phục mật khẩu</h5>
    <p class="text-muted text-center small mb-4">Nhập email của bạn để nhận mã xác nhận</p>

    <form th:action="@{/forgot-password}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Email đăng ký</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                <input type="email" name="email" class="form-control border-start-0" placeholder="example@gmail.com" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 mt-2">Gửi mã xác nhận</button>

        <div th:if="${error}" class="alert alert-danger mt-3 small p-2 text-center" th:text="${error}"></div>

        <div class="text-center mt-4">
            <a th:href="@{/login}" class="text-decoration-none small text-muted"><i class="fa-solid fa-arrow-left"></i> Quay lại đăng nhập</a>
        </div>
    </form>
</div>

</body>
</html>
