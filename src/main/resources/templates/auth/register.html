<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BatShop Register</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>

<div class="container">

    <!-- LEFT -->
    <div class="left-panel">
        <a href="/" class="home-btn">← Home</a>

        <div class="brand">
            <h1>BAT<span>SHOP</span>.</h1>
            <p>
                Join the BatShop community.<br>
                Create your account today.
            </p>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">

        <div class="card">
            <form th:action="@{/register}" th:object="${user}" method="post">

                <label>Họ tên</label>
                <input type="text" th:field="*{fullName}" required>

                <!-- EMAIL -->
                <label>Email</label>

                <div class="error-box"
                     th:if="${errorEmail}"
                     th:text="${errorEmail}">
                </div>

                <input type="email"
                       th:field="*{email}"
                       th:classappend="${errorEmail} ? 'input-error' : ''"
                       required>

                <!-- PHONE — không check trùng -->
                <label>Số điện thoại</label>
                <input type="text" th:field="*{phone}">

                <label>Mật khẩu</label>
                <input type="password" th:field="*{passwordHash}" required>

                <button type="submit">ĐĂNG KÝ</button>

            </form>
        </div>

    </div>

</div>

</body>
</html>
