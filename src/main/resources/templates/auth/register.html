<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BatShop Register</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <style>
        .error-message { color: #ff0000; font-size: 0.8rem; margin-bottom: 5px; font-weight: bold; }
        .input-error { border: 1px solid #ff0000 !important; }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
            100% { transform: translateX(0); }
        }
        .shake-it {
            animation: shake 0.3s ease-in-out;
            border: 2px solid #ff4d4d !important;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.5);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left-panel">
        <a href="/" class="home-btn">← Home</a>
        <div class="brand">
            <h1>BAT<span>SHOP</span>.</h1>
            <p>Join the BatShop community.<br>Create your account today.</p>
        </div>
    </div>

    <div class="right-panel">
        <div class="card">
            <form th:action="@{/register}" th:object="${user}" method="post">

                <label>Họ tên</label>
                <input type="text" th:field="*{fullName}" required>

                <label>Email</label>
                <div class="error-message" th:if="${errorEmail}" th:text="${errorEmail}"></div>
                <input type="email" th:field="*{email}" th:classappend="${errorEmail} ? 'input-error' : ''" required>

                <label>Số điện thoại</label>
                <div id="js-phone-error" class="error-message" style="display:none;">Vui lòng chỉ nhập số!</div>
                <div class="error-message" th:if="${errorPhone}" th:text="${errorPhone}"></div>

                <input type="text"
                       id="phoneInput"
                       th:field="*{phone}"
                       th:classappend="${errorPhone} ? 'input-error' : ''"
                       maxlength="10"
                       placeholder="Nhập 10 số điện thoại"
                       required>

                <label>Mật khẩu</label>
                <input type="password" th:field="*{passwordHash}" required>

                <button type="submit">ĐĂNG KÝ</button>

            </form>
        </div>
    </div>

</div>

<script>
    const phoneInput = document.getElementById('phoneInput');
    const jsError = document.getElementById('js-phone-error');

    phoneInput.addEventListener('input', function() {
        const val = this.value;
        // Kiểm tra nếu có chứa bất kỳ ký tự nào không phải số
        if (/[^0-9]/.test(val)) {
            // Hiện cảnh báo và rung
            jsError.style.display = 'block';
            this.classList.add('shake-it');

            // Xóa hiệu ứng sau khi rung xong để lần sau có thể rung tiếp
            setTimeout(() => {
                this.classList.remove('shake-it');
            }, 300);
        } else {
            jsError.style.display = 'none';
        }
    });
</script>

</body>
</html>
