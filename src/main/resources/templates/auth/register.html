<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VNB Shop - Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div class="container">
    <div class="left-panel">
        <a th:href="@{/home}" class="home-btn"><i class="fa-solid fa-house"></i> Trang chủ</a>
        <div class="brand">
            <h1>VNB<span>SHOP</span>.</h1>
            <p>Hệ thống shop cầu lông số 1 Việt Nam.</p>
        </div>
    </div>

    <div class="right-panel">
        <div class="login-card">
            <h2>Đăng ký tài khoản</h2>
            <p class="sub">Nhập thông tin để tạo tài khoản VNB</p>

            <form th:action="@{/register}" th:object="${user}" method="post" id="registerForm" novalidate>

                <div class="form-group-vnb">
                    <label>Họ và tên</label>
                    <input type="text" id="nameInput" th:field="*{fullName}" placeholder="Nhập họ tên..." required>
                    <span id="js-name-error" class="error-message" style="display:none;">⚠ Vui lòng nhập họ tên!</span>
                </div>

                <div class="form-group-vnb">
                    <label>Email (Gmail)</label>
                    <input type="email" id="emailInput" th:field="*{email}"
                           th:classappend="${errorEmail} ? 'input-error' : ''"
                           placeholder="example@gmail.com" required>
                    <span id="server-email-error" class="error-message" th:if="${errorEmail}" th:text="${errorEmail}"></span>
                    <span id="js-email-error" class="error-message" style="display:none;"></span>
                </div>

                <div class="form-group-vnb">
                    <label>Số điện thoại</label>
                    <input type="text" id="phoneInput" th:field="*{phone}"
                           th:classappend="${errorPhone} ? 'input-error' : ''"
                           placeholder="Nhập số điện thoại..." required>
                    <span id="server-phone-error" class="error-message" th:if="${errorPhone}" th:text="${errorPhone}"></span>
                    <span id="js-phone-error" class="error-message" style="display:none;"></span>
                </div>

                <div class="form-group-vnb">
                    <label>Mật khẩu</label>
                    <input type="password" id="passwordInput" th:field="*{passwordHash}" placeholder="Nhập mật khẩu..." required>
                    <span id="js-pass-error" class="error-message" style="display:none;">⚠ Vui lòng nhập mật khẩu!</span>
                </div>

                <button type="submit">ĐĂNG KÝ NGAY</button>

                <div class="register-container">
                    <p>Đã có tài khoản? <a th:href="@{/login}" class="register-link">Đăng nhập</a></p>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('registerForm');
    const nameInput = document.getElementById('nameInput');
    const emailInput = document.getElementById('emailInput');
    const phoneInput = document.getElementById('phoneInput');
    const passwordInput = document.getElementById('passwordInput');

    const jsNameErr = document.getElementById('js-name-error');
    const jsEmailErr = document.getElementById('js-email-error');
    const jsPhoneErr = document.getElementById('js-phone-error');
    const jsPassErr = document.getElementById('js-pass-error');

    const serverEmailErr = document.getElementById('server-email-error');
    const serverPhoneErr = document.getElementById('server-phone-error');

    form.addEventListener('submit', function(e) {
        let hasError = false;

        const nameVal = nameInput.value.trim();
        const emailVal = emailInput.value.trim();
        const phoneVal = phoneInput.value.trim();
        const passVal = passwordInput.value.trim();

        // Reset trạng thái lỗi
        [jsNameErr, jsEmailErr, jsPhoneErr, jsPassErr].forEach(el => el.style.display = 'none');
        [nameInput, emailInput, phoneInput, passwordInput].forEach(el => el.classList.remove('input-error'));

        // 1. Check Họ Tên rỗng
        if (nameVal === "") {
            jsNameErr.style.display = 'block';
            nameInput.classList.add('input-error');
            hasError = true;
        }

        // 2. Check Email (Rỗng & Định dạng)
        if (emailVal === "") {
            jsEmailErr.innerText = "⚠ Vui lòng nhập Email!";
            jsEmailErr.style.display = 'block';
            emailInput.classList.add('input-error');
            hasError = true;
        } else if (!emailVal.endsWith("@gmail.com")) {
            if (serverEmailErr) serverEmailErr.style.display = 'none';
            jsEmailErr.innerText = "⚠ Email phải có đuôi @gmail.com";
            jsEmailErr.style.display = 'block';
            emailInput.classList.add('input-error');
            hasError = true;
        }

        // 3. Check Số điện thoại (Rỗng, Chữ, Độ dài)
        if (phoneVal === "") {
            jsPhoneErr.innerText = "⚠ Vui lòng nhập số điện thoại!";
            jsPhoneErr.style.display = 'block';
            phoneInput.classList.add('input-error');
            hasError = true;
        } else if (/[^0-9]/.test(phoneVal)) {
            if (serverPhoneErr) serverPhoneErr.style.display = 'none';
            jsPhoneErr.innerText = "⚠ Số điện thoại không được chứa chữ!";
            jsPhoneErr.style.display = 'block';
            phoneInput.classList.add('input-error');
            hasError = true;
        } else if (phoneVal.length !== 10) {
            if (serverPhoneErr) serverPhoneErr.style.display = 'none';
            jsPhoneErr.innerText = "⚠ Số điện thoại phải đúng 10 số!";
            jsPhoneErr.style.display = 'block';
            phoneInput.classList.add('input-error');
            hasError = true;
        }

        // 4. Check Mật khẩu rỗng
        if (passVal === "") {
            jsPassErr.style.display = 'block';
            passwordInput.classList.add('input-error');
            hasError = true;
        }

        // Nếu có lỗi thì chặn gửi form và xóa pass cho bảo mật
        if (hasError) {
            e.preventDefault();
            passwordInput.value = "";
            passwordInput.focus();
        }
    });

    // Xử lý ẩn lỗi khi người dùng nhập lại
    [nameInput, emailInput, phoneInput, passwordInput].forEach(input => {
        input.addEventListener('input', function() {
            this.classList.remove('input-error');
            const parent = this.parentElement;
            const errs = parent.querySelectorAll('.error-message');
            errs.forEach(err => err.style.display = 'none');
        });
    });

    // Xóa pass nếu load trang mà có lỗi từ Server (trùng SĐT/Email)
    window.addEventListener("load", function() {
        if ((serverPhoneErr && serverPhoneErr.innerText.trim() !== "") ||
            (serverEmailErr && serverEmailErr.innerText.trim() !== "")) {
            passwordInput.value = "";
            passwordInput.focus();
        }
    });
</script>
</body>
</html>
