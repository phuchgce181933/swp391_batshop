<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - BatShop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .forgot-password-card { max-width: 450px; width: 100%; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: #fff; border: none; }
        .btn-primary { background-color: #ff6600; border: none; padding: 10px; font-weight: 600; }
        .btn-primary:hover { background-color: #e65c00; }
        .step-title { font-size: 1.25rem; font-weight: 600; color: #333; margin-bottom: 20px; text-align: center; }
        .back-to-login { display: block; text-align: center; margin-top: 20px; font-size: 0.85rem; color: #6c757d; text-decoration: none; }
        .back-to-login:hover { color: #ff6600; }
    </style>
</head>
<body>

<div class="forgot-password-card">
    <h5 class="step-title">Đặt lại mật khẩu</h5>
    <p class="text-muted text-center small mb-4">Vui lòng nhập mã OTP và mật khẩu mới</p>

    <form th:action="@{/reset-password}" method="post" onsubmit="return validatePasswords()">

        <input type="hidden" name="email" th:value="${email}">

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Mã xác nhận (OTP)</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                <input type="text" name="code" class="form-control" placeholder="Nhập mã 6 số" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Mật khẩu mới</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
                <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="Nhập mật khẩu mới" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-bold text-secondary">Xác nhận mật khẩu</label>
            <div class="input-group">
                <span class="input-group-text bg-light"><i class="fa-solid fa-shield-halved text-muted"></i></span>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" required>
            </div>
            <div id="passwordError" class="text-danger small mt-1" style="display:none;">Mật khẩu xác nhận không khớp!</div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Xác nhận đổi mật khẩu</button>

        <div th:if="${error}" class="alert alert-danger mt-3 small p-2 text-center" th:text="${error}"></div>

        <a th:href="@{/login}" class="back-to-login">
            <i class="fa-solid fa-arrow-left me-1"></i> Quay lại trang đăng nhập
        </a>
    </form>
</div>

<script>
    function validatePasswords() {
        const pass = document.getElementById('newPassword').value;
        const confirm = document.getElementById('confirmPassword').value;
        const errorDiv = document.getElementById('passwordError');

        if (pass !== confirm) {
            errorDiv.style.display = 'block';
            return false;
        }
        errorDiv.style.display = 'none';
        return true;
    }
</script>

</body>
</html>
